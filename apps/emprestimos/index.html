/* ============================================================
   SUGESTÕES ENQUANTO DIGITA
   ============================================================ */
const FONTES={
  func:()=>state.funcionarios.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'))
    .map(f=>({v:f.nome,busca:f.nome+' '+f.folha,n:0}))
};
function realce(txt,q){
  if(!q) return esc(txt);
  const i=semAcento(txt).indexOf(q);
  if(i<0) return esc(txt);
  return esc(txt.slice(0,i))+'<b>'+esc(txt.slice(i,i+q.length))+'</b>'+esc(txt.slice(i+q.length));
}
function ligaSugestoes(raiz){
  $$('[data-sug]',raiz||document).forEach(inp=>{
    if(inp._sug)return; inp._sug=true;
    const fonte=FONTES[inp.dataset.sug]; if(!fonte)return;
    const lab=inp.closest('label')||inp.parentElement;
    lab.classList.add('sugwrap');
    const cx=document.createElement('div'); cx.className='sugbox'; cx.hidden=true;
    lab.appendChild(cx);
    let itens=[], idx=-1;

    const fechar=()=>{cx.hidden=true; idx=-1;};
    function abrir(){
      const q=semAcento(inp.value.trim());
      let r=fonte();
      if(q) r=r.filter(x=>semAcento(x.busca||x.v).indexOf(q)>=0);
      if(r.length===1 && semAcento(r[0].v)===q) return fechar();
      r=r.slice(0,10);
      if(!r.length) return fechar();
      itens=r; idx=-1;
      cx.innerHTML=r.map((x,i)=>'<button type="button" class="sugit" data-i="'+i+'">'+realce(x.v,q)+'</button>').join('');
      cx.hidden=false;
    }
    function escolhe(i){
      if(i<0||i>=itens.length)return;
      inp.value=itens[i].v; fechar();
      inp.dispatchEvent(new Event('input',{bubbles:true}));
      inp.dispatchEvent(new Event('change',{bubbles:true}));
      fechar();
    }
    const marca=()=>$$('.sugit',cx).forEach((b,i)=>{
      b.classList.toggle('on',i===idx);
      if(i===idx && b.scrollIntoView) b.scrollIntoView({block:'nearest'});
    });

    inp.setAttribute('autocomplete','off');
    inp.addEventListener('input',e=>{ if(e.isTrusted) abrir(); });
    inp.addEventListener('focus',abrir);
    /* o clique na sugestão chega depois do blur: espera um pouco antes de sumir */
    inp.addEventListener('blur',()=>setTimeout(fechar,150));
    inp.addEventListener('keydown',e=>{
      if(cx.hidden){ if(e.key==='ArrowDown')abrir(); return; }
      if(e.key==='ArrowDown'){e.preventDefault(); idx=Math.min(idx+1,itens.length-1); marca();}
      else if(e.key==='ArrowUp'){e.preventDefault(); idx=Math.max(idx-1,0); marca();}
      else if(e.key==='Enter'&&idx>=0){e.preventDefault(); escolhe(idx);}
      else if(e.key==='Escape'){e.stopPropagation(); fechar();}   // Esc fecha a lista, não o formulário
    });
    const pegar=e=>{
      const b=e.target.closest('.sugit'); if(!b)return;
      if(e.type==='mousedown') e.preventDefault();
      escolhe(Number(b.dataset.i));
    };
    cx.addEventListener('mousedown',pegar);
    cx.addEventListener('click',pegar);
  });
}

/* ---------- modal genérico ---------- */
function modal(tituloHTML,corpoHTML,botoes,classe){
  fecha();
  const sc=document.createElement('div'); sc.className='scrim'; sc.id='scrim';
  sc.innerHTML=`<div class="modal ${classe||''}" role="dialog" aria-modal="true">
    <div class="modal-head">${tituloHTML}<button class="x" id="mX" aria-label="Fechar">✕</button></div>
    <div class="modal-body" id="modalBody">${corpoHTML}</div>
    <div class="modal-foot" id="modalFoot"></div></div>`;
  document.body.appendChild(sc);
  const ft=$('#modalFoot');
  (botoes||[]).forEach(b=>{const el=document.createElement('button');
    el.className='btn '+(b.cls||''); el.textContent=b.rot; el.onclick=b.fn; ft.appendChild(el);});
  $('#mX').onclick=fecha;
  sc.addEventListener('mousedown',e=>{if(e.target===sc)fecha();});
  ligaSugestoes(sc);
  const foco=sc.querySelector('.modal-body input,.modal-body select'); if(foco)setTimeout(()=>foco.focus(),40);
}
function fecha(){const s=$('#scrim'); if(s)s.remove();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecha();});

/* ============================================================
   EVENTOS
   ============================================================ */
function busca(id,obj){
  const el=$(id); if(!el)return;
  el.oninput=()=>{obj.q=el.value; clearTimeout(el._t); el._t=setTimeout(()=>{render();
    const n=$(id); if(n){n.focus(); n.setSelectionRange(n.value.length,n.value.length);}},220);};
}
function togs(sel,fn){ $$(sel+' .tog').forEach(b=>b.onclick=()=>{fn(b.dataset.v);render();}); }
function posRender(){
  ligaSugestoes($('#view'));
  // lançar
  if($('#lFunc')){
    ['#lFunc','#lData','#lDesc','#lValor','#lParc'].forEach(s=>$(s).addEventListener('input',atualizaPrevia));
    $('#lJuros').addEventListener('input',()=>{form.jurosTocado=true;atualizaPrevia();});
    $('#lPrim').addEventListener('input',()=>{form.primeiroTocado=true;atualizaPrevia();});
    $('#lTipo').onchange=()=>{
      const t=$('#lTipo').value;
      // juros e 1º desconto seguem o tipo enquanto ninguém mexeu neles
      if(!form.jurosTocado) $('#lJuros').value=String(TIPOS[t].juros).replace('.',',');
      if(!form.primeiroTocado) $('#lPrim').value=sugestaoPrimeiro(t);
      atualizaPrevia();
    };
    $('#lSalvar').onclick=salvarLancamento;
    $$('#view .card input').forEach(i=>i.addEventListener('keydown',e=>{
      if(e.key==='Enter' && !(i.dataset.sug && !i.parentElement.querySelector('.sugbox').hidden)) salvarLancamento();}));
    if($('#lLimpar'))$('#lLimpar').onclick=()=>{form=formNovo();render();};
    if($('#lCancelar'))$('#lCancelar').onclick=()=>{form=formNovo();aba='emprestimos';render();};
  }
  // empréstimos — a situação muda de sentido com o mês: do lançamento sem mês,
  // do desconto com mês; cada uma guarda a sua escolha
  busca('#eQ',fEmp);
  togs('#eSit',v=>{ if(fEmp.mes) fEmp.sitMes=v; else fEmp.sit=v; });
  togs('#eMesAt',v=>fEmp.mes=v);
  if($('#eMes'))$('#eMes').onchange=()=>{fEmp.mes=$('#eMes').value;render();};
  if($('#eTipo'))$('#eTipo').onchange=()=>{fEmp.tipo=$('#eTipo').value;render();};
  if($('#eCSV'))$('#eCSV').onclick=exportaCSV;
  if($('#eBaixaTodos'))$('#eBaixaTodos').onclick=baixaTodos;
  if($('#eImp'))$('#eImp').onclick=imprimeDescontos;
  // seleção para imprimir: a célula da caixa não abre a ficha
  $$('#view td.sel').forEach(td=>td.onclick=ev=>{
    ev.stopPropagation();
    const cb=td.querySelector('input'); if(ev.target!==cb) cb.checked=!cb.checked;
    if(cb.checked) selEmp.add(cb.dataset.sel); else selEmp.delete(cb.dataset.sel);
    render();
  });
  if($('#selTodos'))$('#selTodos').onclick=ev=>{
    ev.stopPropagation();
    const ids=$$('#view [data-sel]').map(c=>c.dataset.sel);
    if(ev.target.checked) ids.forEach(id=>selEmp.add(id)); else ids.forEach(id=>selEmp.delete(id));
    render();
  };
  if($('#eImpSel'))$('#eImpSel').onclick=()=>imprimeSelecionados(selEmp);
  if($('#eSelLimpa'))$('#eSelLimpa').onclick=()=>{selEmp.clear();render();};
  if(aba==='emprestimos'){ ligaBaixas($('#view'),render); ligaParcelas($('#view'),render); }
  if($('#eDescFeitos'))$('#eDescFeitos').onclick=janelaDescontosFeitos;
  // log
  busca('#gQ',fLog);
  if($('#gDe'))$('#gDe').onchange=()=>{fLog.de=$('#gDe').value;render();};
  if($('#gAte'))$('#gAte').onchange=()=>{fLog.ate=$('#gAte').value;render();};
  if($('#gPor'))$('#gPor').onchange=()=>{fLog.por=$('#gPor').value;render();};
  if($('#gGrupo'))$('#gGrupo').onchange=()=>{fLog.grupo=$('#gGrupo').value;render();};
  if($('#gCSV'))$('#gCSV').onclick=exportaLogCSV;
  // funcionários
  busca('#fQ',fFunc);
  if($('#fSit'))$('#fSit').onchange=()=>{fFunc.sit=$('#fSit').value;render();};
  if($('#fDev'))$('#fDev').onclick=()=>{fFunc.soDev=!fFunc.soDev;render();};
  if($('#fNovo'))$('#fNovo').onclick=()=>formFuncionario(null);
  // linhas clicáveis
  $$('#view tbody tr[data-id]').forEach(tr=>tr.onclick=()=>
    aba==='funcionarios'?formFuncionario(tr.dataset.id):abreEmprestimo(tr.dataset.id));
  // ordenação
  $$('#view thead th[data-ord]').forEach(th=>th.onclick=()=>{
    const o=aba==='painel'?oDash:oEmp;
    const k=th.dataset.ord; if(o.k===k)o.asc=!o.asc; else{o.k=k;o.asc=true;} render();});
  // nome (tabela do dashboard e gráfico de saldo) abre o resumo da pessoa
  $$('#view [data-func]').forEach(b=>b.onclick=ev=>{ev.stopPropagation(); abreResumo(b.dataset.func);});
  // filtros do dashboard
  busca('#dQ',fDash); togs('#dSit',v=>fDash.sit=v);
  if($('#dTipo'))$('#dTipo').onchange=()=>{fDash.tipo=$('#dTipo').value;render();};
  if($('#dLimpa'))$('#dLimpa').onclick=()=>{fDash={q:'',sit:'',tipo:''};render();};
  // dashboard
  $$('#togPer .tog').forEach(b=>b.onclick=()=>{perPainel=b.dataset.p;render();});
  if($('#btnImpPainel'))$('#btnImpPainel').onclick=imprimirPainel;
  if($('#btnShare'))$('#btnShare').onclick=compartilharPainel;
  if(!LEITURA) $$('#view .kpi.clickable').forEach(k=>k.onclick=()=>{
    if(k.dataset.ir==='mes') fEmp={q:'',sit:'ABERTO',tipo:'',mes:mesDe(hoje()),sitMes:''};
    else if(k.dataset.ir==='atr') fEmp={q:'',sit:'ATR',tipo:'',mes:'',sitMes:''};
    else fEmp={q:'',sit:'ABERTO',tipo:'',mes:'',sitMes:''};
    aba='emprestimos';
    render();});
  // dados
  if($('#dRecarregar'))$('#dRecarregar').onclick=()=>puxar(true);
  if($('#dBaixar'))$('#dBaixar').onclick=baixarJSON;
  if($('#dTipos'))$('#dTipos').onclick=()=>janelaTipos(null);
  if($('#dSair'))$('#dSair').onclick=sairDoApp;
}

$('#nav').onclick=e=>{const b=e.target.closest('[data-aba]'); if(!b)return; aba=b.dataset.aba; render();};
$('#btnUser').onclick=()=>{ aba='dados'; render(); };
$('#btnReconectar').onclick=()=>flush();
/* Aviso do navegador ao sair: só quando há mesmo algo que a nuvem ainda não tem (compara a tela com o banco;
   uma marca "pendente" esquecida não segura mais a pessoa). Antes de sair tenta enviar o que faltar. */
window.addEventListener('beforeunload',e=>{
  if(LEITURA||!carregado)return;
  if(!gravando&&!temPendencia()){ sujo=false; return; }
  usarKeepalive=true; flush();
  e.preventDefault(); e.returnValue='';
});
window.addEventListener('pagehide',()=>{ if(!LEITURA&&carregado&&(gravando||temPendencia())){ usarKeepalive=true; flush(); } });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&!LEITURA&&carregado&&sujo&&!gravando){ flush(); } });

/* ---------- boot ---------- */
(function(){
  // cópia compartilhada: só o dashboard, com os dados que vieram dentro do arquivo
  if(LEITURA){
    aplicaJSON(LEITURA.dados); sujo=false;
    perPainel=LEITURA.per||perPainel; aba='painel';
    document.body.classList.add('leitura');
    $('.brand-app').textContent='Dashboard de Empréstimos · somente leitura';
    $('#btnUser').hidden=true; $('#nav').hidden=true;
    document.title='Dashboard de Empréstimos — '+dBR(LEITURA.hoje);
    render(); return;
  }
  render();   // só a moldura; os dados entram depois do login
  iniciar();
})();
</script>
</body>
</html>
