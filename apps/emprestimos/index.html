<style>
:root{
  --bg:#0B0A09; --surface:#151412; --surface-2:#1C1B18; --surface-3:#26241F;
  --line:#2C2A26; --line-2:#3E3B35;
  --ink:#F4F1EC; --ink-2:#ADA79E; --ink-3:#7C766D;
  --accent:#F26A21; --accent-ink:#140700; --accent-soft:#2B1408; --accent-line:#5E2E10;
  --ok:#46B87C; --ok-soft:#0F2418; --ok-line:#245C3D;
  --warn:#F2C14E; --warn-soft:#2A2210; --warn-line:#5C4A1C;
  --crit:#FF5247; --crit-soft:#2C1310; --crit-line:#63241E;
  --info:#5BA8F5; --info-soft:#0F1E2E; --info-line:#255182;
  --shadow:0 1px 2px rgba(0,0,0,.55), 0 6px 18px -8px rgba(0,0,0,.85);
  --shadow-lg:0 2px 8px rgba(0,0,0,.6), 0 24px 52px -14px rgba(0,0,0,.95);
  --r:10px;
  --sans:"Archivo","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono","Consolas",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.app{max-width:1400px;margin:0 auto;padding:0 14px}

/* ---------- tela cheia, feita para o PC ----------
   A página não rola. Cada tela tem um cabeçalho congelado (.cab) e só a área
   de baixo (.rola) rola — como o "Congelar Painéis" do Excel. Na tabela, a
   própria .rola é quem rola, e por isso o thead sticky fica preso no topo. */
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
.app{flex:1;min-height:0;width:100%;display:flex;flex-direction:column}
.topbar{flex:none}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.cab{flex:none;padding-bottom:12px}
.rola{flex:1;min-height:0;overflow:auto;margin-bottom:12px}
.cab-tit{display:flex;align-items:flex-end;gap:12px 28px;flex-wrap:wrap;margin:16px 0 12px}
.cab-tit h1{margin:0}
.contadores{display:flex;gap:30px;margin-left:auto;align-items:baseline}
.ct{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.ct b{font:700 23px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink)}
.ct.v b{color:var(--accent)}
.ct span{font-size:12.5px;color:var(--ink-3)}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);padding:10px 0 0;border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
.wm{display:flex;flex-direction:column;gap:3px;line-height:1}
.wm-name{font-weight:700;font-size:18px;color:var(--accent)}
.wm-tag{font:500 7.5px/1 var(--sans);letter-spacing:.185em;color:var(--ink-3)}
.brand-div{width:1px;height:24px;background:var(--line-2);flex:none}
.brand-app{font:600 10.5px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-2)}
.whoami{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px 3px 3px}
.whoami:hover{border-color:var(--ink-3)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);display:grid;place-items:center;font-weight:700;font-size:10.5px;flex:none}
.nav{display:flex;gap:6px;overflow-x:auto;padding:9px 0 3px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{white-space:nowrap;border:1px solid transparent;background:transparent;color:var(--ink-2);padding:6px 13px;border-radius:99px;cursor:pointer;font-weight:500;font-size:13px}
.nav button:hover{background:var(--surface-3);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.nav .pip{display:inline-block;min-width:17px;padding:0 4px;margin-left:6px;border-radius:99px;background:var(--surface-3);color:var(--ink-2);font:600 10px/17px var(--mono);text-align:center}
.nav button[aria-current="true"] .pip{background:var(--accent-ink);color:var(--accent)}
.nav .pip.crit,.nav button[aria-current="true"] .pip.crit{background:var(--crit);color:#fff}

h1{font-size:21px;font-weight:700;margin:20px 0 2px;letter-spacing:-.015em}
h2{font-size:15px;font-weight:600;margin:0}
h3{font-size:13px;font-weight:600;margin:0}
.sec-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.sec-head .count{font:600 11px/1 var(--mono);color:var(--ink-3);background:var(--surface-3);padding:4px 7px;border-radius:5px}
.lead{color:var(--ink-2);font-size:13.5px;margin:0 0 2px;max-width:74ch}
.eyebrow{font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.spacer{flex:1}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dang{color:var(--crit);border-color:var(--crit-line)}
.btn.dang:hover{background:var(--crit-soft)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;font:600 11px/1.5 var(--sans);border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.chip.crit{background:var(--crit-soft);border-color:var(--crit-line);color:var(--crit)}
.chip.acc{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chip.info{background:var(--info-soft);border-color:var(--info-line);color:var(--info)}
.chip.ex{background:transparent;border-style:dashed;color:var(--ink-3)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}

label.f{display:block;margin-bottom:11px}
label.f > span,.f > .flab{display:block;font:600 10.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.inp.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
select.inp{cursor:pointer}
textarea.inp{min-height:64px;resize:vertical;font-family:var(--sans)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.hint.warn{color:var(--warn)}
.hint.crit{color:var(--crit)}

/* ---------- sugestões enquanto digita ---------- */
/* Lista própria em vez do <datalist> do navegador (padrão da casa). */
label.f.sugwrap,.fl.sugwrap{position:relative}
.sugbox{position:absolute;left:0;right:0;top:100%;z-index:6;margin-top:3px;min-width:260px;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;
  box-shadow:var(--shadow-lg);max-height:240px;overflow:auto;overscroll-behavior:contain}
.sugit{display:block;width:100%;text-align:left;padding:9px 11px;background:transparent;
  border:0;border-bottom:1px solid var(--line);color:var(--ink);font-size:13.5px;cursor:pointer}
.sugit:last-child{border-bottom:0}
.sugit:hover,.sugit.on{background:var(--accent-soft);color:var(--accent)}
.sugit b{color:var(--accent);font-weight:700}
.sugit .qtd{float:right;color:var(--ink-3);font:600 11px/1.5 var(--mono)}

/* ---------- lançar ---------- */
.lanc{display:grid;grid-template-columns:minmax(320px,410px) 1fr;gap:14px;align-items:start}
.resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.resumo .kpi .k-val{font-size:19px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:11px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:var(--r);padding:12px 13px;box-shadow:var(--shadow)}
.kpi .k-lab{font:600 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.kpi .k-val{font:700 23px/1.15 var(--mono);font-variant-numeric:tabular-nums;margin-top:7px;letter-spacing:-.02em}
.kpi .k-sub{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.kpi.a{border-left-color:var(--accent)} .kpi.a .k-val{color:var(--accent)}
.kpi.o{border-left-color:var(--ok)} .kpi.o .k-val{color:var(--ok)}
.kpi.w{border-left-color:var(--warn)} .kpi.w .k-val{color:var(--warn)}
.kpi.c{border-left-color:var(--crit)} .kpi.c .k-val{color:var(--crit)}
.kpi.i{border-left-color:var(--info)} .kpi.i .k-val{color:var(--info)}
.kpi.clickable{cursor:pointer} .kpi.clickable:hover{border-color:var(--ink-3)}

/* ---------- barras ---------- */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px;margin-top:12px}
.panels.dois{grid-template-columns:1fr 1fr}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bar{display:grid;grid-template-columns:minmax(70px,190px) 1fr auto;align-items:center;gap:10px}
.bar .b-lab{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .b-track{display:block;height:16px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.bar .b-fill{display:block;height:100%;background:var(--accent);border-radius:4px;min-width:2px}
.bar .b-val{font:600 12px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.bar .b-val small{color:var(--ink-3);font-weight:400;margin-left:5px}
.b-fill.ok{background:var(--ok)} .b-fill.warn{background:var(--warn)}
.b-fill.crit{background:var(--crit)} .b-fill.info{background:var(--info)}
.b-fill.mut{background:var(--line-2)}
.bar.atual .b-lab{color:var(--accent);font-weight:700}
.bar.link{cursor:pointer;border-radius:6px}
.bar.link:hover .b-lab{color:var(--accent);text-decoration:underline}

/* ---------- tabela do dashboard e resumo da pessoa ---------- */
.tablewrap.solta{overflow:visible}
.lnk{background:none;border:0;padding:0;color:var(--ink);font-weight:600;cursor:pointer;text-align:left;font-size:13px}
.lnk:hover{color:var(--accent);text-decoration:underline}
.prog{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.prog-t{display:block;width:54px;height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.prog-f{display:block;height:100%;background:var(--ok);border-radius:3px}
.rs-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.rs-kpis .kpi .k-val{font-size:18px}
.rs-sec{margin-top:18px}
.modal td.mono{white-space:nowrap}
/* "+" na célula da parcela e as linhas dos descontos que abrem embaixo */
.abre{display:inline-grid;place-items:center;width:18px;height:18px;margin-right:7px;padding:0;vertical-align:middle;
  border:1px solid var(--accent-line);border-radius:4px;background:var(--accent-soft);color:var(--accent);
  font:700 13px/1 var(--sans);cursor:pointer}
.abre:hover{background:var(--accent);color:var(--accent-ink)}
.qtd-pg{display:inline-block;margin-left:6px;min-width:16px;padding:0 4px;border-radius:99px;background:var(--surface-3);
  color:var(--ink-2);font:600 10px/16px var(--mono);text-align:center;vertical-align:middle}
tr.sub td{background:var(--surface-2);font-size:12px;color:var(--ink-2);padding-top:5px;padding-bottom:5px;border-bottom:1px dashed var(--line)}
tr.sub td:first-child{padding-left:26px}
tr.sub.falta td{color:var(--warn)}
.obs-pg{color:var(--info);font-style:italic;margin-top:2px}
span.obs-pg{margin:0}
tbody tr.sub:hover td{background:var(--surface-2)}
/* caixa de seleção na frente de cada empréstimo */
th.sel,td.sel{width:34px;text-align:center;padding-left:6px;padding-right:2px}
td.sel{cursor:default}
th.sel input,td.sel input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}

/* ---------- cópia compartilhada (somente leitura) ---------- */
body.leitura .kpi.clickable{cursor:default}
body.leitura .kpi.clickable:hover{border-color:var(--line)}
body.leitura .topbar{padding-bottom:10px}
/* aberta no celular: uma coluna */
@media (max-width:760px){
  .panels.dois{grid-template-columns:1fr}
  .filters input.busca{min-width:0;width:100%}
  .cab-tit .sec-head{margin-left:0!important}
}

/* ---------- tabela ---------- */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;font:600 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:10px 9px;border-bottom:1px solid var(--line-2);white-space:nowrap;user-select:none}
thead th[data-ord]{cursor:pointer}
thead th[data-ord]:hover{color:var(--ink)}
thead th.r{text-align:right}
thead th .ar{color:var(--accent);font-size:9px}
tbody td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr[data-id]{cursor:pointer}
tbody tr[data-id]:hover td{background:var(--surface-2)}
tfoot td{position:sticky;bottom:0;background:var(--surface-2);padding:9px;border-top:1px solid var(--line-2);font-weight:700}
td.num,tfoot td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
td.nome{min-width:220px;font-weight:500}
td.dim{color:var(--ink-3)}
td.folha{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
tr.futuro td{color:var(--ink-2)}
tr.quit td{font-style:italic}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:11px}
.filters .fl{display:flex;flex-direction:column;gap:4px}
.filters .fl > span{font:600 9.5px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.filters select,.filters input{padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:13px;min-width:128px}
.filters input.busca{min-width:260px}
.togs{display:flex;gap:6px;flex-wrap:wrap}
.tog{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);padding:6px 11px;border-radius:99px;font-size:12.5px;cursor:pointer;font-weight:500}

<script>
"use strict";
/* ============================================================
   CONTROLE DE EMPRÉSTIMOS — Rodriaço / MR Inox
   Substitui a planilha "RELATORIO DE DIVIDAS" (aba juros 2%).
   Arquivo único, roda em file://, sem internet.
   Dados: no Supabase (tabelas emp_*), com login e permissão da Central.

   O cronograma de parcelas NÃO é gravado: é sempre recalculado a partir do
   lançamento, com a mesma regra da planilha. O que é gravado é a BAIXA de cada
   parcela (e.baixas). A chave config.baixa vale para o app inteiro:
     MANUAL — só conta como descontada a parcela que alguém marcou (padrão);
     AUTO   — parcela com data de desconto até hoje conta como descontada.
   Trocar de modo não apaga as baixas: elas voltam a valer no manual.

   MODO LEITURA: o botão Compartilhar do dashboard gera uma cópia deste
   arquivo com window.__LEITURA__ = {hoje, dados, ...}. Nela só existe o
   dashboard, nada grava (nem a cópia local, que é comum a todo file://) e
   "hoje" fica congelado na data em que foi gerada.
   ============================================================ */
const LEITURA = window.__LEITURA__ || null;

/* ---------- constantes ---------- */
const ARQ_PADRAO = 'emprestimos.json'; // nome da cópia de segurança baixada

/* Tipos de empréstimo: cadastráveis, gravados em config.tipos no arquivo.
   juros = sugestão de % a.m. ao escolher o tipo (a planilha se chamava "juros 2%") */
const TIPOS_PADRAO = [
  {id:'EMP',   rot:'Empréstimo',       juros:2},
  {id:'ADI13', rot:'Adiantamento 13º', juros:0},
  {id:'OUT',   rot:'Outro',            juros:0}
];
let TIPOS = {};   // id → {rot, juros}; espelho de state.config.tipos, refeito por syncTipos()
function syncTipos(){
  if(!Array.isArray(state.config.tipos)||!state.config.tipos.length)
    state.config.tipos=TIPOS_PADRAO.map(t=>Object.assign({},t));
  TIPOS={};
  state.config.tipos.forEach(t=>{ TIPOS[t.id]={rot:t.rot,juros:Number(t.juros)||0}; });
}
const SIT = {
  ATIVO:{rot:'Ativo',     cls:'ok'},
  INSS :{rot:'INSS',      cls:'warn'},
  DESL :{rot:'Desligado', cls:'ex'}
};
const MAX_PARCELAS = 120;

/* ---------- utilitários ---------- */
const $  = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>Array.from((r||document).querySelectorAll(s));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const up  = s=>String(s==null?'':s).trim().toUpperCase().replace(/\s+/g,' ');
const pad2= n=>String(n).padStart(2,'0');
const r2  = n=>Math.round(((Number(n)||0)+Number.EPSILON)*100)/100;
const soma= (a,k)=>r2(a.reduce((s,x)=>s+(Number(x[k])||0),0));
function hoje(){if(LEITURA&&LEITURA.hoje)return LEITURA.hoje; const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function dBR(iso){if(!iso)return '—';const p=String(iso).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;}
function brl(n){n=Number(n)||0;return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function brlC(n){ // compacto para KPI
  n=Number(n)||0;
  if(Math.abs(n)>=1000000) return 'R$ '+(n/1000000).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi';
  if(Math.abs(n)>=10000)   return 'R$ '+(n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil';
  return brl(n);
}
const num2 = n=>(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct  = n=>(Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:4})+'%';
function numBR(v){ // aceita "1.234,56" ou "1234.56"
  if(v==null||v==='')return 0;
  let s=String(v).replace(/[^\d,.-]/g,'');
  if(s.indexOf(',')>-1){s=s.replace(/\./g,'').replace(',','.');}
  const n=parseFloat(s);return isNaN(n)?0:n;
}
const semAcento = s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
function toast(msg,tipo){
  const el=document.createElement('div');
  el.className='toast'+(tipo?' '+tipo:'');el.textContent=msg;
  el.style.bottom=(22+document.querySelectorAll('.toast').length*44)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3200);
}
const plural=(n,um,varios)=>n+' '+(n===1?um:varios);
/* localStorage pode estar bloqueado (janela anônima, política de site) — nunca derrubar o app */
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);return true;}catch(e){return false;} }

/* ---------- meses ---------- */
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesDe = iso=>String(iso||'').slice(0,7);
const rotMes = ym=>ym?MESES[Number(ym.slice(5,7))-1]+'/'+ym.slice(2,4):'—';
const rotMesL = ym=>ym?MESES_L[Number(ym.slice(5,7))-1]+' de '+ym.slice(0,4):'';
function addMes(ym,k){
  let y=Number(ym.slice(0,4)), m=Number(ym.slice(5,7))-1+k;
  y+=Math.floor(m/12); m=((m%12)+12)%12;
  return y+'-'+pad2(m+1);
}
/* =EOMONTH(data;0)+5 da planilha: dia 5 do mês seguinte */
const dia5Seguinte = iso=>addMes(mesDe(iso),1)+'-05';
const dataValida = iso=>/^\d{4}-\d{2}-\d{2}$/.test(iso||'') && !isNaN(new Date(iso+'T00:00:00'));

/* ---------- estado ---------- */
let state = {versao:1, config:{baixa:'MANUAL'}, funcionarios:[], emprestimos:[], log:[]};
syncTipos();
let operador = '';        // quem está lançando (vem do login)
let aba = 'lancar';

/* Sem dados iniciais no código: funcionários, folhas e empréstimos moram só no banco. */

/* ============================================================
   LOG DE ALTERAÇÕES — quem, quando e o quê. Só cresce: ninguém edita nem
   apaga. Fica no emprestimos.json junto com os dados.
   ============================================================ */
const LOG_ACOES = {
  EMP_NOVO  :{rot:'Lançamento',          grupo:'EMP',  cls:'acc'},
  EMP_EDIT  :{rot:'Lançamento alterado', grupo:'EMP',  cls:'warn'},
  EMP_DEL   :{rot:'Lançamento excluído', grupo:'EMP',  cls:'crit'},
  QUIT      :{rot:'Quitação antecipada', grupo:'QUIT', cls:'info'},
  QUIT_DESF :{rot:'Quitação desfeita',   grupo:'QUIT', cls:'warn'},
  BAIXA     :{rot:'Baixa',               grupo:'BAIXA',cls:'ok'},
  BAIXA_DESF:{rot:'Baixa desfeita',      grupo:'BAIXA',cls:'warn'},
  BAIXA_LOTE:{rot:'Baixa em lote',       grupo:'BAIXA',cls:'ok'},
  OBS_EDIT  :{rot:'Observação alterada', grupo:'BAIXA',cls:''},
  FUNC_NOVO :{rot:'Funcionário novo',    grupo:'FUNC', cls:''},
  FUNC_EDIT :{rot:'Funcionário alterado',grupo:'FUNC', cls:'warn'},
  FUNC_DEL  :{rot:'Funcionário excluído',grupo:'FUNC', cls:'crit'},
  TIPO_NOVO :{rot:'Tipo novo',           grupo:'TIPO', cls:''},
  TIPO_EDIT :{rot:'Tipo alterado',       grupo:'TIPO', cls:'warn'},
  TIPO_DEL  :{rot:'Tipo excluído',       grupo:'TIPO', cls:'crit'},
  MODO      :{rot:'Modo de baixa',       grupo:'CONF', cls:'warn'},
  RESET     :{rot:'Dados restaurados',   grupo:'CONF', cls:'crit'}
};
const LOG_GRUPOS = {EMP:'Lançamentos',QUIT:'Quitações',BAIXA:'Baixas',FUNC:'Funcionários',TIPO:'Tipos',CONF:'Configuração'};
/* info: {func:'NOME', emp:id, txt:'detalhe', por, ts, rec} */
function registra(acao,info){
  info=info||{};
  if(!Array.isArray(state.log)) state.log=[];
  state.log.push({id:uid(), ts:info.ts||new Date().toISOString(), por:info.por!=null?info.por:operador,
    acao, func:info.func||'', emp:info.emp||'', txt:info.txt||'', rec:!!info.rec});
}
/* Arquivo de antes do log: o que tem data e autor gravados (lançamentos e
   baixas) entra no log marcado como reconstruído. Edições antigas não têm
   registro e não aparecem. */
function reconstruirLog(){
  state.log=[];
  state.emprestimos.forEach(e=>{
    const f=funcPorId(e.func), nome=f?f.nome:'';
    registra('EMP_NOVO',{ts:e.criadoEm||e.data, por:e.criadoPor||'', func:nome, emp:e.id, txt:descEmp(e), rec:true});
    Object.keys(e.baixas||{}).forEach(k=>{ const b=e.baixas[k];
      registra('BAIXA',{ts:b.em, por:b.por||'', func:nome, emp:e.id, rec:true,
        txt:(k==='Q'?'Quitação':'Parcela '+k+'/'+e.parcelas)+' — '+TIPOS[e.tipo].rot+' de '+dBR(e.data)}); });
  });
  state.log.sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
}
/* resumo de um lançamento numa linha, para o log */
function descEmp(e){
  return (TIPOS[e.tipo]?TIPOS[e.tipo].rot:'')+' '+brl(e.valor)+' em '+e.parcelas+'x a '+pct(e.juros)+' a.m.'+
    ' · 1º desconto '+dBR(e.primeiro)+(e.descricao?' · '+e.descricao:'');
}
/* Sem nome do operador o log perde o "quem": pede antes da primeira alteração. */
function garanteOperador(){
  if(LEITURA)return false;
  if(operador)return true;
  toast('Entre com a sua conta para alterar','err'); return false;
}

/* ============================================================
   CÁLCULO — mesma regra da aba "juros 2%"
     parcela    = valor / nº de parcelas                     (B6)
     juros k    = (valor − (k−1) × parcela) × taxa           (coluna E)
     desconto k = parcela + juros k                          (coluna F)
     data 1     = 1º desconto; data k = dia 5 do mês seguinte (coluna G)
   Diferença única: aqui cada valor é arredondado no centavo e a última
   parcela absorve a sobra, para a soma bater exatamente com o valor.
   ============================================================ */
function cronograma(e){
  const n=Math.max(1,Math.min(MAX_PARCELAS,Math.floor(Number(e.parcelas))||1));
  const V=r2(e.valor), tx=(Number(e.juros)||0)/100, P=r2(V/n);
  const out=[]; let saldo=V, data=e.primeiro;
  for(let k=1;k<=n;k++){
    const amort = k===n ? saldo : P;
    const juros = r2(saldo*tx);
    saldo = r2(saldo-amort);
    out.push({n:k,de:n,data,amort,juros,desconto:r2(amort+juros),saldo});
    data=dia5Seguinte(data);
  }
  return out;
}
/* O que de fato é (ou será) descontado. Quitação antecipada: as parcelas até a
   data da quitação seguem normais; o saldo que faltava vira um desconto único
   naquela data, sem os juros dos meses que não vão mais correr. */
function parcelasDe(e){
  const c=cronograma(e);
  if(!e.quitadoEm) return c;
  const antes=c.filter(p=>p.data<=e.quitadoEm);
  const saldo=antes.length?antes[antes.length-1].saldo:r2(e.valor);
  if(saldo>0) antes.push({n:0,de:c.length,data:e.quitadoEm,amort:saldo,juros:0,desconto:saldo,saldo:0,quit:true});
  return antes;
}
const modoManual = ()=>state.config.baixa!=='AUTO';
const chaveP = p=>p.quit?'Q':String(p.n);
const baixaDe = (e,p)=>(e.baixas||{})[chaveP(p)]||null;
/* Quanto da parcela já foi descontado. Baixa sem "valor" = parcela inteira
   (é como eram todas antes do desconto parcial). Baixa com "valor" = parcial,
   acumulado de todos os descontos daquela parcela. */
function pagoDe(e,p){
  if(!modoManual()) return p.data<=hoje()?p.desconto:0;
  const b=baixaDe(e,p); if(!b) return 0;
  return b.valor!=null ? r2(Math.min(Number(b.valor)||0,p.desconto)) : p.desconto;
}
const faltaDe = (e,p)=>r2(p.desconto-pagoDe(e,p));
function descontada(e,p){ return faltaDe(e,p)<=0.004; }
const parcial = (e,p)=>!descontada(e,p) && pagoDe(e,p)>0;
/* só existe no manual: no automático, data passada já é descontada */
const atrasada = (e,p)=>!descontada(e,p) && p.data<hoje();
/* o que já entrou abate primeiro os juros da parcela, depois o principal */
const jurosPagoDe = (e,p)=>r2(Math.min(pagoDe(e,p),p.juros));
function resumo(e){
  const ps=parcelasDe(e);
  const desc=ps.filter(p=>descontada(e,p)), pend=ps.filter(p=>!descontada(e,p));
  const atr=pend.filter(p=>p.data<hoje());
  const sm=(a,f)=>r2(a.reduce((s,p)=>s+f(p),0));
  return {ps, desc, pend, atr, nAtr:atr.length, vAtr:sm(atr,p=>faltaDe(e,p)),
    nDesc:desc.filter(p=>!p.quit).length, n:Number(e.parcelas)||1,
    nParcial:pend.filter(p=>parcial(e,p)).length,
    parcela:cronograma(e)[0].amort,
    totJuros:soma(ps,'juros'), totDesc:soma(ps,'desconto'),
    descontado:sm(ps,p=>pagoDe(e,p)),
    saldo:sm(pend,p=>p.amort-Math.max(0,pagoDe(e,p)-p.juros)),
    jurosAReceber:sm(pend,p=>p.juros-jurosPagoDe(e,p)),
    aDescontar:sm(pend,p=>faltaDe(e,p)),
    prox:pend[0]||null, ultimo:ps[ps.length-1], quitado:!pend.length};
}
const rotParcela = p=>p.quit?'Quitação':(p.n+'/'+p.de);
/* tudo o que as telas precisam saber de uma parcela, num objeto só */
function estadoParcela(e,p){
  const pago=pagoDe(e,p);
  return {desc:descontada(e,p), atr:atrasada(e,p), bx:baixaDe(e,p),
    pago, falta:r2(p.desconto-pago), parc:parcial(e,p), jurosPago:r2(Math.min(pago,p.juros))};
}

async function authToken(grant,corpo){

/* renova o acesso; uma aba/app de cada vez (navigator.locks), como a Central */
async function sessaoRenovar(){
  const trabalho=async()=>{
    const g=sessaoLer();
    if(!g||!g.refresh_token)return null;
    if(g.expira-300>agoraS())return g;              // outra aba já renovou
    let r;
    try{ r=await authToken('refresh_token',{refresh_token:g.refresh_token}); }catch(e){ return g; }
    if(!r.ok){ if(r.status>=500||r.status===429)return g; sessaoGuardar(null); return null; }
    const nova=sessaoDeToken(r.j,g); sessaoGuardar(nova); return nova;
  };
  return (navigator.locks&&navigator.locks.request)
    ?navigator.locks.request('central_rodriaco_sessao',trabalho):trabalho();
}
async function sessaoValida(){

async function lerTabela(t){
  const out=[], PAG=1000;
  for(let off=0;;off+=PAG){
    const r=await api('GET','/rest/v1/'+t+'?select=id,dados,versao&order=id.asc&limit='+PAG+'&offset='+off);
    if(!r.ok){ throw Object.assign(new Error('Leitura de '+t+' falhou (erro '+r.status+').'),{status:r.status}); }
    const a=await r.json(); out.push(...a);
    if(a.length<PAG)break;
  }
  return out;
}
async function carregaNuvem(){
  const [f,e,l,c]=await Promise.all([lerTabela(TAB.func),lerTabela(TAB.emp),lerTabela(TAB.log),lerTabela(TAB.cfg)]);
  const linhaCfg=c.find(x=>x.id==='main');
  const log=l.map(x=>x.dados).sort((a,b)=>String(a.ts).localeCompare(String(b.ts))||String(a.id).localeCompare(String(b.id)));
  aplicaJSON({versao:1,config:(linhaCfg&&linhaCfg.dados)||{},funcionarios:f.map(x=>x.dados),
    emprestimos:e.map(x=>x.dados),log});
  // retrato do que a nuvem tem (depois da normalização do aplicaJSON): serve para saber o que mudou
  const ver=(rows)=>{ const m={}; rows.forEach(x=>{ m[x.id]=x.versao; }); return m; };
  const vf=ver(f), ve=ver(e), vl=ver(l);
  nuvem={func:{},emp:{},log:{},cfg:{}};
  state.funcionarios.forEach(x=>{ nuvem.func[x.id]={j:JSON.stringify(x),v:vf[x.id]}; });
  state.emprestimos.forEach(x=>{ nuvem.emp[x.id]={j:JSON.stringify(x),v:ve[x.id]}; });
  state.log.forEach(x=>{ nuvem.log[x.id]={j:'',v:vl[x.id]}; });
  if(linhaCfg) nuvem.cfg.main={j:JSON.stringify(state.config),v:linhaCfg.versao};
  carregado=true;
}

/* [id, objeto] de cada grupo; a configuração é uma linha só (id 'main') */
function itensDe(k){
  if(k==='cfg')return [['main',state.config]];
  const lista=k==='func'?state.funcionarios:(k==='emp'?state.emprestimos:state.log);
  return lista.map(x=>[x.id,x]);
}
/* o que a tela tem e a nuvem ainda não: novos, alterados e apagados */
function coletaPendencias(){
  const novos=[], mudados=[], apagados=[];
  ['cfg','func','emp','log'].forEach(k=>{
    const atuais=itensDe(k), vistos={};
    atuais.forEach(([id,obj])=>{
      vistos[id]=1;
      const n=nuvem[k][id], j=JSON.stringify(obj);
      if(!n) novos.push({k,id,obj,j});
      else if(k!=='log'&&n.j!==j) mudados.push({k,id,obj,j,v:n.v});
    });
    if(k==='func'||k==='emp') Object.keys(nuvem[k]).forEach(id=>{ if(!vistos[id]) apagados.push({k,id}); });
  });
  return {novos,mudados,apagados};
}
function temPendencia(){
  if(LEITURA||!carregado)return false;
  const p=coletaPendencias();
  return !!(p.novos.length||p.mudados.length||p.apagados.length);
}
async function flush(){
  if(LEITURA||!carregado||conflito)return;
  if(gravando){ regravar=true; return; }
  gravando=true; regravar=false; pintaStatus();
  const prefer='return=representation';
  try{
    const {novos,mudados,apagados}=coletaPendencias();
    // novos, por tabela
    for(const k of ['cfg','func','emp','log']){
      const L=novos.filter(x=>x.k===k);
      for(let i=0;i<L.length;i+=200){
        const lote=L.slice(i,i+200);
        const r=await api('POST','/rest/v1/'+TAB[k],lote.map(x=>({id:x.id,dados:x.obj})),{Prefer:prefer});
        if(r.status===409){ throw Object.assign(new Error('conflito'),{conflito:true}); }
        if(!r.ok)throw Object.assign(new Error('Gravação recusada (erro '+r.status+').'),{status:r.status});
        const ret=await r.json(); const vv={}; ret.forEach(x=>{ vv[x.id]=x.versao; });
        lote.forEach(x=>{ nuvem[k][x.id]={j:k==='log'?'':x.j,v:vv[x.id]||1}; });
      }
    }
    // alterados: só grava se ninguém mexeu na linha depois que a tela carregou
    for(const m of mudados){
      const r=await api('PATCH','/rest/v1/'+TAB[m.k]+'?id=eq.'+encodeURIComponent(m.id)+'&versao=eq.'+m.v,{dados:m.obj},{Prefer:prefer});
      if(!r.ok)throw Object.assign(new Error('Gravação recusada (erro '+r.status+').'),{status:r.status});
      const ret=await r.json();
      if(!ret.length)throw Object.assign(new Error('conflito'),{conflito:true});
      nuvem[m.k][m.id]={j:m.j,v:ret[0].versao};
    }
    for(const a of apagados){
      const r=await api('DELETE','/rest/v1/'+TAB[a.k]+'?id=eq.'+encodeURIComponent(a.id));
      if(!r.ok)throw Object.assign(new Error('Exclusão recusada (erro '+r.status+').'),{status:r.status});
      delete nuvem[a.k][a.id];
    }
    semConexao=false; erroGravar=''; ultimaGravacao=new Date().toISOString();
    sujo=false;
  }catch(e){
    sujo=true;
    if(e&&e.conflito){ gravando=false; await resolveConflito(); return; }
    if(e&&e.semSessao){ gravando=false; telaLogin('Sua sessão expirou. Entre de novo para continuar gravando.'); pintaStatus(); return; }
    if(e&&(e.status===401||e.status===403)){
      // permissão ou sessão recusada: avisa o motivo e continua tentando, em vez de parar em silêncio
      erroGravar='o banco recusou a gravação (erro '+e.status+'). Confira a sua permissão em Contas.';
      if(!avisouRecusa){ avisouRecusa=true; toast('Sem permissão para gravar. Peça ao administrador.','err'); }
      clearTimeout(tmrTenta); tmrTenta=setTimeout(()=>flush(),30000);
    }
    else { semConexao=true; clearTimeout(tmrTenta); tmrTenta=setTimeout(()=>flush(),10000); }
  }
  gravando=false; usarKeepalive=false; pintaStatus();
  if(regravar&&!semConexao&&!conflito){ regravar=false; setTimeout(flush,50); }
}
function mudou(){ if(LEITURA)return; sujo=true; pintaStatus();

async function resolveConflito(){
  conflito=true; pintaStatus();
  const aviso='OUTRA PESSOA ALTEROU OS MESMOS DADOS\n\n'+
    'Alguém gravou uma alteração depois que você abriu esta tela.\n\n'+
    'OK = RECARREGAR da nuvem (recomendado — o que você lançou agora nesta tela se perde)\n'+
    'Cancelar = continuar com a sua tela e gravar por cima (o que a outra pessoa lançou se perde)';
  try{
    if(confirm(aviso)){
      await carregaNuvem(); sujo=false; toast('Recarregado da nuvem','ok'); render();
    }else{
      // mantém a tela e passa a valer a versão que está na nuvem
      const [f,e]=await Promise.all([lerTabela(TAB.func),lerTabela(TAB.emp)]);
      [[ 'func',f ],[ 'emp',e ]].forEach(([k,rows])=>{
        const vv={}; rows.forEach(x=>{ vv[x.id]=x.versao; });
        Object.keys(nuvem[k]).forEach(id=>{ if(vv[id]===undefined) delete nuvem[k][id]; else nuvem[k][id].v=vv[id]; });
        rows.forEach(x=>{ if(!nuvem[k][x.id]) nuvem[k][x.id]={j:'',v:x.versao}; });
      });
      const c=await lerTabela(TAB.cfg); const cm=c.find(x=>x.id==='main');
      if(cm) nuvem.cfg.main={j:(nuvem.cfg.main&&nuvem.cfg.main.j)||'',v:cm.versao}; else delete nuvem.cfg.main;
    }
  }catch(e){ semConexao=true; }
  conflito=false; pintaStatus();
  if(sujo) flush();
}

   a atualização automática da tela NÃO conta. */
const INATIV_CHAVE='central_rodriaco_atividade_v1', INATIV_MS=3600000;
const INATIV_MSG='Sessão encerrada: mais de 1 hora sem uso. Entre de novo.';
let inativUltima=0;
function inativLer(){ try{ return parseInt(localStorage.getItem(INATIV_CHAVE),10)||0; }catch(e){ return 0; } }
function inativMarcar(forca){ const t=Date.now(); if(!forca&&t-inativUltima<15000)return; inativUltima=t; try{ localStorage.setItem(INATIV_CHAVE,String(t)); }catch(e){} }
function inativVencida(){ if(!sessaoLer())return false; const u=inativLer(); if(!u){ inativMarcar(true); return false; } return Date.now()-u>INATIV_MS; }
function inativMotivo(){
  try{ if(sessionStorage.getItem('rodriaco_motivo')==='inatividade'){ sessionStorage.removeItem('rodriaco_motivo'); return INATIV_MSG; } }catch(e){}
  return '';
}
async function inativEncerrar(recarregar){
  // o que ainda não foi gravado na nuvem não pode se perder: grava antes de sair (se não der, tenta de novo depois)
  if(typeof sujo!=='undefined'&&sujo){ try{ await flush(); }catch(e){} if(sujo)return; }
  const g=sessaoLer();
  if(g&&g.access_token){ try{ fetch(SUPABASE_URL+'/auth/v1/logout?scope=local',{method:'POST',keepalive:true,headers:{apikey:SUPABASE_ANON,Authorization:'Bearer '+g.access_token}}).catch(()=>{}); }catch(e){} }
  sessaoGuardar(null);
  try{ localStorage.removeItem(INATIV_CHAVE); sessionStorage.setItem('rodriaco_motivo','inatividade'); }catch(e){}
  if(recarregar)location.reload();
}
if(!LEITURA&&inativVencida())inativEncerrar(false);   // venceu com o app fechado: pede login já na abertura
['pointerdown','keydown','wheel','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>inativMarcar(false),{passive:true,capture:true}));
setInterval(()=>{ if(!LEITURA&&inativVencida())inativEncerrar(true); },30000);
document.addEventListener('visibilitychange',()=>{ if(!LEITURA&&!document.hidden&&inativVencida())inativEncerrar(true); });

/* ---------- entrar ---------- */
function tela(html){
  let el=$('#acesso');
  if(!html){ if(el)el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='acesso'; document.body.appendChild(el); }
  el.innerHTML='<div class="acesso-card"><div class="wm"><span class="wm-name">RODRIAÇO</span><span class="wm-tag">MR INOX</span></div>'+html+'</div>';
}
function telaMensagem(titulo,texto,botoes){
  tela('<h2>'+esc(titulo)+'</h2><p class="lead">'+texto+'</p><div class="btnrow">'+(botoes||'')+'</div>');
  const s=$('#acSair'); if(s)s.onclick=sairDoApp;
  const n=$('#acNovo'); if(n)n.onclick=()=>iniciar();
}
function sairDoApp(){
  const g=sessaoLer();
  if(g&&g.access_token){
    try{ fetch(SUPABASE_URL+'/auth/v1/logout?scope=local',{method:'POST',keepalive:true,
      headers:{apikey:SUPABASE_ANON,Authorization:'Bearer '+g.access_token}}).catch(()=>{}); }catch(e){}
  }
  sessaoGuardar(null); location.reload();
}
function telaLogin(msg){
  tela('<h2>Controle de Empréstimos</h2><p class="lead">Entre com o mesmo e-mail e a mesma senha da Central Rodriaço.</p>'+
    '<label class="lab">E-mail</label><input class="inp" id="acEmail" type="email" autocomplete="username">'+
    '<label class="lab">Senha</label><input class="inp" id="acSenha" type="password" autocomplete="current-password">'+
    '<p class="acesso-erro" id="acErro">'+esc(msg||'')+'</p>'+
    '<div class="btnrow"><button class="btn pri" id="acEntrar">Entrar</button></div>'+
    '<p class="hint" style="margin-top:12px">Esqueceu a senha? Abra a <a href="../../" style="color:var(--accent)">Central</a> e use “Esqueci minha senha”.</p>');
  const entrar=async()=>{
    const email=$('#acEmail').value.trim(), senha=$('#acSenha').value;
    if(!email||!senha){ $('#acErro').textContent='Preencha e-mail e senha.'; return; }
    $('#acEntrar').disabled=true;
    try{
      const r=await authToken('password',{email,password:senha});
      if(!r.ok){ $('#acErro').textContent=r.status===400?'E-mail ou senha incorretos.':'Não foi possível entrar (erro '+r.status+').'; $('#acEntrar').disabled=false; return; }
      sessaoGuardar(sessaoDeToken(r.j)); iniciar();
    }catch(e){ $('#acErro').textContent='Sem conexão com o servidor.'; $('#acEntrar').disabled=false; }
  };
  $('#acEntrar').onclick=entrar;
  $('#acSenha').onkeydown=ev=>{ if(ev.key==='Enter')entrar(); };
  $('#acEmail').focus();
}
async function iniciar(){
  const g=await sessaoValida();
  if(!g){ telaLogin(inativMotivo()); return; }
  emailLogado=g.email||'';
  tela('<h2>Controle de Empréstimos</h2><p class="lead">Conferindo o acesso…</p>');
  try{
    const ra=await api('POST','/rest/v1/rpc/meus_acessos',{});
    if(!ra.ok)throw Object.assign(new Error('Não consegui conferir o acesso (erro '+ra.status+').'),{status:ra.status});
    const a=await ra.json();
    if(!a||a.status!=='ativo'){
      telaMensagem('Aguardando liberação','A conta <b>'+esc(emailLogado)+'</b> ainda não foi liberada. Peça ao administrador da Central.',
        '<button class="btn pri" id="acNovo">Verificar de novo</button><button class="btn" id="acSair">Sair</button>'); return;
    }
    const m=a.modulos||{}, nivel=a.admin?'editar':(m['apps.emprestimos']||m['apps']||'');
    if(nivel!=='editar'){
      telaMensagem('Sem permissão','A conta <b>'+esc(emailLogado)+'</b> não tem acesso ao Controle de Empréstimos. '+
        'O administrador libera em <b>Central › Contas › Permissões › Apps de suporte › Controle de Empréstimos</b>.',
        '<button class="btn pri" id="acNovo">Verificar de novo</button><button class="btn" id="acSair">Sair</button>'); return;
    }
    // nome de quem está lançando: sai do cadastro da conta e fica gravado no log
    operador=up((emailLogado||'').split('@')[0]);
    try{
      const rp=await api('GET','/rest/v1/perfis?select=nome,email&id=eq.'+encodeURIComponent(idDoToken(g.access_token)));
      const p=rp.ok?(await rp.json())[0]:null;
      if(p&&up(p.nome))operador=up(p.nome);
    }catch(e){}
    await carregaNuvem();
    tela(''); sujo=false; semConexao=false;
    render();
    if(!iniciar.ligado){
      iniciar.ligado=true;
      setInterval(()=>puxar(false),60000);
      document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ puxar(false); if(sujo&&!gravando)flush(); } });
      window.addEventListener('online',()=>{ if(sujo)flush(); });
      window.addEventListener('storage',ev=>{ if((ev.key===CHAVE_SESSAO||ev.key===null)&&!sessaoLer())location.reload(); });
    }
  }catch(e){
    if(e&&e.semSessao){ telaLogin(''); return; }
    telaMensagem('Não consegui carregar os dados',esc(e.message||'Erro desconhecido')+
      '<br><br>Confira se o <b>banco_emprestimos.sql</b> foi rodado no Supabase e se a sua conta está liberada.',
      '<button class="btn pri" id="acNovo">Tentar de novo</button><button class="btn" id="acSair">Sair</button>');
  }
}

/* botão de baixa: só existe no modo manual */

/* "Parcela 3/5 — Empréstimo de 20/07/2026 · R$ 424,00 de 05/10/2026" para o log */
function descParcela(e,k){

  return (k==='Q'?'Quitação':'Parcela '+k+'/'+e.parcelas)+' — '+TIPOS[e.tipo].rot+' de '+dBR(e.data)+
    (p?' · '+brl(p.desconto)+' de '+dBR(p.data):'');
}
/* Os descontos de uma parcela, do mais antigo ao mais novo. Baixa antiga, de
   antes do desconto parcial, não tem a lista: vira um desconto único.
   "i" é a posição gravada (identifica o desconto para excluir/editar). */
function pagamentosDe(e,p){
  const b=baixaDe(e,p); if(!b) return [];
  const L=b.pagamentos&&b.pagamentos.length ? b.pagamentos : [{em:b.em,por:b.por,valor:pagoDe(e,p)}];
  return L.map((g,i)=>Object.assign({i},g)).sort((a,b2)=>String(a.em).localeCompare(String(b2.em))||a.i-b2.i);
}
/* o que se grava de um desconto (sem o "i" de tela) */
const limpaPg = g=>{ const o={em:g.em,por:g.por,valor:g.valor,lancadoEm:g.lancadoEm}; if(g.obs) o.obs=g.obs; return o; };
const OBS_MAX = 200;
const limpaObs = s=>String(s==null?'':s).replace(/\s+/g,' ').trim().slice(0,OBS_MAX);
/* Remonta a baixa da parcela a partir da lista de descontos: fechou o valor =
   inteira (sem "valor"); não fechou = parcial; lista vazia = sem baixa.
   "em" da baixa = data do desconto mais recente. */
function remontaBaixa(e,p,pags){
  const k=chaveP(p);
  if(!pags.length){ delete e.baixas[k]; return; }
  const total=r2(pags.reduce((s,g)=>s+(Number(g.valor)||0),0));
  const ult=pags.slice().sort((a,b)=>String(a.em).localeCompare(String(b.em))).pop();
  e.baixas[k]=total>=p.desconto-0.004 ? {em:ult.em,por:ult.por,pagamentos:pags}
                                      : {em:ult.em,por:ult.por,valor:total,pagamentos:pags};
}
/* Registra um desconto de "v" reais na parcela k, com a data em que ele foi
   descontado de fato (pode ser retroativa). lancadoEm guarda quando foi lançado. */
function aplicaDesconto(e,k,v,data,obs){
  const p=parcelasDe(e).find(x=>chaveP(x)===k); if(!p)return;
  if(!e.baixas) e.baixas={};
  data=dataValida(data)?data:p.data;
  obs=limpaObs(obs);
  const jaPago=pagoDe(e,p);
  const pags=pagamentosDe(e,p).map(limpaPg);
  pags.push(limpaPg({em:data,por:operador,valor:r2(v),lancadoEm:new Date().toISOString(),obs}));
  remontaBaixa(e,p,pags);
  const total=r2(jaPago+v), fecha_=total>=p.desconto-0.004;
  registra('BAIXA',{func:nomeDe(e),emp:e.id,txt:descParcela(e,k)+' · descontado '+brl(v)+' em '+dBR(data)+
    (fecha_?(jaPago>0?' (completou a parcela)':''):' — PARCIAL, falta '+brl(r2(p.desconto-total)))+
    (obs?' — obs.: '+obs:'')});
}
/* Apaga um desconto só da parcela (os outros continuam) */
function excluiPagamento(e,k,i){
  const p=parcelasDe(e).find(x=>chaveP(x)===k); if(!p)return;
  const todos=pagamentosDe(e,p), sai=todos.find(g=>g.i===i); if(!sai)return;
  remontaBaixa(e,p,todos.filter(g=>g.i!==i).map(limpaPg));
  registra('BAIXA_DESF',{func:nomeDe(e),emp:e.id,txt:descParcela(e,k)+' · excluído o desconto de '+brl(sai.valor)+' de '+dBR(sai.em)+
    (sai.obs?' (obs.: '+sai.obs+')':'')});
}
/* Troca só a observação de um desconto já lançado (valor e data não mudam) */
function editaObsPagamento(e,k,i,obs){
  const p=parcelasDe(e).find(x=>chaveP(x)===k); if(!p)return false;
  const todos=pagamentosDe(e,p), g=todos.find(x=>x.i===i); if(!g)return false;
  obs=limpaObs(obs); const antes=g.obs||'';
  if(obs===antes) return false;
  remontaBaixa(e,p,todos.map(x=>limpaPg(x.i===i?Object.assign({},x,{obs}):x)));
  registra('OBS_EDIT',{func:nomeDe(e),emp:e.id,txt:descParcela(e,k)+' · desconto de '+brl(g.valor)+' de '+dBR(g.em)+
    ' · obs.: "'+(antes||'—')+'" → "'+(obs||'—')+'"'});
  return true;
}
function janelaObs(e,k,i,depois){
  const p=parcelasDe(e).find(x=>chaveP(x)===k); if(!p)return;
  const g=pagamentosDe(e,p).find(x=>x.i===i); if(!g)return;
  modal(`<h2>Observação do desconto</h2>`,
    `<p class="lead" style="margin-bottom:12px">${esc(nomeDe(e))} · ${rotParcela(p)} · <b class="mono">${brl(g.valor)}</b> em ${dBR(g.em)}</p>
     <label class="f"><span>Observação</span><input class="inp" id="obsTxt" maxlength="${OBS_MAX}" value="${esc(g.obs||'')}" placeholder="Ex.: pago em dinheiro no caixa"></label>
     <p class="hint">Valor e data do desconto não mudam. A troca fica registrada no Log.</p>`,
    [{rot:'Cancelar',fn:()=>{fecha(); depois();}},
     {rot:'Gravar',cls:'pri',fn:()=>grava()}]);
  function grava(){
    if(!garanteOperador())return;
    if(editaObsPagamento(e,k,i,$('#obsTxt').value)){ mudou(); toast('Observação gravada','ok'); }
    fecha(); depois();
  }
  $('#obsTxt').onkeydown=ev=>{ if(ev.key==='Enter'){ev.preventDefault(); grava();} };
}
function desfazBaixa(e,k){
  const p=parcelasDe(e).find(x=>chaveP(x)===k), pago=p?pagoDe(e,p):0;
  delete e.baixas[k];
  registra('BAIXA_DESF',{func:nomeDe(e),emp:e.id,txt:descParcela(e,k)+(pago?' · estornado '+brl(pago):'')});
}
/* Descontar: mostra o valor que falta para dar OK, mas deixa trocar.
   Valor menor que o que falta = desconto parcial. */
function janelaBaixa(e,k,depois){
  const p=parcelasDe(e).find(x=>chaveP(x)===k); if(!p)return;
  const x=estadoParcela(e,p);
  modal(`<h2>Descontar — ${esc(nomeDe(e))}</h2>`,
    `<dl class="dl" style="margin-bottom:14px">
       <dt>Parcela</dt><dd class="mono">${rotParcela(p)} · ${dBR(p.data)} · ${TIPOS[e.tipo].rot} de ${dBR(e.data)}</dd>

       ${x.pago?`<dt>Já descontado</dt><dd class="mono">${brl(x.pago)}</dd>`:''}
       <dt>Falta</dt><dd class="mono"><b style="color:var(--accent)">${brl(x.falta)}</b></dd>
     </dl>
     <div class="grid2">
       <label class="f"><span>Valor descontado (R$)</span>
         <input class="inp num" id="bxValor" inputmode="decimal" value="${num2(x.falta)}" style="font-size:18px"></label>
       <label class="f"><span>Data do desconto</span>
         <input class="inp" id="bxData" type="date" value="${p.data}" min="${e.data}" style="font-size:16px"></label>
     </div>
     <p class="hint" id="bxInfo">Valor cheio: a parcela fica descontada. Valor menor: fica <b>parcial</b> e o resto continua a descontar.</p>
     <p class="hint" id="bxDataInfo">A data vem com a data da parcela. Troque se o desconto foi feito em outro dia (retroativo).</p>
     <label class="f" style="margin-top:12px"><span>Observação (opcional)</span>
       <input class="inp" id="bxObs" maxlength="${OBS_MAX}" placeholder="Ex.: pago em dinheiro no caixa, descontado na rescisão…"></label>`,
    [{rot:'Cancelar',fn:()=>{fecha(); depois();}},
     {rot:'OK — descontar',cls:'pri',fn:()=>confirma()}]);
  const inp=$('#bxValor');
  const info=()=>{const v=numBR(inp.value);
    $('#bxInfo').innerHTML=!(v>0)?'<span style="color:var(--crit)">Informe um valor maior que zero.</span>'
      :v>x.falta+0.004?'<span style="color:var(--crit)">Maior que o que falta ('+brl(x.falta)+').</span>'
      :v<x.falta-0.004?'<b style="color:var(--warn)">Parcial:</b> depois deste desconto ainda faltam <b>'+brl(r2(x.falta-v))+'</b>.'
      :'Valor cheio: a parcela fica <b style="color:var(--ok)">descontada</b>.';};
  const dt=$('#bxData');
  const infoData=()=>{ $('#bxDataInfo').innerHTML=!dataValida(dt.value)?'<span style="color:var(--crit)">Informe a data do desconto.</span>'
      :dt.value>hoje()?'<b style="color:var(--warn)">Atenção:</b> data depois de hoje ('+dBR(hoje())+').'
      :dt.value!==p.data?'Desconto retroativo/fora da data da parcela ('+dBR(p.data)+').'
      :'A data vem com a data da parcela. Troque se o desconto foi feito em outro dia (retroativo).'; };
  dt.oninput=infoData;
  function confirma(){
    const v=r2(numBR(inp.value));
    if(!(v>0)){toast('Informe um valor maior que zero','err');return;}
    if(v>x.falta+0.004){toast('O valor passa do que falta nesta parcela ('+brl(x.falta)+')','err');return;}
    if(!dataValida(dt.value)){toast('Informe a data do desconto','err');return;}
    if(dt.value<e.data){toast('A data não pode ser antes do lançamento ('+dBR(e.data)+')','err');return;}
    aplicaDesconto(e,k,v,dt.value,$('#bxObs').value); mudou(); fecha();
    toast(v<x.falta-0.004?'Desconto parcial de '+brl(v)+' — falta '+brl(r2(x.falta-v)):'Desconto registrado','ok');
    depois();
  }
  inp.oninput=info;
  inp.onkeydown=ev=>{ if(ev.key==='Enter'){ev.preventDefault(); confirma();} };
  $('#bxObs').onkeydown=ev=>{ if(ev.key==='Enter'){ev.preventDefault(); confirma();} };
  setTimeout(()=>{inp.focus(); inp.select();},60);
}
/* ---------- descontos dentro da parcela (o "+") ---------- */
const abertas=new Set();          // "idEmprestimo|parcela" com os descontos abertos (só na tela)
const chaveAb=(e,p)=>e.id+'|'+chaveP(p);
/* célula "Parcela": com desconto lançado ganha o + (ou −) e a quantidade */
function celParcela(e,p,rot){
  rot=rot||rotParcela(p);
  const n=modoManual()?pagamentosDe(e,p).length:0;

    `<span class="qtd-pg" title="${plural(n,'desconto lançado','descontos lançados')}">${n}</span>`;
}
const lancadoTxt = g=>g.lancadoEm?'lançado '+quandoLog(g.lancadoEm):'';

/* linhas da ficha: alinhadas com as colunas da parcela */
function subFicha(e,p,x){

function subLista(x,cols){

function btnObsPg(e,p,g){

function ligaParcelas(raiz,depois){
  $$('[data-pgobs]',raiz).forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const [eid,k,i]=b.dataset.pgobs.split('|'); const e=empPorId(eid); if(!e)return;
    janelaObs(e,k,Number(i),depois);
  });
  $$('[data-abre]',raiz).forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const k=b.dataset.abre; if(abertas.has(k)) abertas.delete(k); else abertas.add(k);
    depois();
  });
  $$('[data-pgdel]',raiz).forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const [eid,k,i]=b.dataset.pgdel.split('|'); const e=empPorId(eid); if(!e)return;
    const p=parcelasDe(e).find(x=>chaveP(x)===k); if(!p)return;
    const g=pagamentosDe(e,p).find(x=>x.i===Number(i)); if(!g)return;
    if(!confirm('Excluir este desconto?\n\n'+brl(g.valor)+' de '+dBR(g.em)+' — '+nomeDe(e)+', '+rotParcela(p)+'\n\nOs outros descontos da parcela continuam.'))return;
    if(!garanteOperador())return;
    excluiPagamento(e,k,Number(i)); mudou(); toast('Desconto excluído','ok'); depois();
  });
}
/* liga os botões data-bx dentro de raiz; depois chama 'depois' para redesenhar */
function ligaBaixas(raiz,depois){
  $$('[data-bx]',raiz).forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();   // na tabela de empréstimos, a linha abriria a ficha
    if(!garanteOperador())return;
    const [eid,k,on]=b.dataset.bx.split('|');
    const e=empPorId(eid); if(!e)return;
    if(on==='1') return janelaBaixa(e,k,depois);
    const p=parcelasDe(e).find(x=>chaveP(x)===k);
    if(p&&parcial(e,p)&&!confirm('Desfazer a baixa desta parcela?\n\nOs descontos parciais ('+brl(pagoDe(e,p))+') são apagados juntos.'))return;
    desfazBaixa(e,k); mudou();
    toast('Baixa desfeita','ok');
    depois();
  });
}
function barras(dados,opt){
  opt=opt||{};
  const max=Math.max(1,...dados.map(d=>d.v));
  if(!dados.length) return '<p class="hint" style="margin-top:12px">'+(opt.vazio||'Sem dados no período.')+'</p>';
  return '<div class="bars">'+dados.map(d=>
    '<div class="bar'+(d.atual?' atual':'')+(d.fid?' link" data-func="'+esc(d.fid)+'" title="Ver o resumo de '+esc(d.k):'')+'">'+
    '<span class="b-lab" title="'+esc(d.k)+'">'+esc(d.k)+'</span>'+
    '<span class="b-track"><span class="b-fill '+(d.cls||opt.cls||'')+'" style="width:'+(d.v/max*100).toFixed(1)+'%"></span></span>'+
    '<span class="b-val">'+(opt.fmt?opt.fmt(d.v):d.v)+(d.sub?'<small>'+esc(d.sub)+'</small>':'')+'</span></div>'
  ).join('')+'</div>';
}
function thOrd(k,rot,ord,cls){
  const ar=ord.k===k?' <span class="ar">'+(ord.asc?'▲':'▼')+'</span>':'';
  return '<th data-ord="'+k+'"'+(cls?' class="'+cls+'"':'')+'>'+rot+ar+'</th>';
}
function ordena(arr,ord,val){
  const s=ord.asc?1:-1;
  return arr.sort((a,b)=>{
    const x=val(a,ord.k), y=val(b,ord.k);
    if(typeof x==='number'&&typeof y==='number') return (x-y)*s;
    return String(x==null?'':x).localeCompare(String(y==null?'':y),'pt-BR')*s;
  });
}

/* 1º desconto sugerido: dia 5 do mês que vem. No adiantamento de 13º, 20/12 —
   a data do lançamento que estava na planilha. */
function sugestaoPrimeiro(tipo){
  if(tipo==='ADI13'){ const y=hoje().slice(0,4); const d=y+'-12-20'; return d>=hoje()?d:(Number(y)+1)+'-12-20'; }
  return dia5Seguinte(hoje());
}

function salvarLancamento(){
  leForm();
  const err=errosForm();
  if(err.length){ $('#lErros').innerHTML='<div class="alertbox" style="color:var(--crit);border-color:var(--crit-line);background:var(--crit-soft)">'+
    err.map(esc).join('<br>')+'</div>'; return; }
  $('#lErros').innerHTML='';
  if(!garanteOperador())return;
  let f=funcPorNome(form.func);
  if(!f){
    if(!confirm('"'+up(form.func)+'" não está cadastrado.\n\nCadastrar como funcionário novo (sem nº de folha) e lançar?'))return;
    f={id:uid(),folha:'',nome:up(form.func),situacao:'ATIVO',criadoEm:hoje()};
    state.funcionarios.push(f);
    registra('FUNC_NOVO',{func:f.nome,txt:'Cadastrado pelo Lançar, sem nº de folha'});
  }
  const base=formComoEmp();
  const dados={func:f.id,tipo:form.tipo,descricao:up(form.descricao),data:form.data,
    valor:base.valor,juros:base.juros,parcelas:base.parcelas,primeiro:form.primeiro};
  if(form.editId){
    const e=empPorId(form.editId);
    if(!e){ toast('Lançamento não existe mais','err'); form=formNovo(); render(); return; }
    // o que mudou, campo a campo: "Valor 1.500,00 → 1.800,00"
    const CAMPOS=[['func','Funcionário',v=>{const x=funcPorId(v);return x?x.nome:'';}],['tipo','Tipo',v=>TIPOS[v]?TIPOS[v].rot:v],
      ['descricao','Descrição',v=>v||'—'],['data','Data do lançamento',dBR],['valor','Valor',num2],['juros','Juros',pct],
      ['parcelas','Parcelas',v=>String(v)],['primeiro','1º desconto',dBR]];
    const mud=CAMPOS.filter(c=>String(e[c[0]])!==String(dados[c[0]])).map(c=>c[1]+' '+c[2](e[c[0]])+' → '+c[2](dados[c[0]]));
    const nomeAntes=nomeDe(e);
    Object.assign(e,dados,{alteradoEm:new Date().toISOString(),alteradoPor:operador});
    registra('EMP_EDIT',{func:f.nome,emp:e.id,txt:mud.length?mud.join(' · '):'Gravado sem mudança'+(nomeAntes!==f.nome?'':'')});
    // quitação anterior ao novo 1º desconto não faz sentido: desfaz
    if(e.quitadoEm && e.quitadoEm<e.primeiro){ e.quitadoEm=''; delete e.baixas.Q; }
    // menos parcelas: a baixa das que deixaram de existir não pode voltar sozinha
    Object.keys(e.baixas||{}).forEach(k=>{ if(k!=='Q'&&Number(k)>e.parcelas) delete e.baixas[k]; });
    toast('Lançamento de '+f.nome+' alterado','ok');
    form=formNovo(); mudou(); aba='emprestimos'; render(); return;
  }
  const novo=Object.assign({id:uid(),quitadoEm:'',baixas:{},criadoEm:new Date().toISOString(),criadoPor:operador},dados);
  state.emprestimos.push(novo);
  registra('EMP_NOVO',{func:f.nome,emp:novo.id,txt:descEmp(novo)});
  toast(TIPOS[form.tipo].rot+' de '+brl(base.valor)+' lançado para '+f.nome,'ok');
  form=formNovo(form.tipo); mudou(); render();
}
/* ---------- tipos de empréstimo ---------- */
/* nome vai direto para o HTML das telas: sem caracteres de marcação */
const limpaTipo = s=>String(s==null?'':s).trim().replace(/\s+/g,' ').replace(/[<>&"'`]/g,'');
const usoTipo = id=>state.emprestimos.filter(e=>e.tipo===id).length;
function tipoDuplicado(rot,id){ return state.config.tipos.find(t=>t.id!==id&&semAcento(t.rot)===semAcento(rot)); }
/* Janela única dos tipos: lista todos, renomeia, muda o juros sugerido, exclui
   (só sem lançamento) e adiciona. Aberta pelo + do Lançar, escolher(id) põe o
   tipo no formulário; aberta pela aba Dados, escolher é null. */
function janelaTipos(escolher){
  const tipos=state.config.tipos;
  modal('<h2>Tipos de empréstimo</h2> <span class="count mono" style="font-size:11px;color:var(--ink-3)">'+tipos.length+'</span>',
    `<p class="hint" style="margin:0 0 10px">Nome e juros se alteram direto na linha. O juros é só a sugestão ao escolher o tipo.
       Excluir só aparece em tipo sem lançamento.</p>
     <div class="tablewrap"><table>
      <thead><tr><th>Nome</th><th>Juros % a.m.</th><th class="r">Lançamentos</th><th></th></tr></thead>
      <tbody>${tipos.map(t=>{const n=usoTipo(t.id); return `<tr>
        <td><input class="inp" data-tnome="${t.id}" value="${esc(t.rot)}"></td>
        <td><input class="inp num" data-tjuros="${t.id}" inputmode="decimal" value="${esc(String(t.juros).replace('.',','))}" style="width:90px"></td>
        <td class="num">${n||'<span class="dim">—</span>'}</td>
        <td style="white-space:nowrap;text-align:right">
          ${escolher?`<button class="btn sm${form.tipo===t.id?' pri':''}" data-tusar="${t.id}">${form.tipo===t.id?'Em uso aqui':'Usar'}</button> `:''}
          ${n?`<span class="chip ex" title="Tem lançamento usando este tipo — não pode ser excluído">em uso (${n})</span>`
             :(tipos.length<2?'':`<button class="btn sm dang" data-tdel="${t.id}">Excluir</button>`)}</td></tr>`;}).join('')}</tbody>
     </table></div>
     <div class="sec-head" style="margin:16px 0 8px"><h3>Adicionar tipo</h3></div>
     <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
       <label class="f" style="flex:1;min-width:200px;margin:0"><span>Nome</span><input class="inp" id="ntNome" placeholder="Ex.: Adiantamento salarial"></label>
       <label class="f" style="width:120px;margin:0"><span>Juros % a.m.</span><input class="inp num" id="ntJuros" inputmode="decimal" value="0"></label>
       <button class="btn pri" id="ntAdd">Adicionar</button>
     </div>`,
    [{rot:'Fechar',fn:fecha}],'wide');
  const reabre=()=>{render(); janelaTipos(escolher);};
  $$('#modalBody [data-tnome]').forEach(i=>i.onchange=()=>{
    const t=tipos.find(x=>x.id===i.dataset.tnome), rot=limpaTipo(i.value);
    if(!rot){toast('O nome não pode ficar vazio','err');i.value=t.rot;return;}
    if(tipoDuplicado(rot,t.id)){toast(rot+' já existe','err');i.value=t.rot;return;}
    if(rot===t.rot)return;
    if(!garanteOperador()){i.value=t.rot;return;}
    registra('TIPO_EDIT',{txt:'Renomeado: '+t.rot+' → '+rot});
    t.rot=rot; syncTipos(); mudou(); toast('Tipo renomeado','ok'); reabre();});
  $$('#modalBody [data-tjuros]').forEach(i=>i.onchange=()=>{
    const t=tipos.find(x=>x.id===i.dataset.tjuros), j=numBR(i.value);
    if(j<0||j>100){toast('Juros fora do intervalo (0 a 100)','err');i.value=String(t.juros).replace('.',',');return;}
    if(j===t.juros)return;
    if(!garanteOperador()){i.value=String(t.juros).replace('.',',');return;}
    registra('TIPO_EDIT',{txt:t.rot+': juros sugerido '+pct(t.juros)+' → '+pct(j)});
    t.juros=j; syncTipos(); mudou(); toast('Juros sugerido de '+t.rot+': '+pct(j),'ok');});
  $$('#modalBody [data-tdel]').forEach(b=>b.onclick=()=>{
    const t=tipos.find(x=>x.id===b.dataset.tdel);
    if(usoTipo(t.id)){toast('Tem lançamento usando '+t.rot,'err');return;}
    if(!confirm('Excluir o tipo '+t.rot+'?'))return;
    if(!garanteOperador())return;
    registra('TIPO_DEL',{txt:t.rot+' (juros sugerido '+pct(t.juros)+')'});
    state.config.tipos=state.config.tipos.filter(x=>x.id!==t.id); syncTipos();
    if(fEmp.tipo===t.id)fEmp.tipo=''; if(fDash.tipo===t.id)fDash.tipo='';
    if(form.tipo===t.id)form.tipo=Object.keys(TIPOS)[0];
    mudou(); toast('Tipo '+t.rot+' excluído','ok'); reabre();});
  $$('#modalBody [data-tusar]').forEach(b=>b.onclick=()=>{ fecha(); escolher(b.dataset.tusar); });
  const add=()=>{
    const rot=limpaTipo($('#ntNome').value), juros=numBR($('#ntJuros').value);
    if(!rot){toast('Informe o nome do tipo','err');$('#ntNome').focus();return;}
    if(tipoDuplicado(rot,'')){toast(rot+' já existe','err');return;}
    if(juros<0||juros>100){toast('Juros fora do intervalo (0 a 100)','err');return;}
    if(!garanteOperador())return;
    const id='T'+uid();
    state.config.tipos.push({id,rot,juros}); syncTipos();
    registra('TIPO_NOVO',{txt:rot+' (juros sugerido '+pct(juros)+')'}); mudou();
    toast('Tipo '+rot+' cadastrado','ok');
    // do Lançar: o tipo novo já vai para o formulário
    if(escolher){ fecha(); escolher(id); } else reabre();
  };
  $('#ntAdd').onclick=add;
  $('#ntNome').onkeydown=e=>{ if(e.key==='Enter') add(); };
  setTimeout(()=>{ const n=$('#ntNome'); if(n)n.focus(); },60);   // depois do foco automático do modal()
}

   Sem mês: uma linha por lançamento, situação do LANÇAMENTO.
   Com mês: só quem tem desconto naquele mês, com a parcela do mês, o botão de
   baixa e a situação do DESCONTO — é a tela de fechar a folha. */
let fEmp={q:'',sit:'ABERTO',tipo:'',mes:'',sitMes:''};
function listaEmp(){
  const q=semAcento(fEmp.q), mes=fEmp.mes;
  const out=[];
  state.emprestimos.forEach(e=>{
    const x={e,r:resumo(e),nome:nomeDe(e),folha:folhaDe(e)};
    if(fEmp.tipo&&e.tipo!==fEmp.tipo)return;
    if(q&&semAcento(x.nome+' '+x.folha+' '+(e.descricao||'')).indexOf(q)<0)return;
    if(!mes){
      if(fEmp.sit==='ABERTO'&&x.r.quitado)return;
      if(fEmp.sit==='QUITADO'&&!x.r.quitado)return;
      if(fEmp.sit==='ATR'&&!x.r.nAtr)return;
      if(fEmp.sit==='PARC'&&!x.r.nParcial)return;
    } else {
      // parcelas deste lançamento no mês (a quitação pode cair no mesmo mês de uma parcela)
      x.pm=parcelasDe(e).filter(p=>mesDe(p.data)===mes)
        .map(p=>Object.assign({e,p},estadoParcela(e,p)));
      if(!x.pm.length)return;
      if(fEmp.sitMes==='DESC'&&!x.pm.every(y=>y.desc))return;
      if(fEmp.sitMes==='PEND'&&x.pm.every(y=>y.desc))return;
      if(fEmp.sitMes==='ATR'&&!x.pm.some(y=>y.atr))return;
      if(fEmp.sitMes==='PARC'&&!x.pm.some(y=>y.parc))return;
      x.descMes=soma(x.pm.map(y=>y.p),'desconto');
    }
    out.push(x);
  });
  return ordena(out,oEmp,valEmp);
}
/* valor de ordenação de uma linha {e,r,nome,folha} — Empréstimos e Dashboard */
const valEmp=(x,k)=>({
  data:x.e.data, nome:x.nome, folha:x.folha, tipo:TIPOS[x.e.tipo].rot, valor:x.e.valor, juros:x.e.juros,
  parc:x.r.n, totDesc:x.r.totDesc, descontado:x.r.descontado, aDescontar:x.r.aDescontar,
  prox:x.r.prox?x.r.prox.data:'9999', descMes:x.descMes||0})[k];
/* as parcelas por trás da lista: com mês, as do mês (já filtradas pela situação
   do desconto); sem mês, todas as parcelas dos lançamentos listados */
function parcelasDaLista(){
  const L=listaEmp();
  const P=fEmp.mes ? [].concat(...L.map(x=>x.pm.map(y=>Object.assign({nome:x.nome,folha:x.folha,mes:fEmp.mes},y))))
                   : todasParcelas(L.map(x=>x.e));
  const P2=!fEmp.mes?P:P.filter(y=>fEmp.sitMes==='DESC'?y.desc:fEmp.sitMes==='PEND'?!y.desc:fEmp.sitMes==='ATR'?y.atr:fEmp.sitMes==='PARC'?y.parc:true);
  return P2.sort((a,b)=>a.p.data.localeCompare(b.p.data)||a.nome.localeCompare(b.nome,'pt-BR'));
}

/* natureza: Cheio (parcela inteira de uma vez), Parcial, ou Completou (fechou
   uma parcela que já tinha parcial) */
function pagamentosDosEmps(emps){
  const out=[];
  emps.forEach(e=>{ const nome=nomeDe(e), folha=folhaDe(e);
    parcelasDe(e).forEach(p=>{ let acum=0; const pags=pagamentosDe(e,p);
      pags.forEach((g,j)=>{ acum=r2(acum+(Number(g.valor)||0));
        const nat=acum>=p.desconto-0.004?(j===0?'Cheio':'Completou'):'Parcial';
        out.push({e,p,g,nome,folha,nat,mes:mesDe(g.em)}); }); }); });
  return out.sort((a,b)=>String(a.g.em).localeCompare(String(b.g.em))||a.nome.localeCompare(b.nome,'pt-BR'));
}

/* ============================================================
   RESUMO DA PESSOA — abre por cima de qualquer tela
   ============================================================ */
function calcPessoa(fid,ids){
  const f=funcPorId(fid);
  const E=empsDe(fid).filter(e=>!ids||ids.has(e.id)).map(e=>({e,r:resumo(e)})).sort((a,b)=>b.e.data.localeCompare(a.e.data));
  const T=todasParcelas(E.map(x=>x.e));
  const s=k=>r2(E.reduce((a,x)=>a+x.r[k],0));
  // "já feitos" inclui os parciais; "o que falta" usa só o que falta de cada parcela
  const desc=T.filter(x=>x.pago>0), pend=T.filter(x=>!x.desc);
  // o que ainda sai da folha, mês a mês (atrasadas ficam no mês delas, em vermelho)
  const pm=new Map();
  pend.forEach(x=>{const o=pm.get(x.mes)||{v:0,n:0,atr:0}; o.v+=x.falta; o.n++; if(x.atr)o.atr++; pm.set(x.mes,o);});
  const m0=mesDe(hoje());
  return {f,E,
    valor:r2(E.reduce((a,x)=>a+x.e.valor,0)), nAb:E.filter(x=>!x.r.quitado).length,
    descontado:s('descontado'), aDescontar:s('aDescontar'), saldo:s('saldo'),
    jurosPagos:soma(desc,'jurosPago'), jurosAPagar:s('jurosAReceber'),
    nAtr:s('nAtr'), vAtr:s('vAtr'),
    meses:[...pm].sort((a,b)=>a[0].localeCompare(b[0])).map(([m,o])=>({k:rotMes(m),v:r2(o.v),
      sub:plural(o.n,'desc.','desc.')+(o.atr?' · '+o.atr+' atras.':''),cls:o.atr?'crit':(m===m0?'':'info'),atual:m===m0})),
    baixas:desc.sort((a,b)=>b.p.data.localeCompare(a.p.data)),
    // cada desconto lançado (inteiro ou parcial), do mais novo ao mais antigo
    // cada parcela que ainda falta, pela data dela (o papel mostra a data completa)
    prox:pend.slice().sort((a,b)=>a.p.data.localeCompare(b.p.data)||a.e.data.localeCompare(b.e.data)),
    // cada desconto lançado, na ordem das parcelas (empréstimo, nº da parcela, data do desconto)
    pags:pagamentosDosEmps(E.map(x=>x.e)).sort((a,b)=>
      a.e.data.localeCompare(b.e.data)||a.e.id.localeCompare(b.e.id)||
      (a.p.quit?1e9:a.p.n)-(b.p.quit?1e9:b.p.n)||String(a.g.em).localeCompare(String(b.g.em)))};
}

let fLog={q:'',de:'',ate:'',por:'',grupo:''};
/* data local do registro: entrada reconstruída tem só a data; as novas têm hora */
const diaLog = ts=>{ ts=String(ts||''); if(ts.length<=10) return ts;
  const d=new Date(ts); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
const quandoLog = ts=>{ ts=String(ts||''); if(ts.length<=10) return dBR(ts);
  return new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); };
function listaLog(){
  const q=semAcento(fLog.q);
  // mais novo primeiro; no mesmo instante (baixa em lote), vale a ordem em que foi registrado
  return (state.log||[]).map((l,i)=>Object.assign({_i:i},l)).filter(l=>{
    const dia=diaLog(l.ts);
    if(fLog.de&&dia<fLog.de)return false;
    if(fLog.ate&&dia>fLog.ate)return false;
    if(fLog.por&&(l.por||'')!==fLog.por)return false;
    if(fLog.grupo&&(LOG_ACOES[l.acao]||{}).grupo!==fLog.grupo)return false;
    if(q&&semAcento((l.func||'')+' '+(l.txt||'')+' '+(l.por||'')).indexOf(q)<0)return false;
    return true;
  }).sort((a,b)=>String(b.ts).localeCompare(String(a.ts))||b._i-a._i);
}
function viewLog(){
  const L=listaLog();
  const ops=[...new Set((state.log||[]).map(l=>l.por||''))].sort();
  const chipAcao=a=>{const t=LOG_ACOES[a]||{rot:a,cls:''};return '<span class="chip '+t.cls+'">'+t.rot+'</span>';};
  return `

      <h1>Log de alterações</h1>
      <div class="contadores">
        <div class="ct"><b>${L.length}</b><span>${L.length===1?'registro':'registros'}</span></div>
      </div>

/* Um cálculo só, lido pela tela e pela impressão. */
function calcPainel(per){
  const ini=inicioPeriodo(per), h=hoje(), m0=mesDe(h);
  const E=empsPainel();
  const T=todasParcelas(E);
  const R=E.map(e=>({e,r:resumo(e),nome:nomeDe(e)}));
  const ab=R.filter(x=>!x.r.quitado);
  const empP=E.filter(e=>!ini||e.data>=ini);
  // o que já entrou (inteiro ou parcial), pela data da parcela
  const descP=T.filter(x=>x.pago>0&&(!ini||x.p.data>=ini));
  const doMes=T.filter(x=>x.mes===m0);
  const d={
    concedido:soma(empP,'valor'), nConc:empP.length,
    saldo:r2(ab.reduce((s,x)=>s+x.r.saldo,0)),
    juros:r2(ab.reduce((s,x)=>s+x.r.jurosAReceber,0)),
    nAb:ab.length, nPessoas:new Set(ab.map(x=>x.e.func)).size,
    mes:soma(doMes.map(x=>x.p),'desconto'), nMes:doMes.length,
    mesFalta:soma(doMes,'falta'),
    descontado:soma(descP,'pago'), jurosRec:soma(descP,'jurosPago')
  };
  const atr=T.filter(x=>x.atr);
  d.nAtr=atr.length; d.vAtr=soma(atr,'falta'); d.pAtr=new Set(atr.map(x=>x.e.func)).size;
  // desconto previsto: do mês atual até 11 meses à frente
  d.prev=[];
  for(let k=0;k<12;k++){
    const m=addMes(m0,k), ps=T.filter(x=>x.mes===m);
    d.prev.push({k:rotMes(m),v:soma(ps.map(x=>x.p),'desconto'),sub:ps.length?plural(ps.length,'desc.','desc.'):'',atual:k===0,cls:k===0?'':'info'});
  }
  while(d.prev.length&&!d.prev[d.prev.length-1].v) d.prev.pop();   // sem cauda vazia
  // saldo devedor por funcionário
  const pf=new Map();
  ab.forEach(x=>{const o=pf.get(x.nome)||{v:0,n:0,fid:x.e.func}; o.v+=x.r.saldo; o.n++; pf.set(x.nome,o);});
  d.porFunc=[...pf].map(([k,o])=>({k,v:r2(o.v),fid:o.fid,sub:o.n>1?o.n+' lanç.':''})).sort((a,b)=>b.v-a.v);
  d.R=R;
  // concedidos e descontados por mês, no período
  const serie=(itens,dataFn,valFn)=>{
    const m=new Map(); itens.forEach(i=>{const k=mesDe(dataFn(i));const o=m.get(k)||{v:0,n:0};o.v+=valFn(i);o.n++;m.set(k,o);});
    return [...m].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,o])=>({k:rotMes(k),v:r2(o.v),sub:plural(o.n,'lanç.','lanç.'),atual:k===m0}));
  };
  d.conc=serie(empP,e=>e.data,e=>e.valor);
  d.desc=serie(descP,x=>x.p.data,x=>x.pago).map(o=>Object.assign(o,{sub:o.sub.replace('lanç.','desc.'),cls:'ok'}));
  return d;
}

}
