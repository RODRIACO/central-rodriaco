<script>
"use strict";
/* ============================================================
   CANAL DE DENÚNCIA — Rodriaço
   Uma página só. Três áreas: Denunciar, Acompanhar, Painel do RH.

   ANONIMATO — o que este arquivo garante:
   - As telas públicas falam com o banco por fetch simples, usando
     só a chave pública. Nunca leem sessão guardada de outro app
     da Rodriaço, mesmo que a pessoa esteja logada nele no celular.
   - Nenhuma biblioteca externa, fonte ou contador é carregado nas
     telas públicas. A biblioteca do Supabase só é baixada quando
     alguém abre o Painel do RH.
   - Fotos são redesenhadas antes do envio: saem sem os dados do
     aparelho e do local (EXIF). Nome original do arquivo não é enviado.
   - O protocolo é sorteado aqui e o banco guarda só o resumo dele.
   ============================================================ */

const VERSAO = "20261111-1";
const SUPABASE_URL  = "https://vgcwzfeucfkaawwwhvjo.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnY3d6ZmV1Y2ZrYWF3d3dodmpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDMyNzEsImV4cCI6MjEwNDY3OTI3MX0.ej6C2X0If1wLBRa4DoX_P2Z8-32IwZoN-AlcWKpM6RY";
const SUPABASE_LIB  = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js";
const DEMO = new URLSearchParams(location.search).has("demo");

const TIPOS = {
  assedio_moral:  ["Assédio moral", "humilhação, xingamento, apelido, perseguição, ameaça"],
  assedio_sexual: ["Assédio sexual", "cantada insistente, toque, comentário ou mensagem de cunho sexual"],
  discriminacao:  ["Discriminação", "por cor, sexo, idade, religião, deficiência, orientação sexual"],
  violencia:      ["Violência", "agressão física ou verbal, intimidação"],
  conduta:        ["Desvio de conduta", "furto, fraude, favorecimento, álcool ou drogas no trabalho"],
  seguranca:      ["Condição insegura", "máquina sem proteção, pressão para trabalhar sem EPI"],
  outro:          ["Outro assunto", "algo que não se encaixa nas opções acima"]
};
const STATUS = {
  recebida:  {rot:"Recebida",      pub:"Recebida. O RH vai analisar.",            n:1, cls:"info"},
  apuracao:  {rot:"Em apuração",   pub:"Em apuração. Os fatos estão sendo verificados.", n:2, cls:"aviso"},
  conclusao: {rot:"Em conclusão",  pub:"Em conclusão. A decisão está sendo tomada.",     n:3, cls:"aviso"},
  concluida: {rot:"Concluída",     pub:"Concluída. A apuração terminou e as medidas cabíveis foram tomadas.", n:4, cls:"ok"},
  arquivada: {rot:"Encerrada",     pub:"Encerrada. Não foi possível prosseguir com as informações disponíveis.", n:4, cls:""}
};
const MAX_ARQS = 5, MAX_BYTES = 10 * 1024 * 1024;
const TIPOS_ARQ = /^(image\/(jpeg|png|webp)|application\/pdf|audio\/)/;

const $ = (s, r) => (r || document).querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dataBR = v => v ? new Date(v).toLocaleDateString("pt-BR") : "";
const dataHoraBR = v => v ? new Date(v).toLocaleString("pt-BR", {dateStyle:"short", timeStyle:"short"}) : "";
const numero = n => "D-" + String(n).padStart(4, "0");

/* ---------------- protocolo ---------------- */
function novoProtocolo(){
  const letras = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";       // sem I, O, 0 e 1 (confundem)
  const b = crypto.getRandomValues(new Uint8Array(12));
  const c = Array.from(b, x => letras[x & 31]).join("");
  return `RDA-${c.slice(0,4)}-${c.slice(4,8)}-${c.slice(8,12)}`;
}
function limparProtocolo(v){
  const s = String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/^RDA/, "");
  return s.length === 12 ? `RDA-${s.slice(0,4)}-${s.slice(4,8)}-${s.slice(8,12)}` : null;
}

/* ---------------- fotos sem dados do aparelho ---------------- */
async function limparImagem(arq){
  const bmp = await createImageBitmap(arq);
  const esc_ = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(bmp.width * esc_); cv.height = Math.round(bmp.height * esc_);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85));
  if(!blob) throw new Error("falha ao processar imagem");
  return blob;
}
const EXT = {"image/jpeg":"jpg","application/pdf":"pdf","audio/mpeg":"mp3","audio/mp4":"m4a","audio/x-m4a":"m4a","audio/aac":"aac",
             "audio/ogg":"ogg","audio/webm":"webm","audio/wav":"wav","audio/x-wav":"wav","audio/3gpp":"3gp","audio/amr":"amr"};

/* ============================================================
   BANCO — lado público (fetch simples, sem sessão)
   ============================================================ */
const CAB = {apikey: SUPABASE_ANON, Authorization: "Bearer " + SUPABASE_ANON};
async function rpc(fn, args){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method:"POST", headers:{...CAB, "Content-Type":"application/json"}, body:JSON.stringify(args),
    credentials:"omit", referrerPolicy:"no-referrer", cache:"no-store"});
  const t = await r.text();
  let j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
  if(!r.ok) throw new Error((j && j.message) || "Não foi possível falar com o servidor.");
  return j;
}
const real = {
  registrar: d => rpc("denuncia_registrar", {
    p_protocolo:d.protocolo, p_tipo:d.tipo, p_relato:d.relato, p_local:d.local, p_quando:d.quando,
    p_envolvidos:d.envolvidos, p_testemunhas:d.testemunhas, p_envolve_rh:d.envolve_rh, p_nome:d.nome, p_contato:d.contato}),
  async anexar(id, protocolo, blob, nome){
    const sorteio = Array.from(crypto.getRandomValues(new Uint8Array(8)), x => x.toString(16).padStart(2,"0")).join("");
    const caminho = `${id}/${sorteio}.${EXT[blob.type] || "bin"}`;
    const r = await fetch(`${SUPABASE_URL}/storage/v1/object/denuncias/${caminho}`, {
      method:"POST", headers:{...CAB, "Content-Type":blob.type, "x-upsert":"false"}, body:blob,
      credentials:"omit", referrerPolicy:"no-referrer"});
    if(!r.ok) throw new Error("envio recusado");
    await rpc("denuncia_anexar", {p_protocolo:protocolo, p_caminho:caminho, p_nome:nome, p_tipo:blob.type, p_tamanho:blob.size});
  },
  consultar: p => rpc("denuncia_consultar", {p_protocolo:p}),
  complementar: (p, t) => rpc("denuncia_complementar", {p_protocolo:p, p_texto:t}),

  /* ---------- lado do RH (com login; biblioteca baixada só aqui) ---------- */
  rh: {
    sb: null,
    async cliente(){
      if(this.sb) return this.sb;
      if(!(window.supabase && window.supabase.createClient)){
        await new Promise((ok, falha) => { const s = document.createElement("script");
          s.src = SUPABASE_LIB; s.onload = ok; s.onerror = () => falha(new Error("Sem conexão com o servidor.")); document.head.appendChild(s); });
      }
      // Sessão própria (não mistura com outros apps) e só enquanto a aba estiver aberta.
      this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON,
        {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:"canal-denuncia-rh", storage:window.sessionStorage}});
      this.sb.auth.onAuthStateChange(ev => { if(ev === "PASSWORD_RECOVERY"){ S.rh.fase = "novasenha"; render(); } });
      return this.sb;
    },
    async sessao(){ const sb = await this.cliente(); const {data} = await sb.auth.getSession(); return data && data.session ? data.session.user.email : null; },
    async entrar(email, senha){ const sb = await this.cliente(); const {error} = await sb.auth.signInWithPassword({email, password:senha}); if(error) throw new Error("E-mail ou senha incorretos."); return email; },
    async sair(){ const sb = await this.cliente(); await sb.auth.signOut(); },
    async recuperar(email){ const sb = await this.cliente(); const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname}); if(error) throw new Error(error.message); },
    async novaSenha(s){ const sb = await this.cliente(); const {error} = await sb.auth.updateUser({password:s}); if(error) throw new Error(error.message); },
    async papel(){ const sb = await this.cliente(); const {data, error} = await sb.rpc("denuncia_papel"); if(error) throw new Error(error.message); return data; },
    async listar(){ const sb = await this.cliente();
      const {data, error} = await sb.from("denuncias").select("id,numero,tipo,status,envolve_rh,pendente_rh,local,criado_em,apuracao_em,conclusao_em,encerrada_em").order("criado_em", {ascending:false});
      if(error) throw new Error(error.message); return data; },
    async detalhe(id){ const sb = await this.cliente();
      const [d, m, n, a] = await Promise.all([
        sb.from("denuncias").select("*").eq("id", id).single(),
        sb.from("denuncia_msgs").select("*").eq("denuncia_id", id).order("em"),
        sb.from("denuncia_notas").select("*").eq("denuncia_id", id).order("em"),
        sb.from("denuncia_anexos").select("*").eq("denuncia_id", id).order("em")]);
      const e = d.error || m.error || n.error || a.error; if(e) throw new Error(e.message);
      return {...d.data, msgs:m.data, notas:n.data, anexos:a.data}; },
    async atualizar(id, campos){ const sb = await this.cliente(); const {error} = await sb.from("denuncias").update(campos).eq("id", id); if(error) throw new Error(error.message); },
    async msg(id, texto){ const sb = await this.cliente(); const {error} = await sb.from("denuncia_msgs").insert({denuncia_id:id, autor:"rh", texto}); if(error) throw new Error(error.message); },
    async nota(id, texto){ const sb = await this.cliente(); const {error} = await sb.from("denuncia_notas").insert({denuncia_id:id, texto}); if(error) throw new Error(error.message); },
    async urlAnexo(caminho){ const sb = await this.cliente(); const {data, error} = await sb.storage.from("denuncias").createSignedUrl(caminho, 300); if(error) throw new Error(error.message); return data.signedUrl; }
  }
};

    async consultar(p){ await pausa(); const d = achar(p); return d ? JSON.parse(JSON.stringify(d)) : null; },

    rh: {

      async atualizar(id, c){ await pausa(); const d = base.find(x => x.id === id); const agora = new Date().toISOString();

function addUteis(d, n){ d = new Date(d); while(n > 0){ d.setDate(d.getDate() + 1); const w = d.getDay(); if(w !== 0 && w !== 6) n--; } return d; }
function prazo(x){
  let lim, rot;
  if(x.status === "recebida"){ lim = addUteis(x.criado_em, 2); rot = "Triagem"; }
  else if(x.status === "apuracao"){ lim = new Date(new Date(x.apuracao_em || x.criado_em).getTime() + 30 * 864e5); rot = "Apuração"; }
  else if(x.status === "conclusao"){ lim = new Date(new Date(x.conclusao_em || x.criado_em).getTime() + 10 * 864e5); rot = "Conclusão"; }
  else return null;
  return {rot, lim, dias: Math.ceil((lim - Date.now()) / 864e5)};
}
function seloPrazo(x){
  const p = prazo(x); if(!p) return "";
  if(p.dias < 0) return `<span class="sel crit">${p.rot}: atrasada ${-p.dias} d</span>`;
  if(p.dias <= 3) return `<span class="sel aviso">${p.rot}: vence em ${p.dias} d</span>`;
  return `<span class="sel">${p.rot}: até ${dataBR(p.lim)}</span>`;
}

}

function vRHPainel(app){
  const R = S.rh, l = filtrada();
  const abertas = R.lista.filter(x => !["concluida","arquivada"].includes(x.status));
  const atras = abertas.filter(x => { const p = prazo(x); return p && p.dias < 0; }).length;
  const pend = R.lista.filter(x => x.pendente_rh).length;
  app.innerHTML = `
  <h1>Painel do Canal de Denúncia</h1>
  <p class="nota">${esc(R.email)} · ${R.papel === "direcao" ? "Direção (vê todas as denúncias)" : "RH (não vê denúncias que envolvem o RH)"}</p>
  <div class="abas"><button data-aba="lista" class="${R.aba === "lista" ? "on" : ""}">Denúncias</button>
    <button data-aba="resumo" class="${R.aba === "resumo" ? "on" : ""}">Resumo para a CIPA</button></div>
  ${R.aba === "resumo" ? htmlResumo() : `
  <div class="barra">
    <span class="sel info">${abertas.length} em aberto</span>
    <span class="sel ${atras ? "crit" : "ok"}">${atras} atrasada(s)</span>
    <span class="sel ${pend ? "aviso" : ""}">${pend} com novidade</span>
    <span class="esp"></span>
    <select id="fstatus" aria-label="Situação">
      ${[["abertas","Em aberto"],["todas","Todas"],...Object.entries(STATUS).map(([k, v]) => [k, v.rot])]
        .map(([k, t]) => `<option value="${k}" ${R.fStatus === k ? "selected" : ""}>${t}</option>`).join("")}</select>
    <select id="ftipo" aria-label="Assunto"><option value="">Todos os assuntos</option>
      ${Object.entries(TIPOS).map(([k, [t]]) => `<option value="${k}" ${R.fTipo === k ? "selected" : ""}>${t}</option>`).join("")}</select>
    <button class="btn peq sec" id="csv" type="button">Exportar</button>
    <button class="btn peq sec" id="atualizar" type="button">Atualizar</button>
  </div>
  <div class="rolo"><table><thead><tr><th>Nº</th><th>Data</th><th>Assunto</th><th>Local</th><th>Situação</th><th>Prazo</th></tr></thead><tbody>
  ${l.length ? l.map(x => `<tr class="clic" data-id="${esc(x.id)}" tabindex="0">
    <td><b>${numero(x.numero)}</b>${x.pendente_rh ? ` <span class="sel aviso">novo</span>` : ""}</td>
    <td>${dataBR(x.criado_em)}</td>
    <td>${esc(TIPOS[x.tipo][0])}${x.envolve_rh ? ` <span class="sel crit">envolve RH</span>` : ""}</td>
    <td>${esc(x.local)}</td>
    <td><span class="sel ${STATUS[x.status].cls}">${STATUS[x.status].rot}</span></td>
    <td>${seloPrazo(x)}</td></tr>`).join("")
    : `<tr><td colspan="6">Nenhuma denúncia neste filtro.</td></tr>`}
  </tbody></table></div>`}`;

  app.querySelectorAll("[data-aba]").forEach(b => b.onclick = () => { R.aba = b.dataset.aba; render(); });
  if(R.aba === "resumo"){ const im = $("#imprimir"); if(im) im.onclick = () => print(); const an = $("#ano"); if(an) an.onchange = () => { R.ano = +an.value; render(); }; return; }
  $("#fstatus").onchange = ev => { R.fStatus = ev.target.value; render(); };
  $("#ftipo").onchange = ev => { R.fTipo = ev.target.value; render(); };
  $("#atualizar").onclick = async () => { R.lista = await api.rh.listar(); render(); };
  $("#csv").onclick = () => exportar(l);
  const abrir = async id => { app.innerHTML = `<p>Carregando…</p>`;
    try{ R.det = await api.rh.detalhe(id);
      if(R.det.pendente_rh){ await api.rh.atualizar(id, {pendente_rh:false}); const it = R.lista.find(x => x.id === id); if(it) it.pendente_rh = false; }
    }catch(e){ alert(e.message); }
    scrollTo(0, 0); render(); };
  app.querySelectorAll("tr.clic").forEach(tr => { tr.onclick = () => abrir(tr.dataset.id); tr.onkeydown = ev => { if(ev.key === "Enter") abrir(tr.dataset.id); }; });
}

function htmlResumo(){
  const R = S.rh, anos = [...new Set(R.lista.map(x => new Date(x.criado_em).getFullYear()))].sort((a, b) => b - a);
  if(!anos.length) return `<p>Ainda não há denúncias registradas.</p>`;
  const ano = anos.includes(R.ano) ? R.ano : anos[0];
  const doAno = R.lista.filter(x => new Date(x.criado_em).getFullYear() === ano);
  const conta = (f) => doAno.filter(f).length;
  return `
  <div class="barra"><label>Ano: <select id="ano">${anos.map(a => `<option ${a === ano ? "selected" : ""}>${a}</option>`).join("")}</select></label>
    <span class="esp"></span><button class="btn peq sec" id="imprimir" type="button">Imprimir</button></div>
  <div class="card"><h2>Canal de Denúncia — Resumo ${ano}</h2>
    <p class="nota">Somente quantidades, sem identificar pessoas nem casos. Para uso da CIPA nas ações de prevenção (NR-1, item 1.4.1.1; NR-5).${R.papel === "rh" ? " Não inclui denúncias que envolvem o RH." : ""}</p>
    <div class="rolo"><table><thead><tr><th>Assunto</th><th>Recebidas</th><th>Em andamento</th><th>Concluídas</th><th>Encerradas sem prosseguir</th></tr></thead><tbody>
    ${Object.entries(TIPOS).map(([k, [t]]) => `<tr><td>${t}</td><td>${conta(x => x.tipo === k)}</td>
      <td>${conta(x => x.tipo === k && !["concluida","arquivada"].includes(x.status))}</td>
      <td>${conta(x => x.tipo === k && x.status === "concluida")}</td><td>${conta(x => x.tipo === k && x.status === "arquivada")}</td></tr>`).join("")}
    <tr><td><b>Total</b></td><td><b>${doAno.length}</b></td><td><b>${conta(x => !["concluida","arquivada"].includes(x.status))}</b></td>
      <td><b>${conta(x => x.status === "concluida")}</b></td><td><b>${conta(x => x.status === "arquivada")}</b></td></tr>
    </tbody></table></div>
    <p class="nota" style="margin-top:10px">Emitido em ${dataBR(new Date())}.</p></div>`;
}

function exportar(l){
  const cab = ["Numero","Data","Assunto","Local","Situacao","Envolve RH","Inicio apuracao","Inicio conclusao","Encerrada em"];
  const lin = l.map(x => [numero(x.numero), dataBR(x.criado_em), TIPOS[x.tipo][0], x.local, STATUS[x.status].rot, x.envolve_rh ? "Sim" : "Não",
    dataBR(x.apuracao_em), dataBR(x.conclusao_em), dataBR(x.encerrada_em)]);
  const csv = "﻿" + [cab, ...lin].map(r => r.map(c => `"${String(c == null ? "" : c).replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = `canal-denuncia-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

function vRHDetalhe(app){
  const R = S.rh, d = R.det, quem = d.envolve_rh ? "Direção" : "RH";
  const prox = {recebida:[["apuracao","Iniciar apuração"],["arquivada","Encerrar sem prosseguir"]],
                apuracao:[["conclusao","Passar para conclusão"],["arquivada","Encerrar sem prosseguir"]],
                conclusao:[["concluida","Concluir"],["apuracao","Voltar para apuração"]],
                concluida:[["apuracao","Reabrir"]], arquivada:[["apuracao","Reabrir"]]}[d.status];
  app.innerHTML = `
  <a class="voltar naoimp" href="#" id="volta">← Voltar à lista</a>
  <h1>${numero(d.numero)} · ${esc(TIPOS[d.tipo][0])}</h1>
  <p><span class="sel ${STATUS[d.status].cls}">${STATUS[d.status].rot}</span> ${seloPrazo(d)} ${d.envolve_rh ? `<span class="sel crit">envolve RH — só Direção</span>` : ""}</p>
  <div class="grade2">
   <div>
    <div class="card"><h2>Relato</h2><div class="relato">${esc(d.relato)}</div>
      <dl class="dl" style="margin-top:12px">
        <dt>Registrada em</dt><dd>${dataHoraBR(d.criado_em)}</dd>
        <dt>Onde</dt><dd>${esc(d.local) || "—"}</dd><dt>Quando</dt><dd>${esc(d.quando) || "—"}</dd>
        <dt>Quem fez</dt><dd>${esc(d.envolvidos) || "—"}</dd><dt>Testemunhas</dt><dd>${esc(d.testemunhas) || "—"}</dd>
        <dt>Denunciante</dt><dd>${d.ident_nome || d.ident_contato ? `${esc(d.ident_nome)} ${esc(d.ident_contato)} <span class="sel aviso">identificou-se: manter sigilo</span>` : "Anônimo"}</dd>
      </dl></div>
    <div class="card"><h2>Anexos</h2>${d.anexos.length ? `<ul class="arqs">${d.anexos.map((a, i) =>
      `<li><span>${esc(a.nome)} · ${(a.tamanho/1048576).toFixed(1)} MB</span><button type="button" data-anexo="${i}" style="color:var(--lar-esc)">Abrir</button></li>`).join("")}</ul>
      <p class="nota">O link de cada anexo vale por 5 minutos. Não encaminhe nem salve fora da empresa.</p>` : `<p class="nota">Sem anexos.</p>`}</div>
    <div class="card"><h2>Conversa com o denunciante</h2>
      ${d.msgs.length ? d.msgs.map(m => `<div class="msg ${m.autor === "rh" ? "rh" : "den"}"><small>${m.autor === "rh" ? quem : "Denunciante"} · ${dataHoraBR(m.em)}</small>${esc(m.texto)}</div>`).join("") : `<p class="nota">Nenhuma mensagem ainda.</p>`}
      <form id="fmsg" class="naoimp"><label class="campo" for="tmsg">Mensagem ao denunciante<small>Ele lê pelo protocolo. Não cite nomes nem detalhes da apuração.</small></label>
        <textarea id="tmsg" maxlength="4000" style="min-height:90px"></textarea>
        <button class="btn peq" type="submit" style="margin-top:8px">Enviar mensagem</button></form></div>
   </div>
   <div>
    <div class="card naoimp"><h2>Andamento</h2>
      <div class="duo" style="grid-template-columns:1fr;margin-bottom:0">${prox.map(([k, t], i) => `<button class="btn ${i ? "sec" : ""}" type="button" data-status="${k}">${t}</button>`).join("")}</div></div>
    <div class="card"><h2>Medida / conclusão</h2>
      <p class="nota">Registro interno do que foi apurado e decidido. O denunciante não vê.</p>
      <textarea id="medida" maxlength="6000" style="min-height:120px">${esc(d.medida)}</textarea>
      <button class="btn peq naoimp" id="salvamedida" type="button" style="margin-top:8px">Salvar</button></div>
    <div class="card"><h2>Anotações internas e histórico</h2>
      ${d.notas.length ? d.notas.map(n => `<div class="notai ${n.automatica ? "auto" : ""}"><small>${dataHoraBR(n.em)} · ${esc(n.usuario)}</small>${esc(n.texto)}</div>`).join("") : `<p class="nota">Sem anotações.</p>`}
      <form id="fnota" class="naoimp"><label class="campo" for="tnota">Nova anotação<small>Oitivas, documentos, providências. Não pode ser apagada depois.</small></label>
        <textarea id="tnota" maxlength="6000" style="min-height:90px"></textarea>
        <button class="btn peq sec" type="submit" style="margin-top:8px">Registrar anotação</button></form></div>
    <button class="btn peq sec naoimp" type="button" id="impdet">Imprimir este caso</button>
   </div>
  </div>`;

  const recarrega = async () => { R.det = await api.rh.detalhe(d.id); const it = R.lista.find(x => x.id === d.id); if(it) Object.assign(it, {status:R.det.status, apuracao_em:R.det.apuracao_em, conclusao_em:R.det.conclusao_em, encerrada_em:R.det.encerrada_em, pendente_rh:R.det.pendente_rh}); render(); };
  const faz = async (bt, f) => { bt.disabled = true; try{ await f(); await recarrega(); }catch(e){ alert(e.message); bt.disabled = false; } };
  $("#volta").onclick = ev => { ev.preventDefault(); R.det = null; render(); };
  $("#impdet").onclick = () => print();
  app.querySelectorAll("[data-status]").forEach(b => b.onclick = () => {
    const k = b.dataset.status;
    if((k === "concluida" || k === "arquivada") && !confirm(`Confirmar: ${b.textContent.toLowerCase()}?\nO denunciante verá a nova situação pelo protocolo.`)) return;
    faz(b, () => api.rh.atualizar(d.id, {status:k}));
  });
  $("#salvamedida").onclick = ev => faz(ev.target, () => api.rh.atualizar(d.id, {medida:$("#medida").value.trim()}));
  $("#fmsg").onsubmit = ev => { ev.preventDefault(); const t = $("#tmsg").value.trim(); if(t.length < 2) return; faz(ev.target.querySelector("button"), () => api.rh.msg(d.id, t)); };
  $("#fnota").onsubmit = ev => { ev.preventDefault(); const t = $("#tnota").value.trim(); if(t.length < 2) return; faz(ev.target.querySelector("button"), () => api.rh.nota(d.id, t)); };
  app.querySelectorAll("[data-anexo]").forEach(b => b.onclick = async () => {
    try{ window.open(await api.rh.urlAnexo(d.anexos[+b.dataset.anexo].caminho), "_blank", "noopener"); }catch(e){ alert(e.message); } });
}

/* ---------------- partida ---------------- */
// Link de "esqueci a senha" volta com o token no endereço: leva direto ao painel.
if(/access_token=|type=recovery/.test(location.hash)){ S.rh.fase = "carregando"; real.rh.cliente().then(() => { if(rota() !== "rh") history.replaceState(null, "", location.pathname + location.search + "#rh"); render(); }).catch(() => render()); }
else render();
</script>
