/* ---------- sessão ---------- */
async function entrar(d) {
  const email = normEmail(d.email);
  const senha = String(d.senha || "");
  const criar = S.modoEntrada === "criar";

  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("E-mail inválido.", true);
  if (!dominioOk(email)) return toast("E-mail fora dos domínios liberados. Peça ao administrador para liberar.", true);
  if (senha.length < 8) return toast("A senha precisa ter pelo menos 8 caracteres.", true);

  S.emailLembrado = email;

  try {
    if (criar) {
      const nome = String(d.nome || "").trim();
      if (!nome) return toast("Informe seu nome.", true);
      if (senha !== String(d.senha2 || "")) return toast("As duas senhas não são iguais.", true);

      toast("Criando seu acesso…");
      const { data, error } = await sbAuth.auth.signUp({ email, password: senha, options: { data: { nome } } });
      if (error) throw error;

      if (!data || !data.session) {
        /* acontece se a confirmação de e-mail ainda estiver ligada no Supabase */
        S.modoEntrada = "entrar"; render();
        return toast("Acesso criado. Agora entre com e-mail e senha.");
      }
      await aoEntrar(data.session);
    } else {
      toast("Entrando…");
      const { data, error } = await sbAuth.auth.signInWithPassword({ email, password: senha });
      if (error) throw error;
      await aoEntrar(data.session);
    }
  } catch (e) { toast(erroMsg(e), true); }
}

/* o login vale tambem para a Central (mesma chave): o app so repassa o que o Supabase devolveu */
async function aoEntrar(ss) {
  const g = sessaoParaGuardar(ss);
  guardarSessao(g);
  await aoMudarSessao(sessaoDoApp(g));
}

async function sair() {
  const g = lerSessaoGuardada();
  if (g && g.access_token) {
    /* encerra so esta sessao no Supabase (os outros aparelhos continuam logados) */
    try { fetch(SUPABASE_URL + "/auth/v1/logout?scope=local", { method: "POST", keepalive: true, headers: { apikey: SUPABASE_ANON, Authorization: "Bearer " + g.access_token } }).catch(() => {}); } catch (e) {}
  }
  guardarSessao(null);
  limparSessaoLocal();
}

async function definirSenha(d) {
  const senha = String(d.senha || "");
  if (senha.length < 8) return toast("A senha precisa ter pelo menos 8 caracteres.", true);

  toast("Definindo…");
  try {
    const { data, error } = await sb.functions.invoke(FUNCAO_SENHA, {
      body: { user_id: d.uid, senha }
    });
    if (error) {
      /* a funcao devolve o motivo no corpo; sem isso vira "non-2xx status" */
      let motivo = error.message;
      try {
        if (error.context && typeof error.context.json === "function") {
          const j = await error.context.json();
          if (j && j.erro) motivo = j.erro;
        }
      } catch (_) {}
      throw new Error(motivo);
    }
    if (data && data.erro) throw new Error(data.erro);
    renderOverlay();
    toast("Senha definida. Passe para a pessoa.");
  } catch (e) { toast(erroMsg(e), true); }
}

/* ---------- itens ---------- */
async function gravarItem(d) {
  const base = {
    familia: d.familia, item: String(d.item || "").trim(), liga: d.liga || "",
    comp: num(d.comp), larg: num(d.larg), alt: num(d.alt),
    condicao: d.condicao, custo: num(d.custo),
    local: String(d.local || "").trim(), obs: String(d.obs || "").trim()
  };

  try {
    if (S.editando && S.editando !== "novo") {
      const code = S.editando;
      const { error } = await sb.from("itens").update(base).eq("code", code);
      if (error) throw error;
      await sincronizarFotos(code, S.rascunhoFotos);
      await registrar(code, "editado", "");
      S.editando = null; S.rascunhoFotos = [];
      toast(code + " atualizada.");
      S.aberto = code; S.view = "busca";
      await carregarTudo();
      return;
    }

    const { data: code, error: eCod } = await sb.rpc("proximo_codigo");
    if (eCod) throw eCod;

    const { error } = await sb.from("itens").insert(Object.assign({}, base, {
      code, criado_por: S.user.email, criado_por_nome: S.user.nome
    }));
    if (error) throw error;

    await sincronizarFotos(code, S.rascunhoFotos);
    await registrar(code, "criado", "");
    S.rascunhoFotos = []; S.editando = null;
    toast(code + " cadastrada.");
    S.aberto = code; S.view = "home";
    await carregarTudo();
    window.scrollTo(0, 0);
  } catch (e) { toast(erroMsg(e), true); }
}

  /* no celular abre o compartilhamento do proprio sistema (WhatsApp e o resto) */

/* ---------- lembrete no calendário ---------- */
function lembrete(it) {
  const r = it.reserva; if (!r) return;
  const quando = new Date(Math.max(Date.now() + 60000, r.expira - (S.cfg.alertaDias || 5) * DAY));
  quando.setHours(8, 0, 0, 0);
  const fim = new Date(quando.getTime() + 15 * 60000);
  const z = (dt) => dt.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const titulo = "Reserva " + it.code + " vence em " + (S.cfg.alertaDias || 5) + " dias";
  const det = [it.item, medidas(it), it.local ? "Local: " + it.local : "", r.cliente ? "Cliente: " + r.cliente : "", r.pedido ? "Pedido: " + r.pedido : "", "Vence em " + fmtData(r.expira), urlItem(it.code)].filter(Boolean).join("\n");
  const url = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(titulo)
    + "&dates=" + z(quando) + "/" + z(fim)
    + "&details=" + encodeURIComponent(det);

  const a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
  document.body.appendChild(a); a.click(); a.remove();

  el("overlay").insertAdjacentHTML("beforeend", `<div class="mscrim"><div class="modal">
    <h3>Lembrete de ${esc(it.code)}</h3>
    <p class="lead">Abrimos o Google Agenda em outra aba com o evento pronto para ${fmtData(quando)} às 08:00 — é só salvar, e o celular avisa no dia.</p>
    <p class="lead">Se a aba não abriu, copie o link:</p>
    <textarea class="inp mono" style="font-size:11px;min-height:76px" readonly onclick="this.select()">${esc(url)}</textarea>
    <div class="btnrow" style="margin-top:12px"><button class="btn pri" type="button" data-act="fechar-modal">Pronto</button></div>
  </div></div>`);
}

function copiarVencendo() {
  const v = S.items.filter(i => estado(i) === "vencendo").sort((a, b) => a.reserva.expira - b.reserva.expira);
  const txt = "Reservas vencendo — Estoque Livre Rodriaço\n\n" + v.map(i =>
    `${i.code} · ${i.item || ""} ${medidas(i)}${i.local ? " · " + i.local : ""}\n   ${i.reserva.nome} — vence ${fmtData(i.reserva.expira)} (${diasParaVencer(i)} dias)${i.reserva.cliente ? " · " + i.reserva.cliente : ""}`
  ).join("\n") + "\n\nDepois do prazo a peça volta para o estoque.";
  copiar(txt, v.length + " reserva(s) copiada(s). Cole onde quiser.");
}

function copiar(txt, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => toast(msg)).catch(() => fallbackCopiar(txt, msg));
  } else fallbackCopiar(txt, msg);
}
function fallbackCopiar(txt, msg) {
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast(msg); } catch (e) { toast("Não consegui copiar automaticamente.", true); }
  ta.remove();
}

/* ---------- CSV ---------- */
async function exportarCSV() {
  const cols = ["Código", "Família", "Item", "Comp (mm)", "Larg (mm)", "Alt (mm)", "Inox", "Estado", "Local", "Custo", "Situação", "Reservado por", "Vence em", "Cliente", "Pedido", "Dias em estoque", "Cadastro", "Observações"];
  const linhas = S.items.filter(i => !i.archived).map(i => [
    i.code, i.familia, i.item, i.comp, i.larg, i.alt, i.liga, i.condicao, i.local, i.custo,
    { disp: "Disponível", reservado: "Reservado", vencendo: "Reservado", out: "Baixado" }[estado(i)],
    i.reserva ? i.reserva.nome : "", i.reserva ? fmtData(i.reserva.expira) : "",
    i.reserva ? i.reserva.cliente : "", i.reserva ? i.reserva.pedido : "",
    dias(i.createdAt), fmtData(i.createdAt), i.obs
  ]);
  const cel = (v) => { const s = String(v == null ? "" : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = "﻿" + [cols, ...linhas].map(l => l.map(cel).join(";")).join("\r\n");
  const nome = "estoque-livre-" + new Date().toISOString().slice(0, 10) + ".csv";
  baixar(nome, csv, "text/csv;charset=utf-8");
  toast("CSV baixado.");
}

/* ---------- etiquetas ---------- */
function podeEtiquetar(itens) {
  if (typeof jspdf === "undefined" || typeof QRious === "undefined") { toast("Gerador de etiquetas nao carregou. Recarregue a pagina.", true); return false; }
  if (!itens.length) { toast("Nenhuma peca para etiquetar.", true); return false; }
  return true;
}

/* Zebra: uma etiqueta por pagina, no tamanho exato da midia */
async function etiquetaZebra(lista) {
  const itens = lista.filter(i => !i.archived);
  if (!podeEtiquetar(itens)) return;

  const W = Math.min(300, Math.max(20, num(S.cfg.etqLargura) || 100));
  const H = Math.min(300, Math.max(15, num(S.cfg.etqAltura) || 58));
  const k = Math.min(W / 100, H / 58);

  toast("Montando " + itens.length + " etiqueta(s) de " + W + "x" + H + " mm...");
  /* jsPDF reordena o formato conforme a orientacao: uma etiqueta 100x58 e PAISAGEM.
     Passar "p" aqui invertia a pagina para 58x100 - era o defeito da impressao. */
  const deitada = W >= H;
  const orient = deitada ? "l" : "p";
  const fmt = deitada ? [Math.max(W, H), Math.min(W, H)] : [Math.min(W, H), Math.max(W, H)];
  const { jsPDF } = jspdf;
  const doc = new jsPDF({ unit: "mm", format: fmt, orientation: orient });
  const qr = new QRious({ size: 320, level: "M", background: "#ffffff", foreground: "#000000" });

  const m = 4 * k;
  const qs = Math.min(H - 2 * m, W * 0.38);
  const tx = m + qs + 4 * k;
  const tw = Math.max(12, W - tx - m);

  itens.forEach((it, n) => {
    if (n > 0) doc.addPage(fmt, orient);
    qr.value = urlItem(it.code);
    try { doc.addImage(qr.toDataURL("image/png"), "PNG", m, (H - qs) / 2, qs, qs); } catch (e) {}

    doc.setTextColor(0);
    let y = m + 7 * k;
    doc.setFont("courier", "bold"); doc.setFontSize(20 * k);
    doc.text(it.code, tx, y);

    y += 9 * k;
    doc.setFont("helvetica", "bold"); doc.setFontSize(10 * k);
    const nome = doc.splitTextToSize(String(it.item || "").toUpperCase(), tw).slice(0, 2);
    doc.text(nome, tx, y);
    y += nome.length * 4.6 * k + 2 * k;

    doc.setFont("helvetica", "normal"); doc.setFontSize(8 * k);
    doc.text(doc.splitTextToSize([it.familia, it.liga ? "INOX " + it.liga : "", it.condicao].filter(Boolean).join(" / ").toUpperCase(), tw)[0] || "", tx, y);

    y += 5 * k;
    doc.setFont("courier", "bold"); doc.setFontSize(9.5 * k);
    doc.text(medidas(it), tx, y);

    if (it.local) {
      y += 5 * k;
      doc.setFont("helvetica", "normal"); doc.setFontSize(7.5 * k);
      doc.text(doc.splitTextToSize(String(it.local), tw)[0] || "", tx, y);
    }

    doc.setFont("helvetica", "bold"); doc.setFontSize(5.6 * k);
    doc.text("RODRIACO  ·  ESTOQUE LIVRE", m, H - 2.2 * k);
  });

  const nome = itens.length === 1
    ? "etiqueta-" + itens[0].code + "-" + W + "x" + H + "mm.pdf"
    : "etiquetas-zebra-" + itens.length + "-" + W + "x" + H + "mm.pdf";
  baixar(nome, doc.output("blob"));
  toast("Etiquetas prontas para a Zebra.");
}

/* Folha A4 para impressora comum: 3 x 7 rotulos de 70 x 37 mm */
async function etiquetasA4(lista) {
  const itens = lista.filter(i => !i.archived);
  if (!podeEtiquetar(itens)) return;

  toast("Montando folha com " + itens.length + " etiqueta(s)...");
  const { jsPDF } = jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const LW = 70, LH = 37, MX = 0, MY = 8, COLS = 3, ROWS = 7;
  const qr = new QRious({ size: 220, level: "M", background: "#ffffff", foreground: "#000000" });

  itens.forEach((it, n) => {
    const idx = n % (COLS * ROWS);
    if (idx === 0 && n > 0) doc.addPage();
    const x = MX + (idx % COLS) * LW;
    const y = MY + Math.floor(idx / COLS) * LH;

    doc.setDrawColor(210); doc.setLineWidth(0.15);
    doc.rect(x + 1.5, y + 1.5, LW - 3, LH - 3);

    qr.value = urlItem(it.code);
    try { doc.addImage(qr.toDataURL("image/png"), "PNG", x + 4, y + 6, 25, 25); } catch (e) {}

    const tx = x + 32;
    doc.setFont("courier", "bold"); doc.setFontSize(13); doc.setTextColor(0);
    doc.text(it.code, tx, y + 11);
    doc.setFont("helvetica", "bold"); doc.setFontSize(8.5);
    doc.text(doc.splitTextToSize(String(it.item || "").toUpperCase(), LW - 36).slice(0, 2), tx, y + 16);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(70);
    doc.text([it.familia, it.liga ? "INOX " + it.liga : "", it.condicao].filter(Boolean).join(" / "), tx, y + 24);
    doc.setFont("courier", "normal"); doc.setFontSize(8);
    doc.text(medidas(it), tx, y + 28);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7);
    doc.text(String(it.local || "").slice(0, 30), tx, y + 32);
    doc.setFontSize(5.6); doc.setTextColor(140);
    doc.text("RODRIACO · Estoque Livre", x + 4, y + 33.5);
  });

  baixar("etiquetas-a4-" + itens.length + ".pdf", doc.output("blob"));
  toast("Folha A4 pronta.");
}

async function carregarExemplos() {
  toast("Criando itens de exemplo…");
  try {
    for (const e of EXEMPLOS) {
      const { data: code, error: eCod } = await sb.rpc("proximo_codigo");
      if (eCod) throw eCod;
      const { error } = await sb.from("itens").insert(Object.assign({}, e, {
        code, exemplo: true, criado_por: S.user.email, criado_por_nome: S.user.nome,
        criado_em: new Date(Date.now() - Math.floor(Math.random() * 150) * DAY).toISOString()
      }));
      if (error) throw error;
      await registrar(code, "criado", "item de exemplo");
    }
    toast("5 itens de exemplo criados.");
    await carregarTudo();
  } catch (e) { toast(erroMsg(e), true); }
}

  const ex = S.items.filter(i => i.exemplo);

    const { error } = await sb.from("itens").delete().eq("exemplo", true);
    if (error) throw error;
    toast("Exemplos removidos.");

}
