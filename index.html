<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Central Rodriaço</title><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet"><style id="estilos">
  :root {
    --bg: #17161A;
    --surface: #1F1E23;
    --surface-2: #29282E;
    --ink: #E7E7EA;
    --ink-strong: #FFFFFF;
    --muted: #8B8A93;
    --border: #322F37;
    --accent: #EB7832;
    --accent-strong: #ED6700;
    --accent-soft: #3A2414;
    --good: #7FC79B;
    --good-soft: #1F2E24;
    --danger: #E5695A;
    --danger-soft: #3A241D;
    --navbar-bg: #0E0D10;
    --navbar-border: #2A2830;
    --navbar-ink: #E7E9EC;
    --navbar-muted: #9AA5AD;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px rgba(0,0,0,0.5);
    --shadow-drop: 0 12px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Montserrat', 'Segoe UI', -apple-system, Roboto, sans-serif; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* ===== BARRA DE NAVEGAÇÃO ===== */
  .navbar { background: var(--navbar-bg); border-bottom: 1px solid var(--navbar-border); display: flex; align-items: center; gap: 4px; padding: 0 14px; height: 52px; position: relative; z-index: 100; overflow-x: auto; }
  .navbar-marca { display: flex; align-items: center; gap: 9px; padding-right: 12px; margin-right: 8px; border-right: 1px solid var(--navbar-border); flex: none; }
  .navbar-marca .selo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #0F0F0F; }
  .navbar-marca strong { color: #fff; font-size: 13.5px; letter-spacing: .03em; white-space: nowrap; }
  .navbar-menu { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
  .botao-menu { background: none; border: none; cursor: pointer; font-family: inherit; color: var(--navbar-muted); font-size: 12.5px; font-weight: 600; padding: 0 10px; height: 52px; display: flex; align-items: center; gap: 5px; white-space: nowrap; border-bottom: 2px solid transparent; }
  .botao-menu:hover { color: #fff; background: rgba(255,255,255,.04); }
  .botao-menu.disponivel { color: var(--navbar-ink); }
  .navbar-direita { display: flex; align-items: center; gap: 4px; flex: none; padding-left: 8px; }
  .icone-topo { width: 32px; height: 32px; border-radius: 7px; border: none; background: none; color: var(--navbar-muted); font-size: 15px; cursor: not-allowed; display: grid; place-items: center; }
  .icone-topo:disabled { opacity: .55; }
  .pill-usuario { display: flex; align-items: center; gap: 7px; margin-left: 6px; background: rgba(255,255,255,.06); border: 1px solid var(--navbar-border); border-radius: 20px; padding: 5px 11px 5px 6px; color: var(--navbar-ink); font-size: 12px; font-weight: 600; }
  .pill-usuario .avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-size: 10px; color: #0F0F0F; font-weight: 800; }

  /* ===== SUB-CABEÇALHO ===== */
  .subcabecalho { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .subcabecalho .titulo-pagina { font-size: 14.5px; font-weight: 700; color: var(--ink-strong); }

  .status-pill { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 6px 11px; border-radius: 20px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .status-pill.salvando { background: var(--accent-soft); color: var(--accent-strong); }
  .status-pill.erro { background: var(--danger-soft); color: var(--danger); }
  .status-pill.leitura { background: var(--surface-2); color: var(--muted); }

  /* ===== TABSTRIP (estilo Chrome) ===== */
  .tabstrip { display: flex; align-items: flex-end; gap: 2px; padding: 8px 14px 0; background: var(--surface-2); border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tabstrip:empty { display: none; }
  .tab-chip { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 8px 8px 0 0; background: var(--surface-2); color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; border: 1px solid transparent; border-bottom: none; position: relative; top: 1px; }
  .tab-chip.ativa { background: var(--surface); color: var(--ink-strong); border-color: var(--border); }
  .tab-chip:not(.ativa):hover { background: var(--border); }
  .tab-fechar { opacity: .55; border-radius: 4px; padding: 1px 5px; font-size: 10px; }
  .tab-fechar:hover { opacity: 1; background: var(--danger-soft); color: var(--danger); }

  #areaAbas { background: var(--surface); min-height: 60vh; }
  .painel-aba { display: none; max-width: 1180px; margin: 0 auto; padding: 28px 24px 56px; }
  .painel-aba.ativa { display: block; }

  .placeholder-modulo { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 90px 20px; color: var(--muted); text-align: center; }
  .placeholder-modulo .ic { font-size: 42px; opacity: .55; }
  .placeholder-modulo h3 { margin: 0; color: var(--ink-strong); font-size: 17px; }
  .placeholder-modulo p { margin: 0; font-size: 13px; }

  /* ===== INÍCIO: intro + grade de módulos ===== */
  .intro { max-width: 62ch; margin-bottom: 26px; }
  .intro h2 { font-size: 21px; margin: 0 0 8px; color: var(--ink-strong); }
  .intro p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  .secao-titulo { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .cartao { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; gap: 9px; transition: transform .12s ease, border-color .12s ease; }
  .cartao:hover { transform: translateY(-2px); border-color: var(--accent); }
  .cartao .icone { width: 40px; height: 40px; border-radius: 9px; background: var(--accent-soft); display: grid; place-items: center; font-size: 19px; }
  .cartao h3 { margin: 0; font-size: 14.5px; color: var(--ink-strong); }
  .cartao p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; flex: 1; }
  .selo-tag { align-self: flex-start; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; background: var(--good-soft); color: var(--good); }
  .aviso-status { margin-top: 30px; padding: 14px 16px; border: 1px dashed var(--border); border-radius: 10px; font-size: 12.5px; color: var(--muted); line-height: 1.6; display: flex; gap: 10px; align-items: flex-start; }
  .aviso-status .marcador { font-size: 15px; flex: none; }

  /* ===== CADASTRO TÉCNICO (embutido) ===== */
  .abas-cad { display: flex; gap: .4rem; border-bottom: 1px solid var(--border); margin-bottom: 1.1rem; }
  .aba { background: none; border: none; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 13.5px; color: var(--muted); padding: 10px 6px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .aba:hover { color: var(--ink); }
  .aba.ativa { color: var(--accent-strong); border-bottom-color: var(--accent); }

  .btn { border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 13px; padding: 9px 14px; display: inline-flex; align-items: center; gap: .4rem; white-space: nowrap; }
  .btn:active { transform: translateY(1px); }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .btn-primario { background: var(--accent); color: #fff; }
  .btn-primario:hover { background: var(--accent-strong); }
  .btn-contorno { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
  .btn-contorno:hover { border-color: var(--accent); color: var(--accent-strong); }
  .btn-perigo { background: var(--danger); color: #fff; }
  .btn-perigo:hover { background: #a5342a; }

  .lista-cab { display: flex; justify-content: flex-end; margin-bottom: .9rem; }
  .lista-vazia, .lista-vazia-mini { color: var(--muted); font-size: 13px; padding: 1.5rem; text-align: center; border: 1px dashed var(--border); border-radius: 8px; }
  .lista-vazia-mini { padding: .9rem; font-size: 12.5px; }

  .tabela-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--surface); }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
  thead th { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.linha-clicavel { cursor: pointer; }
  tr.linha-clicavel:hover { background: var(--surface-2); }
  td.col-acao { text-align: right; color: var(--muted); width: 20px; }
  .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .muted { color: var(--muted); }
  tr.linha-sub td:first-child { padding-left: 30px; }

  .badge-categoria { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
  .badge-categoria.materia_prima { background: var(--accent-soft); color: var(--accent-strong); }
  .badge-categoria.comprado, .badge-categoria.mao_de_obra { background: var(--surface-2); color: var(--muted); }
  .badge-status { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
  .status-op-aberta { background: var(--accent-soft); color: var(--accent-strong); }
  .status-op-producao { background: var(--surface-2); color: var(--ink); }
  .status-op-concluida { background: var(--good-soft); color: var(--good); }
  .status-op-cancelada { background: var(--danger-soft); color: var(--danger); }
  .card-grupo { border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 14px; background: var(--surface); }
  .subbloco { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .check-lista { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .check-lista label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .status-op-liberada { background: var(--good-soft); color: var(--good); }
  .mapa-producao { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .coluna-mapa { flex: 0 0 220px; background: var(--surface-2); border-radius: 8px; padding: 10px; }
  .coluna-mapa-cab { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .coluna-mapa-corpo { display: flex; flex-direction: column; gap: 8px; }
  .cartao-op { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; cursor: pointer; }
  .cartao-op:hover { border-color: var(--accent); }
  #areaOperador { position: fixed; inset: 0; background: var(--bg); z-index: 3000; overflow-y: auto; padding: 20px; }
  .op-tela-grande { max-width: 480px; margin: 40px auto; }
  .op-btn-grande { width: 100%; padding: 18px; font-size: 16px; border-radius: 10px; }
  .op-card-fila { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 10px; cursor: pointer; font-size: 13.5px; }
  .op-card-fila:hover { border-color: var(--accent); }
  .campo-busca { position: relative; }
  .busca-resultados { position: absolute; top: 100%; left: 0; right: 0; z-index: 500; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-top: 2px; max-height: 220px; overflow-y: auto; box-shadow: var(--shadow-drop); }
  .busca-opcao { padding: 8px 10px; font-size: 13px; cursor: pointer; }
  .busca-opcao:hover { background: var(--surface-2); }
  .busca-vazia { padding: 8px 10px; font-size: 12.5px; color: var(--muted); }
  .filtro-checklist-input { width: 100%; margin-bottom: 8px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 12.5px; font-family: inherit; background: var(--surface); color: var(--ink); }

  .grupo-estagio { margin-bottom: 1.4rem; }
  .grupo-estagio h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 .6rem; font-size: 13.5px; color: var(--ink-strong); }
  .contagem-estagio { font-size: 11px; font-weight: 700; color: var(--accent-strong); background: var(--accent-soft); padding: 2px 8px; border-radius: 20px; }

  .detalhe-topo { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .6rem; margin-bottom: 1.1rem; }
  .detalhe-acoes { display: flex; gap: .5rem; }

  .campo { margin-bottom: .9rem; text-align: left; }
  .campo-linha { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
  @media (max-width: 640px) { .campo-linha { grid-template-columns: 1fr; } }
  .campo label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: .35rem; }
  .campo input, .campo textarea, .campo select { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13.5px; font-family: inherit; background: var(--surface); color: var(--ink); }
  .campo textarea { resize: vertical; min-height: 56px; }
  .campo input:focus, .campo textarea:focus, .campo select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }

  .bloco-atributos, .bloco-bom, .bloco-simulador { margin-top: 1.6rem; }
  .bloco-cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: .5rem; }
  .bloco-cab h4 { margin: 0; font-size: 14px; color: var(--ink-strong); }
  .dica { font-size: 12px; color: var(--muted); margin: 0 0 .8rem; line-height: 1.5; }
  .aviso-inline { font-size: 12.5px; color: var(--accent-strong); background: var(--accent-soft); padding: 9px 11px; border-radius: 6px; margin-bottom: .9rem; }

  .tabela-editavel input, .tabela-editavel select { padding: 6px 8px; font-size: 12.5px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); color: var(--ink); width: 100%; min-width: 90px; }
  .tabela-editavel td { padding: 7px 8px; }
  .col-check { text-align: center; width: 40px; }
  .icone-btn { background: none; border: none; cursor: pointer; font-size: 13px; padding: 4px 6px; border-radius: 5px; color: var(--muted); }
  .icone-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icone-btn.excluir:hover { background: var(--danger-soft); color: var(--danger); }

  .simulador-valores { display: flex; flex-wrap: wrap; gap: .9rem; margin-bottom: 1.1rem; }
  .campo-sim { width: 150px; margin-bottom: 0; }

  .tabela-resultado td code { font-size: 11.5px; color: var(--muted); }
  .erro-formula { color: var(--danger); font-size: 12px; }
  tr.linha-excluida { opacity: .45; }
  .tag-obrig { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--good); background: var(--good-soft); padding: 3px 7px; border-radius: 20px; white-space: nowrap; }
  .total-simulador { text-align: right; padding: 12px 4px 4px; font-size: 14.5px; color: var(--ink); }
  .total-simulador strong { font-size: 18px; color: var(--ink-strong); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,15,15,.55); align-items: center; justify-content: center; z-index: 2000; padding: 1rem; }
  .modal-overlay.ativo { display: flex; }
  .modal-content { background: var(--surface); color: var(--ink); border-radius: 12px; padding: 1.6rem; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.35); max-height: 88vh; overflow-y: auto; }
  .modal-content h3 { margin: 0 0 1rem; font-size: 16px; color: var(--ink-strong); }
  .modal-mensagem { font-size: 13.5px; color: var(--ink); line-height: 1.5; margin: 0 0 1rem; }
  .modal-aviso { font-size: 12px; color: var(--danger); background: var(--danger-soft); padding: 8px 10px; border-radius: 6px; margin-bottom: .9rem; }
  .modal-acoes { display: flex; gap: .6rem; margin-top: .3rem; flex-wrap: wrap; }
  .modal-acoes .btn { flex: 1; }

  @media (max-width: 700px) {
    .navbar-marca strong { display: none; }
    .subcabecalho { padding: 10px 14px; }
    .painel-aba { padding: 20px 14px 44px; }
  }

  /* ===== IDENTIDADE RODRIACO - layout moderno (sidebar + dashboard) ===== */
  .navbar-marca strong, .intro h2, .cartao h3, .bloco-cab h4, .modal-content h3, .dashboard-cab h2 { text-transform: uppercase; letter-spacing: .03em; }

  .app-shell { display: flex; align-items: flex-start; min-height: 100vh; }
  .sidebar { width: 224px; flex: none; background: var(--navbar-bg); border-right: 1px solid var(--navbar-border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 100; }
  .sidebar .navbar-marca { padding: 18px 18px 16px; margin: 0; border-right: none; border-bottom: 1px solid var(--navbar-border); }
  .sidebar .navbar-menu { flex-direction: column; align-items: stretch; gap: 2px; flex: 1; padding: 10px; min-width: 0; }
  .sidebar .botao-menu { height: 40px; border-radius: 8px; padding: 0 12px; border-bottom: none; justify-content: flex-start; }
  .sidebar .botao-menu.ativo { background: var(--accent-soft); color: var(--accent-strong); }
  .sidebar .botao-menu:hover { background: rgba(255,255,255,.06); color: #fff; }
  .sidebar-rodape { padding: 12px 10px 16px; border-top: 1px solid var(--navbar-border); display: flex; flex-direction: column; gap: 8px; }
  .sidebar-rodape .icone-topo { width: auto; height: 38px; padding: 0 12px; justify-content: flex-start; gap: 8px; cursor: pointer; color: var(--navbar-ink); font-size: 13px; font-weight: 600; }
  .sidebar-rodape .icone-topo:hover { background: rgba(255,255,255,.06); }
  .sidebar-rodape .pill-usuario { margin-left: 0; justify-content: center; }

  .area-principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  @media (max-width: 860px) {
    .sidebar { width: 60px; }
    .sidebar .rotulo-menu, .sidebar .navbar-marca strong { display: none; }
    .sidebar .botao-menu { justify-content: center; padding: 0; }
    .sidebar-rodape .icone-topo { justify-content: center; padding: 0; }
    .sidebar-rodape .icone-topo .rotulo-menu { display: none; }
    .sidebar-rodape .pill-usuario { display: none; }
  }

  /* ===== DASHBOARD CONFIGURAVEL ===== */
  .dashboard-cab { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .dashboard-cab h2 { margin: 0; font-size: 19px; color: var(--ink-strong); }
  .grade-dash { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-bottom: 32px; }
  .widget-dash { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); cursor: grab; transition: border-color .12s ease; }
  .widget-dash.arrastando { opacity: .35; }
  .widget-dash.drag-sobre { border-color: var(--accent); }
  .widget-topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .widget-icone { font-size: 20px; }
  .widget-arrastar { color: var(--muted); font-size: 13px; }
  .widget-valor { font-size: 26px; font-weight: 800; color: var(--ink-strong); line-height: 1.1; }
  .widget-titulo { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* ===== FILTRO E REORDENACAO DE COLUNAS NAS TABELAS ===== */
  .filtro-tabela { margin-bottom: 10px; }
  .in-filtro-tabela { width: 100%; max-width: 320px; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; background: var(--surface); color: var(--ink); }
  .in-filtro-tabela:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  th.th-arrastavel { cursor: grab; user-select: none; }
  th.th-arrastavel.arrastando { opacity: .4; }
  th.th-arrastavel.drag-sobre { background: var(--accent-soft); color: var(--accent-strong); }

  /* ===== KANBAN DE ORCAMENTOS ===== */
  .kanban-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-size: 12.5px; cursor: grab; transition: border-color .12s ease, opacity .12s ease; }
  .kanban-card:hover { border-color: var(--accent); }
  .kanban-card.arrastando { opacity: .35; }
  .coluna-mapa-corpo.drag-sobre { outline: 2px dashed var(--accent); outline-offset: -4px; border-radius: 8px; }
  .kanban-card-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .kanban-card-total { color: var(--accent-strong); font-weight: 700; white-space: nowrap; }
  .kanban-card-cliente { color: var(--muted); font-size: 12px; margin-bottom: 2px; }

/* ===== utilitarios ===== */
function escaparHTML(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function gerarId() { return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function formatarMoeda(v) { return (v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function rotuloCategoria(cat) {
  if (cat === 'materia_prima') return 'Matéria-prima';
  if (cat === 'comprado') return 'Comprado';
  if (cat === 'mao_de_obra') return 'Mão de obra';
  return cat;
}
function normalizarChave(s) {
  var t = String(s || '').toLowerCase();
  if (t.normalize) t = t.normalize('NFD');
  t = t.replace(/[^a-z0-9_]/g, '');
  if (t && /^[0-9]/.test(t)) t = '_' + t;
  return t;
}

/* ===== avaliador de formula: numeros, + - * / (), comparadores, SE/E/OU, variaveis do escopo. sem eval. ===== */
function avaliarFormula(expr, escopo) {
  if (!expr || !expr.trim()) return { ok: false, erro: 'fórmula vazia' };
  try {
    var s = expr, pos = 0;
    function pular() { while (pos < s.length && /\s/.test(s[pos])) pos++; }
    function numero() {
      var inicio = pos;
      while (pos < s.length && /[0-9.]/.test(s[pos])) pos++;
      if (pos === inicio) throw new Error('número esperado');
      return parseFloat(s.slice(inicio, pos));
    }
    function identificador() {
      var inicio = pos;
      while (pos < s.length && /[A-Za-z0-9_]/.test(s[pos])) pos++;
      return s.slice(inicio, pos);
    }
    function chamarFuncao(nome) {
      pos++;
      var args = [];
      pular();
      if (s[pos] === ')') { pos++; }
      else {
        while (true) {
          args.push(comparacao());
          pular();
          if (s[pos] === ';' || s[pos] === ',') { pos++; continue; }
          if (s[pos] === ')') { pos++; break; }
          throw new Error('esperado ";" ou ")" dentro de ' + nome + '()');
        }
      }
      if (nome === 'SE') {
        if (args.length !== 3) throw new Error('SE precisa de 3 argumentos: SE(condição; se_verdadeiro; se_falso)');
        return args[0] ? args[1] : args[2];
      }
      if (nome === 'E') {
        if (!args.length) throw new Error('E() precisa de ao menos 1 condição');
        for (var ia = 0; ia < args.length; ia++) { if (!args[ia]) return 0; }
        return 1;
      }
      if (nome === 'OU') {
        if (!args.length) throw new Error('OU() precisa de ao menos 1 condição');
        for (var ib = 0; ib < args.length; ib++) { if (args[ib]) return 1; }
        return 0;
      }
      throw new Error('função desconhecida: "' + nome + '" (disponíveis: SE, E, OU)');
    }
    function fator() {
      pular();
      if (s[pos] === '(') {
        pos++;
        var v = comparacao();
        pular();
        if (s[pos] !== ')') throw new Error('parêntese não fechado');
        pos++;
        return v;
      }
      if (s[pos] === '-') { pos++; return -fator(); }
      if (s[pos] === '+') { pos++; return fator(); }
      if (/[A-Za-z_]/.test(s[pos] || '')) {
        var nome = identificador();
        pular();
        if (s[pos] === '(') return chamarFuncao(nome.toUpperCase());
        if (!Object.prototype.hasOwnProperty.call(escopo, nome)) throw new Error('variável desconhecida: "' + nome + '"');
        return escopo[nome];
      }
      if (/[0-9.]/.test(s[pos] || '')) return numero();
      throw new Error('caractere inesperado: "' + (s[pos] || 'fim da fórmula') + '"');
    }
    function termo() {
      var v = fator();
      pular();
      while (s[pos] === '*' || s[pos] === '/') {
        var op = s[pos]; pos++;
        var d = fator();
        v = op === '*' ? v * d : v / d;
        pular();
      }
      return v;
    }
    function expressao() {
      var v = termo();
      pular();
      while (s[pos] === '+' || s[pos] === '-') {
        var op = s[pos]; pos++;
        var d = termo();
        v = op === '+' ? v + d : v - d;
        pular();
      }
      return v;
    }
    function comparacao() {
      var v = expressao();
      pular();
      var op = null;
      if (s[pos] === '>' && s[pos + 1] === '=') { op = '>='; pos += 2; }
      else if (s[pos] === '<' && s[pos + 1] === '=') { op = '<='; pos += 2; }
      else if (s[pos] === '<' && s[pos + 1] === '>') { op = '<>'; pos += 2; }
      else if (s[pos] === '>') { op = '>'; pos++; }
      else if (s[pos] === '<') { op = '<'; pos++; }
      else if (s[pos] === '=') { op = '='; pos++; }
      if (!op) return v;
      var d = expressao();
      if (op === '>') return v > d ? 1 : 0;
      if (op === '<') return v < d ? 1 : 0;
      if (op === '>=') return v >= d ? 1 : 0;
      if (op === '<=') return v <= d ? 1 : 0;
      if (op === '=') return v === d ? 1 : 0;
      return v !== d ? 1 : 0;
    }
    var resultado = comparacao();
    pular();
    if (pos < s.length) throw new Error('sobrou "' + s.slice(pos) + '" no final');
    if (!isFinite(resultado)) throw new Error('resultado inválido (divisão por zero?)');
    return { ok: true, valor: resultado };
  } catch (e) {
    return { ok: false, erro: e.message };
  }
}

function montarNavbar() {

    });
  });
  document.querySelectorAll('.botao-sub').forEach(function (b) {
    b.addEventListener('click', function () { abrirSub(b.getAttribute('data-modulo'), b.getAttribute('data-sub')); });
  });
  if (!window.__menuSelLigado) {
    window.__menuSelLigado = true;
    window.addEventListener('resize', posicionarSelMenu);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(posicionarSelMenu);
  }
}
function alternarGrupoMenu(chave, forcar) {
  var g = document.querySelector('.grupo-menu[data-grupo-chave="' + chave + '"]');
  if (!g) return;
  g.classList.toggle('aberto', forcar === undefined ? !g.classList.contains('aberto') : forcar);
  posicionarSelMenu();
}
/* a moldura fica atras do item ativo e desliza de um para o outro; a primeira vez nasce no lugar */
function posicionarSelMenu() {
  var sel = document.getElementById('menuSel');
  if (!sel) return;
  var alvo = document.querySelector('.botao-sub.ativo');
  if (!alvo || !alvo.offsetParent) alvo = document.querySelector('.botao-menu.ativo');
  if (!alvo || !alvo.offsetParent) { sel.classList.remove('visivel'); return; }
  function aplicar() {
    sel.style.transform = 'translateY(' + alvo.offsetTop + 'px)';
    sel.style.height = alvo.offsetHeight + 'px';
    sel.style.left = alvo.offsetLeft + 'px';
    sel.style.width = alvo.offsetWidth + 'px';
  }
  if (!sel.classList.contains('visivel')) {
    sel.classList.add('sem-anim');
    aplicar();
    void sel.offsetWidth;
    sel.classList.remove('sem-anim');
    sel.classList.add('visivel');
  } else {
    aplicar();
  }
}
function abrirSub(modulo, sub) {
  abrirAba(modulo);
  NAVEGAR_SUB[modulo](sub);
}
function atualizarSubmenuAtivo() {
  document.querySelectorAll('.botao-sub').forEach(function (b) {
    var m = b.getAttribute('data-modulo');
    b.classList.toggle('ativo', abaAtivaId === m && SUB_ATUAL[m]() === b.getAttribute('data-sub'));
  });
  posicionarSelMenu();
}

function obterWidgetsAtivos() {
  var salvos = null;
  try { var raw = localStorage.getItem('dashboard_widgets_v1'); salvos = raw ? JSON.parse(raw) : null; } catch (e) { salvos = null; }
  if (salvos && salvos.length) return salvos;
  return WIDGETS_DASHBOARD.map(function (w) { return w.chave; });
}
function salvarWidgetsAtivos(chaves) {
  try { localStorage.setItem('dashboard_widgets_v1', JSON.stringify(chaves)); } catch (e) {}
}
function renderizarDashboard() {
  var ativos = obterWidgetsAtivos();
  var html = '<div class="dashboard-cab"><h2>Início</h2><button type="button" class="btn btn-contorno btn-sm" id="btnConfigDashboard">&#9881; Configurar painel</button></div>';
  if (!ativos.length) {
    html += '<div class="lista-vazia">Nenhum card selecionado. Clique em "Configurar painel" pra escolher o que aparece aqui.</div>';
  } else {
    html += '<div class="grade-dash" id="gradeDash">';
    for (var i = 0; i < ativos.length; i++) {
      var w = null;
      for (var j = 0; j < WIDGETS_DASHBOARD.length; j++) { if (WIDGETS_DASHBOARD[j].chave === ativos[i]) { w = WIDGETS_DASHBOARD[j]; break; } }
      if (!w) continue;
      html += '<div class="widget-dash" draggable="true" data-chave="' + w.chave + '">' +
        '<div class="widget-topo"><span class="widget-icone">' + w.icone + '</span><span class="widget-arrastar" title="Arraste para reordenar">&#10021;</span></div>' +
        '<div class="widget-valor">' + w.calcular() + '</div>' +
        '<div class="widget-titulo">' + escaparHTML(w.titulo) + '</div>' +
        '</div>';
    }
    html += '</div>';
  }
  html += '<p class="secao-titulo">Acesso rápido</p><div class="grade" id="grade"></div>';
  document.getElementById('dashboardInicio').innerHTML = html;
  montarGrade();
  document.getElementById('btnConfigDashboard').addEventListener('click', abrirModalDashboard);
  wireDashboardDrag();
}
function wireDashboardDrag() {
  var grade = document.getElementById('gradeDash');
  if (!grade) return;
  var arrastando = null;
  grade.querySelectorAll('.widget-dash').forEach(function (w) {
    w.addEventListener('dragstart', function () { arrastando = w; w.classList.add('arrastando'); });
    w.addEventListener('dragend', function () {
      w.classList.remove('arrastando');
      grade.querySelectorAll('.widget-dash').forEach(function (x) { x.classList.remove('drag-sobre'); });
    });
    w.addEventListener('dragover', function (e) { e.preventDefault(); if (w !== arrastando) w.classList.add('drag-sobre'); });
    w.addEventListener('dragleave', function () { w.classList.remove('drag-sobre'); });
    w.addEventListener('drop', function (e) {
      e.preventDefault();
      w.classList.remove('drag-sobre');
      if (!arrastando || arrastando === w) return;
      var chaves = obterWidgetsAtivos().slice();
      var chaveOrigem = arrastando.getAttribute('data-chave');
      var chaveDestino = w.getAttribute('data-chave');
      var origemIdx = chaves.indexOf(chaveOrigem);
      if (origemIdx === -1) return;
      chaves.splice(origemIdx, 1);
      var destinoIdx = chaves.indexOf(chaveDestino);
      if (destinoIdx === -1) destinoIdx = chaves.length;
      chaves.splice(destinoIdx, 0, chaveOrigem);
      salvarWidgetsAtivos(chaves);
      renderizarDashboard();
    });
  });
}
function abrirModalDashboard() {
  var ativos = obterWidgetsAtivos();
  var corpo = '<p class="dica">Escolha o que aparece no painel inicial. Depois é só arrastar os cards pra reordenar — fica salvo neste navegador.</p><div class="check-lista" style="flex-direction:column; align-items:flex-start; gap:8px;">';
  for (var i = 0; i < WIDGETS_DASHBOARD.length; i++) {
    var w = WIDGETS_DASHBOARD[i];
    corpo += '<label><input type="checkbox" class="chk-widget-ativo" value="' + w.chave + '"' + (ativos.indexOf(w.chave) !== -1 ? ' checked' : '') + '>' + w.icone + ' ' + escaparHTML(w.titulo) + '</label>';
  }
  corpo += '</div>';
  abrirModalBase('Configurar painel inicial', corpo, [
    { texto: 'Cancelar', classe: 'btn-contorno', aoClicar: function () { return true; } },
    { texto: 'Aplicar', classe: 'btn-primario', aoClicar: function () {
        var marcadas = [];
        document.querySelectorAll('#modalCorpo .chk-widget-ativo:checked').forEach(function (chk) { marcadas.push(chk.value); });
        salvarWidgetsAtivos(marcadas);
        renderizarDashboard();
        return true;
      } }
  ]);
}

function montarGrade() {
  var html = '';
  for (var i = 0; i < MODULOS.length; i++) {
    var m = MODULOS[i];
    if (!m.disponivel || !podeModulo(m.chave)) continue;
    html += '<div class="cartao" data-chave="' + m.chave + '">' +

/* ---------- leitura do CSV do Cosmos ---------- */
function logDecodificar(buf) {
  try { return new TextDecoder('windows-1252').decode(buf); }
  catch (e) {
    var u = new Uint8Array(buf), s = '';
    for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
    return s;
  }
}
function logDescascar(c) {
  c = c.replace(/\r/g, '');
  if (c.length > 1 && c.charAt(0) === '"' && c.charAt(c.length - 1) === '"') c = c.slice(1, -1).replace(/""/g, '"');
  return c;
}
function logDataISO(s) {
  var m = /^(\d{2})\/(\d{2})\/(\d{4})/.exec(s || '');
  if (m) return +m[3] < 2001 ? '' : m[3] + '-' + m[2] + '-' + m[1];
  m = /^(\d{4})[\/-](\d{2})[\/-](\d{2})/.exec(s || '');
  if (!m || +m[1] < 2001) return '';
  return m[1] + '-' + m[2] + '-' + m[3];
}
function logExtrairUF(texto) {
  var s = String(texto || '').replace(/\s+/g, ' ').trim();
  var m = /(?:^|[\s\-\/,(])([A-Z]{2})\)?$/.exec(s);
  return (m && LOG_UFS[m[1]]) ? m[1] : '';
}
function logProcessarCsv(texto) {
  var linhas = texto.split('\n');
  var cab = linhas[0].replace(/\r/g, '').split(';');
  var idx = {};
  for (var h = 0; h < cab.length; h++) idx[cab[h].trim()] = h;
  var n = cab.length;
  var depoisObs = idx.OPObs === undefined ? 0 : n - 1 - idx.OPObs;
  var registros = [];
  for (var i = 1; i < linhas.length; i++) {
    var ln = linhas[i];
    if (!ln || !ln.trim()) continue;
    var c = ln.split(';');
    for (var k = 0; k < c.length; k++) c[k] = logDescascar(c[k]);
    while (c.length < n) c.push('');
    /* a observação pode ter ';' dentro: as colunas depois dela contam a partir do fim da linha */
    var obs = c.slice(idx.OPObs, c.length - depoisObs).join(';');
    var get = function (nome) {
      var p = idx[nome];
      if (p === undefined) return '';
      return (p > idx.OPObs ? c[c.length - n + p] : c[p]) || '';
    };
    var opId = c[idx.MPPOPId] || '';
    var local = (get('PedidoEndTipo') || get('LocalEntrega')).trim();
    var rua = (get('PessoaLogradouro') + ' ' + get('PessoaNumero')).trim();
    var bairro = get('PessoaBairro').trim();
    var uf = get('EstadoUF').trim().toUpperCase();
    var r = {
      pedido: opId.slice(0, 5),
      op: opId,
      cliente: (c[idx.Cliente] || '').trim(),
      item: (c[idx.ItemNome] || '').trim(),
      qtd: parseFloat(String(c[idx.OPQtd] || '0').replace(',', '.')) || 0,
      un: (c[idx.UnidadeId] || '').trim(),
      tipo: (c[idx.Tipo] || '').trim() || '(sem tipo)',
      etapa: (c[idx.ProxEtapa] || '').trim() || '(sem etapa)',
      abertura: logDataISO(c[idx.OPDataAbertura]),
      embarque: logDataISO(c[idx.PedidoDataEmbarque]),
      entrega: logDataISO(get('DtEntrega') || get('PedidoDataEntrega')),
      faturamento: logDataISO(get('DtFaturamento')),
      obs: obs.trim(),
      local: local,
      endereco: rua + (rua && bairro ? ' - ' : '') + bairro,
      cidade: get('CidadeNome').trim(),
      uf: LOG_UFS[uf] ? uf : (idx.EstadoUF === undefined ? logExtrairUF(local) : ''),
      vendedor: get('agenteNegNome').trim() || '(sem vendedor)',
      nf: get('NFOrdExpNFNumero').trim(),
      serie: get('NFOrdExpNFSerieId').trim()
    };
    r.busca = (r.pedido + ' ' + r.op + ' ' + r.cliente + ' ' + r.item + ' ' + r.tipo + ' ' + r.etapa + ' ' + r.local + ' ' + r.endereco + ' ' + r.cidade + ' ' + r.vendedor + ' ' + r.nf + ' ' + r.obs).toLowerCase();
    registros.push(r);
  }
  return registros;
}

function logHojeISO() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function logSomarDias(iso, n) {
  var p = iso.split('-');
  var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function logSegunda(iso) {
  var p = iso.split('-');

  return logSomarDias(iso, -((d.getUTCDay() + 6) % 7));
}
function logFimDoMes(chaveMes) {

}

function logNum(n) { return Number(n || 0).toLocaleString('pt-BR'); }

/* ---------- filtros ---------- */
function logFiltrosPadrao(campo) {

function logPassa(r, f, ign) {

    var d = r[f.campoData];
    if (!d) return false;
    if (f.de && d < f.de) return false;

  if (ign !== 'uf' && f.uf) {

  }
  if (ign !== 'cidade' && f.cidade && r.cidade !== f.cidade) return false;
  if (ign !== 'local' && f.local && r.local !== f.local) return false;
  if (ign !== 'cliente' && f.cliente && r.cliente !== f.cliente) return false;
  if (ign !== 'vendedor' && f.vendedor && r.vendedor !== f.vendedor) return false;
  if (ign !== 'tipo' && f.tipo && r.tipo !== f.tipo) return false;
  if (ign !== 'etapa' && f.etapa && r.etapa !== f.etapa) return false;
  for (var ck in f.cols) {

      '<td>' + (r.faturamento ? logFmtData(r.faturamento) : '<span class="muted">—</span>') + '</td>' +
      '</tr>';
  });
  html += '</tbody></table></div><div class="log-paginacao">' +
    '<span class="muted">' + logNum(ini + 1) + '–' + logNum(Math.min(ini + LOG_POR_PAGINA, total)) + ' de ' + logNum(total) + '</span>' +
    '<button type="button" class="btn btn-contorno btn-sm" data-pagina="prev"' + (logPagina === 0 ? ' disabled' : '') + '>&#8249; Anterior</button>' +
    '<span class="muted">Página ' + (logPagina + 1) + ' de ' + paginas + '</span>' +
    '<button type="button" class="btn btn-contorno btn-sm" data-pagina="next"' + (logPagina >= paginas - 1 ? ' disabled' : '') + '>Próxima &#8250;</button></div>';
  return html;
}
function logAplicarRapido(tipo) {
  var f = logFiltros;
  if (tipo === 'limpar') { f.de = ''; f.ate = ''; return; }
  if (tipo === 'hoje') { f.de = logHoje; f.ate = logHoje; }
  else if (tipo === 'semana') { f.de = logSegunda(logHoje); f.ate = logSomarDias(f.de, 6); }
  else if (tipo === '7d') { f.de = logHoje; f.ate = logSomarDias(logHoje, 7); }
  else if (tipo === '30d') { f.de = logHoje; f.ate = logSomarDias(logHoje, 30); }
  else if (tipo === 'mes') { f.de = logHoje.slice(0, 7) + '-01'; f.ate = logFimDoMes(logHoje.slice(0, 7)); }
}
function logClique(e) {
  var t = e.target;
  if (!t.closest) return;
  var alvo = t.closest('[data-dim],[data-kpi],[data-chip],[data-colfiltro],[data-pagina],[data-gran],[data-de],[data-rapido]');
  if (!alvo || !logDados) return;
  logHoje = logHojeISO();
  var f = logFiltros;
  if (alvo.hasAttribute('data-dim')) {
    var dim = alvo.getAttribute('data-dim'), val = alvo.getAttribute('data-val');
    f[dim] = f[dim] === val ? '' : val;
    if (dim === 'uf') f.cidade = '';
    logPagina = 0;
  } else if (alvo.hasAttribute('data-kpi')) {
    var kpi = alvo.getAttribute('data-kpi');
    if (kpi === 'vencidas') f.vencidas = !f.vencidas;
    else if (kpi === 'semLocal') f.semLocal = !f.semLocal;
    else if (kpi === 'semEmbarque') f.semEmbarque = !f.semEmbarque;
    else if (kpi === 'comNf') f.comNf = !f.comNf;
    else if (kpi === 'prox7') {
      var lim = logSomarDias(logHoje, 7);
      if (f.campoData === 'embarque' && f.de === logHoje && f.ate === lim) { f.de = ''; f.ate = ''; }
      else { f.campoData = 'embarque'; f.de = logHoje; f.ate = lim; }
    }
    logPagina = 0;
  } else if (alvo.hasAttribute('data-chip')) {
    var chip = alvo.getAttribute('data-chip');
    if (chip === 'todos') logFiltros = logFiltrosPadrao(f.campoData);
    else if (chip === 'data') { f.de = ''; f.ate = ''; }
    else if (chip === 'vencidas' || chip === 'semLocal' || chip === 'semEmbarque' || chip === 'comNf') f[chip] = false;
    else if (chip.indexOf('col:') === 0) delete f.cols[chip.slice(4)];
    else f[chip] = '';
    if (chip === 'busca') { var b = document.getElementById('logBusca'); if (b) b.value = ''; }
    logPagina = 0;
  } else if (alvo.hasAttribute('data-colfiltro')) {
    logAbrirMenuColuna(alvo);
    return;
  } else if (alvo.hasAttribute('data-pagina')) {
    logPagina += alvo.getAttribute('data-pagina') === 'next' ? 1 : -1;
    if (logPagina < 0) logPagina = 0;
  } else if (alvo.hasAttribute('data-gran')) {
    logGran = alvo.getAttribute('data-gran');
  } else if (alvo.hasAttribute('data-rapido')) {
    logAplicarRapido(alvo.getAttribute('data-rapido'));
    logPagina = 0;
  } else if (alvo.hasAttribute('data-de')) {
    var de = alvo.getAttribute('data-de'), ate = alvo.getAttribute('data-ate');
    if (f.de === de && f.ate === ate) { f.de = ''; f.ate = ''; } else { f.de = de; f.ate = ate; }
    logPagina = 0;
  }
  logAtualizar(true);
}
function logCsvCel(v) {
  var s = String(v === null || v === undefined ? '' : v);
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function logExportarCsv() {
  if (!logDados) return;
  logHoje = logHojeISO();
  var rows = logOrdenar(logFiltrar(''));
  var linhas = [LOG_COLUNAS.map(function (c) { return c.r; }).join(';')];
  rows.forEach(function (r) {
    linhas.push([r.pedido, r.op, r.cliente, r.item, String(r.qtd).replace('.', ','), r.tipo, r.etapa, logFmtData(r.embarque).replace('—', ''), logFmtData(r.entrega).replace('—', ''), r.local, r.endereco, r.cidade, r.uf, r.vendedor, r.nf, logFmtData(r.faturamento).replace('—', '')].map(logCsvCel).join(';'));
  });
  var blob = new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'analise-logistica-' + logHoje + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 500);
}

function abrirAba(chave) {
  var existente = null;
  for (var i = 0; i < abas.length; i++) { if (abas[i].id === chave) { existente = abas[i]; break; } }
  if (existente) { ativarAba(chave); return; }

  var modulo = null;
  for (var j = 0; j < MODULOS.length; j++) { if (MODULOS[j].chave === chave) { modulo = MODULOS[j]; break; } }
  if (!modulo || !podeModulo(chave)) return;

  abas.push({ id: chave, titulo: modulo.nome, icone: modulo.icone, fechavel: true });

  var painel = document.createElement('div');
  painel.className = 'painel-aba';
  painel.setAttribute('data-aba-id', chave);

  if (chave === 'cadastros') {
    painel.innerHTML = MARCACAO_CADASTROS;
    document.getElementById('areaAbas').appendChild(painel);
    mudarAba(primeiraSub('cadastros'));
  } else if (chave === 'comercial') {
    painel.innerHTML = MARCACAO_COMERCIAL;
    document.getElementById('areaAbas').appendChild(painel);
    mudarAbaComercial(primeiraSub('comercial'));
  } else if (chave === 'pcp') {
    painel.innerHTML = MARCACAO_PCP;
    document.getElementById('areaAbas').appendChild(painel);
    mudarAbaPcp(primeiraSub('pcp'));
  } else if (chave === 'logistica') {
    painel.className = 'painel-aba painel-largo';
    painel.innerHTML = MARCACAO_LOGISTICA;
    document.getElementById('areaAbas').appendChild(painel);
    mudarAbaLogistica(primeiraSub('logistica'));
  } else if (chave === 'contas') {
    painel.className = 'painel-aba painel-largo';
    painel.innerHTML = '<div class="painel"><div id="contasErp"></div></div>';
    document.getElementById('areaAbas').appendChild(painel);
    renderizarContas();
  } else {
    painel.innerHTML = '<div class="placeholder-modulo"><span class="ic">' + modulo.icone + '</span><h3>' + escaparHTML(modulo.nome) + '</h3><p>Este módulo ainda está em construção.</p></div>';
    document.getElementById('areaAbas').appendChild(painel);
  }

  renderizarTabstrip();
  ativarAba(chave);
}

function ativarAba(chave) {
  abaAtivaId = chave;
  document.querySelectorAll('.painel-aba').forEach(function (p) { p.classList.toggle('ativa', p.getAttribute('data-aba-id') === chave); });
  document.querySelectorAll('.botao-menu[data-chave]').forEach(function (b) { b.classList.toggle('ativo', b.getAttribute('data-chave') === chave); });
  if (SUBMENUS[chave]) alternarGrupoMenu(chave, true);
  atualizarSubmenuAtivo();
  renderizarTabstrip();
  atualizarSubcabecalho();
}

function fecharAba(chave, ev) {
  if (ev) ev.stopPropagation();
  var idx = -1;
  for (var i = 0; i < abas.length; i++) { if (abas[i].id === chave) { idx = i; break; } }
  if (idx === -1) return;
  abas.splice(idx, 1);
  var painel = document.querySelector('.painel-aba[data-aba-id="' + chave + '"]');
  if (painel && painel.parentNode) painel.parentNode.removeChild(painel);
  if (abaAtivaId === chave) {
    var proximaId = abas.length ? abas[Math.max(0, idx - 1)].id : 'inicio';
    ativarAba(proximaId);
  } else {
    renderizarTabstrip();
  }
}

function renderizarTabstrip() {
  var el = document.getElementById('tabstrip');
  var html = '';
  for (var i = 0; i < abas.length; i++) {
    var a = abas[i];
    html += '<div class="tab-chip' + (a.id === abaAtivaId ? ' ativa' : '') + '" data-chave="' + a.id + '">' +
      '<span>' + a.icone + ' ' + escaparHTML(a.titulo) + '</span>' +
      (a.fechavel ? '<span class="tab-fechar" data-fechar="' + a.id + '">&#10005;</span>' : '') +
      '</div>';
  }
  el.innerHTML = html;
  el.querySelectorAll('.tab-chip').forEach(function (chip) {
    chip.addEventListener('click', function (e) {
      var fecharAlvo = e.target.getAttribute('data-fechar');
      if (fecharAlvo) { fecharAba(fecharAlvo, e); return; }
      ativarAba(chip.getAttribute('data-chave'));
    });
  });
}

function atualizarSubcabecalho() {
  var a = null;
  for (var i = 0; i < abas.length; i++) { if (abas[i].id === abaAtivaId) { a = abas[i]; break; } }
  if (!a) return;
  document.getElementById('tituloPagina').innerHTML = a.icone + ' ' + escaparHTML(a.titulo);
}

function wireTabelaAtributos(f) {

    tr.querySelector('.in-obrigatorio').addEventListener('change', function (e) { f.atributos[idx].obrigatorio = e.target.checked; });

      '<div class="campo"><label>Unidade</label><input type="text" id="campoCompUnidade" value="' + (c ? escaparHTML(c.unidade) : '') + '" placeholder="kg, m², un..." list="listaUnidades"></div>' +
      '<div class="campo"><label>Custo unitário (R$)</label><input type="number" id="campoCompCusto" step="0.01" value="' + (c ? c.custo : '') + '"></div>' +
    '</div>' +
    '<div class="campo"><label>Fator (opcional — ex.: kg por m² de uma chapa)</label><input type="number" id="campoCompFator" step="0.001" value="' + (c && c.fator !== null && c.fator !== undefined ? c.fator : '') + '" placeholder="ex: 9.48"></div>' +
    '<div class="campo"><label>Código (opcional — usado no sufixo de configuração da OP)</label><input type="text" id="campoCompCodigo" value="' + (c ? escaparHTML(c.codigo || '') : '') + '" placeholder="ex: CUBA60X50X30"></div>' +
    '<div class="campo-linha">' +
      '<div class="campo"><label>Ocupa comprimento (mm, opcional)</label><input type="number" id="campoCompOcupaComp" step="1" value="' + (c && c.ocupaComprimento !== null && c.ocupaComprimento !== undefined ? c.ocupaComprimento : '') + '" placeholder="ex: 700"></div>' +
      '<div class="campo"><label>Ocupa largura (mm, opcional)</label><input type="number" id="campoCompOcupaLarg" step="1" value="' + (c && c.ocupaLargura !== null && c.ocupaLargura !== undefined ? c.ocupaLargura : '') + '" placeholder="ex: 500"></div>' +
    '</div>' +
    '<p class="dica" style="margin-top:-.4rem;">Ocupa comprimento/largura são usados pra checar se o componente cabe fisicamente dentro do item, quando ele é uma alternativa de um Grupo de Opção.</p>' +
    '<datalist id="listaUnidades"><option value="kg"><option value="m²"><option value="m"><option value="un"><option value="h"></datalist>';
  var botoes = [];
  if (c) botoes.push({ texto: 'Excluir', classe: 'btn-perigo', aoClicar: function () { return excluirComponente(c.id); } });
  botoes.push({ texto: 'Cancelar', classe: 'btn-contorno', aoClicar: function () { return true; } });
  botoes.push({ texto: 'Salvar', classe: 'btn-primario', aoClicar: function () {
      var nome = document.getElementById('campoCompNome').value.trim();
      if (!nome) { mostrarAvisoModal('Digite um nome.'); return false; }
      var unidade = document.getElementById('campoCompUnidade').value.trim() || 'un';
      var custo = parseFloat(document.getElementById('campoCompCusto').value) || 0;
      var fatorTxt = document.getElementById('campoCompFator').value;
      var fatorVal = fatorTxt === '' ? null : parseFloat(fatorTxt);
      var categoria = document.getElementById('campoCompCategoria').value;
      var codigo = normalizarCodigo(document.getElementById('campoCompCodigo').value);
      var ocupaCompTxt = document.getElementById('campoCompOcupaComp').value;
      var ocupaLargTxt = document.getElementById('campoCompOcupaLarg').value;
      var ocupaComprimento = ocupaCompTxt === '' ? null : parseFloat(ocupaCompTxt);
      var ocupaLargura = ocupaLargTxt === '' ? null : parseFloat(ocupaLargTxt);
      if (c) {
        c.nome = nome; c.unidade = unidade; c.custo = custo; c.fator = fatorVal; c.categoria = categoria;
        c.codigo = codigo; c.ocupaComprimento = ocupaComprimento; c.ocupaLargura = ocupaLargura;
      } else {
        estado.componentes.push({ id: gerarId(), nome: nome, unidade: unidade, custo: custo, fator: fatorVal, categoria: categoria, codigo: codigo, ocupaComprimento: ocupaComprimento, ocupaLargura: ocupaLargura });
      }
      renderizarComponentesLista();
      salvar();
      return true;
    } });
  abrirModalBase(c ? 'Editar componente' : 'Novo componente', corpo, botoes);
}

function excluirComponente(id) {
  var usados = [];
  for (var i = 0; i < estado.itens.length; i++) {
    for (var j = 0; j < estado.itens[i].bom.length; j++) {
      if (estado.itens[i].bom[j].componenteId === id) { usados.push(estado.itens[i].nome); break; }
    }
  }
  if (usados.length) {
    abrirModalBase('Não é possível excluir', '<p class="modal-mensagem">Este componente está no BOM de: <strong>' + escaparHTML(usados.join(', ')) + '</strong>. Remova essas linhas de BOM antes de excluir o componente.</p>', [
      { texto: 'Entendi', classe: 'btn-primario', aoClicar: function () { return true; } }
    ]);
    return false;
  }
  estado.componentes = estado.componentes.filter(function (x) { return x.id !== id; });
  renderizarComponentesLista();
  salvar();
  return true;
}

/* ===== ITENS ===== */
function renderizarItensLista() {
  var html = '<div class="lista-cab">' + botaoColunasHTML('itens') + '<button type="button" class="btn btn-primario" id="btnNovoItem">+ Novo item</button></div>';
  if (!estado.itens.length) {
    html += '<div class="lista-vazia">Nenhum item cadastrado ainda.</div>';
  } else {
    html += renderizarTabelaGenerica('itens', colunasItens(), estado.itens);
  }
  document.getElementById('itensLista').innerHTML = html;
  document.getElementById('btnNovoItem').addEventListener('click', abrirModalNovoItem);
  document.querySelectorAll('#itensLista tr[data-id]').forEach(function (tr) {
    tr.addEventListener('click', function () { abrirDetalheItem(tr.getAttribute('data-id')); });
  });
  wireBotaoColunas('itens', colunasItens(), renderizarItensLista);
}

function abrirModalNovoItem() {
  if (!estado.familias.length) {
    abrirModalBase('Cadastre uma família primeiro', '<p class="modal-mensagem">Todo item pertence a uma família — é ela que define os atributos/medidas disponíveis para as fórmulas de BOM. Crie uma família antes de criar o item.</p>', [
      { texto: 'Entendi', classe: 'btn-primario', aoClicar: function () { return true; } }
    ]);
    return;
  }
  var opcoesFamilia = '';
  for (var i = 0; i < estado.familias.length; i++) opcoesFamilia += '<option value="' + estado.familias[i].id + '">' + escaparHTML(estado.familias[i].nome) + '</option>';
  var corpo = '' +
    '<div class="campo"><label>Nome do item</label><input type="text" id="campoItemNome" placeholder="ex: Mesa de Parede"></div>' +
    '<div class="campo"><label>Família</label><select id="campoItemFamilia">' + opcoesFamilia + '</select></div>';
  abrirModalBase('Novo item', corpo, [
    { texto: 'Cancelar', classe: 'btn-contorno', aoClicar: function () { return true; } },
    { texto: 'Criar', classe: 'btn-primario', aoClicar: function () {
        var nome = document.getElementById('campoItemNome').value.trim();
        if (!nome) { mostrarAvisoModal('Digite um nome.'); return false; }
        var familiaId = document.getElementById('campoItemFamilia').value;
        var novo = { id: gerarId(), nome: nome, familiaId: familiaId, bom: [] };
        estado.itens.push(novo);
        renderizarItensLista();
        salvar();
        abrirDetalheItem(novo.id);
        return true;
      } }
  ]);
}

function acharFamiliaDoItem(it) {
  if (!it) return null;
  for (var i = 0; i < estado.familias.length; i++) { if (estado.familias[i].id === it.familiaId) return estado.familias[i]; }
  return null;
}

function abrirDetalheItem(id) {
  itemAbertoId = id;
  valoresSimulacao = {};
  opcionaisExcluidos = {};
  var it = null;
  for (var i = 0; i < estado.itens.length; i++) { if (estado.itens[i].id === id) { it = estado.itens[i]; break; } }
  var fam = acharFamiliaDoItem(it);
  if (fam) { for (var j = 0; j < fam.atributos.length; j++) { if (fam.atributos[j].tipo === 'numero') valoresSimulacao[fam.atributos[j].chave] = 1000; } }
  document.getElementById('itensLista').style.display = 'none';
  document.getElementById('itensDetalhe').style.display = 'block';
  renderizarDetalheItem();
}
function voltarListaItens() {
  document.getElementById('itensDetalhe').style.display = 'none';
  document.getElementById('itensLista').style.display = 'block';
  renderizarItensLista();
}

function renderizarDetalheItem() {
  var it = null;
  for (var i = 0; i < estado.itens.length; i++) { if (estado.itens[i].id === itemAbertoId) { it = estado.itens[i]; break; } }
  if (!it) { voltarListaItens(); return; }
  if (!it.grupos) it.grupos = [];
  var fam = acharFamiliaDoItem(it);

  var opcoesFamilia = '';
  for (var k = 0; k < estado.familias.length; k++) {
    var f2 = estado.familias[k];
    opcoesFamilia += '<option value="' + f2.id + '"' + (f2.id === it.familiaId ? ' selected' : '') + '>' + escaparHTML(f2.nome) + '</option>';
  }

  var html = '' +
    '<div class="detalhe-topo">' +
      '<button type="button" class="btn btn-contorno" id="btnVoltarItem">&#8249; Itens</button>' +
      '<div class="detalhe-acoes">' +
        '<button type="button" class="btn btn-perigo" id="btnExcluirItem">Excluir</button>' +
        '<button type="button" class="btn btn-primario" id="btnSalvarItem">&#128190; Salvar alterações</button>' +
      '</div>' +
    '</div>' +
    '<div class="campo-linha">' +
      '<div class="campo"><label>Nome do item</label><input type="text" id="campoItNome" value="' + escaparHTML(it.nome) + '"></div>' +
      '<div class="campo"><label>Família</label><select id="campoItFamilia">' + opcoesFamilia + '</select></div>' +
    '</div>' +
    '<div class="campo"><label>Código base (usado no sufixo de configuração da OP)</label><input type="text" id="campoItCodigoBase" value="' + escaparHTML(it.codigoBase || '') + '" placeholder="ex: MESA"></div>';

  var chavesNumericas = [];
  if (fam) { for (var m = 0; m < fam.atributos.length; m++) { if (fam.atributos[m].tipo === 'numero') chavesNumericas.push(fam.atributos[m].chave || '(sem chave)'); } }

  if (!fam || !chavesNumericas.length) {
    html += '<div class="aviso-inline">Esta família ainda não tem atributos numéricos definidos — vá em "Famílias" e adicione (ex.: comprimento, largura) antes de montar fórmulas de BOM.</div>';
  } else {
    html += '<div class="dica">Variáveis disponíveis nas fórmulas: <code>' + chavesNumericas.join('</code>, <code>') + '</code> e <code>fator</code> (o fator cadastrado no componente escolhido na linha).' +
      '<br>Condicional estilo Excel: <code>SE(condição; se_verdadeiro; se_falso)</code> — ex.: <code>SE(comprimento &gt; 2500; 6; SE(comprimento &gt; 2000; 5; 4))</code>.' +
      '<br>Comparadores: <code>&gt;</code> <code>&lt;</code> <code>&gt;=</code> <code>&lt;=</code> <code>=</code> <code>&lt;&gt;</code> &nbsp;·&nbsp; combine condições com <code>E(...)</code> e <code>OU(...)</code>.</div>';
  }

  html += '' +
    '<div class="bloco-bom">' +
      '<div class="bloco-cab"><h4>Estrutura (BOM)</h4><button type="button" class="btn btn-contorno btn-sm" id="btnAddBom">+ Linha de BOM</button></div>' +
      renderizarTabelaBOM(it) +
    '</div>' +
    '<div class="bloco-atributos">' + renderizarGruposItem(it) + '</div>' +
    '<div class="bloco-atributos">' +
      '<div class="bloco-cab"><h4>Parâmetros de MRP / PMP</h4></div>' +
      '<p class="dica">Base para o cálculo de necessidade de materiais e o plano mestre de produção — ainda não geram sugestão automática, mas já ficam registrados aqui.</p>' +
      '<div class="campo-linha">' +
        '<div class="campo"><label>Lead time (dias)</label><input type="number" id="campoItLeadTime" value="' + (it.leadTimeDias || 0) + '"></div>' +
        '<div class="campo"><label>Lote mínimo</label><input type="number" id="campoItLoteMinimo" value="' + (it.loteMinimo || 1) + '"></div>' +
      '</div>' +
      '<div class="campo-linha">' +
        '<div class="campo"><label>Estoque mínimo (segurança)</label><input type="number" id="campoItEstoqueMinimo" value="' + (it.estoqueMinimo || 0) + '"></div>' +
        '<div class="campo"><label>Estoque atual</label><input type="number" id="campoItEstoqueAtual" value="' + (it.estoqueAtual || 0) + '"></div>' +
      '</div>' +
      '<div class="campo"><label>Política de reposição</label><select id="campoItPolitica">' +
        '<option value="lote_a_lote"' + ((it.politicaReposicao || 'lote_a_lote') === 'lote_a_lote' ? ' selected' : '') + '>Lote a lote</option>' +
        '<option value="periodo_fixo"' + (it.politicaReposicao === 'periodo_fixo' ? ' selected' : '') + '>Período fixo</option>' +
        '<option value="min_max"' + (it.politicaReposicao === 'min_max' ? ' selected' : '') + '>Mínimo/Máximo</option>' +
      '</select></div>' +
    '</div>' +
    '<div class="bloco-simulador">' +
      '<h4>Simulador</h4>' +
      '<p class="dica">Digite uma medida de teste e veja o consumo e o custo calculados pelas fórmulas acima, em tempo real.</p>' +
      '<div class="simulador-valores" id="simuladorValores"></div>' +
      '<div id="simuladorResultado"></div>' +
    '</div>';

  document.getElementById('itensDetalhe').innerHTML = html;

  document.getElementById('btnVoltarItem').addEventListener('click', voltarListaItens);
  document.getElementById('btnSalvarItem').addEventListener('click', function () { salvar(); });
  document.getElementById('btnExcluirItem').addEventListener('click', function () { excluirItem(it.id); });
  document.getElementById('campoItNome').addEventListener('input', function (e) { it.nome = e.target.value; });
  document.getElementById('campoItCodigoBase').addEventListener('input', function (e) { it.codigoBase = e.target.value; });
  document.getElementById('campoItFamilia').addEventListener('change', function (e) {
    it.familiaId = e.target.value;
    valoresSimulacao = {};
    var novaFam = acharFamiliaDoItem(it);
    if (novaFam) { for (var n = 0; n < novaFam.atributos.length; n++) { if (novaFam.atributos[n].tipo === 'numero') valoresSimulacao[novaFam.atributos[n].chave] = 1000; } }
    renderizarDetalheItem();
  });
  document.getElementById('btnAddBom').addEventListener('click', function () {
    it.bom.push({ id: gerarId(), componenteId: estado.componentes.length ? estado.componentes[0].id : '', formula: '', obrigatorio: true });
    renderizarDetalheItem();
  });
  document.getElementById('campoItLeadTime').addEventListener('input', function (e) { it.leadTimeDias = parseFloat(e.target.value) || 0; });
  document.getElementById('campoItLoteMinimo').addEventListener('input', function (e) { it.loteMinimo = parseFloat(e.target.value) || 0; });
  document.getElementById('campoItEstoqueMinimo').addEventListener('input', function (e) { it.estoqueMinimo = parseFloat(e.target.value) || 0; });
  document.getElementById('campoItEstoqueAtual').addEventListener('input', function (e) { it.estoqueAtual = parseFloat(e.target.value) || 0; });
  document.getElementById('campoItPolitica').addEventListener('change', function (e) { it.politicaReposicao = e.target.value; });
  wireTabelaBOM(it);
  wireGruposItem(it);
  renderizarSimuladorValores(fam);
  atualizarSimulacao();
}

function renderizarTabelaBOM(it) {
  if (!estado.componentes.length) return '<div class="aviso-inline">Cadastre componentes primeiro (aba Componentes) para poder montar o BOM.</div>';
  if (!it.bom.length) return '<div class="lista-vazia-mini">Nenhuma linha de BOM ainda.</div>';
  var html = '<div class="tabela-wrap"><table class="tabela-editavel"><thead><tr><th>Componente</th><th>Fórmula</th><th>Obrigatório</th><th></th></tr></thead><tbody>';
  for (var i = 0; i < it.bom.length; i++) {
    var linha = it.bom[i];
    var compAtualBom = acharComponentePorId(linha.componenteId);
    html += '<tr data-idx="' + i + '">' +
      '<td>' + campoBuscaHTML('bomComp' + i, linha.componenteId, compAtualBom ? compAtualBom.nome : '', 'Buscar componente...') + '</td>' +
      '<td><input type="text" class="in-bom-formula" value="' + escaparHTML(linha.formula) + '" placeholder="(comprimento/1000)*(largura/1000)*fator"></td>' +
      '<td class="col-check"><input type="checkbox" class="in-bom-obrig"' + (linha.obrigatorio ? ' checked' : '') + '></td>' +
      '<td><button type="button" class="icone-btn excluir btn-remover-bom" title="Remover">&#128465;</button></td>' +
      '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}
function wireTabelaBOM(it) {
  document.querySelectorAll('#itensDetalhe tr[data-idx]').forEach(function (tr) {
    var idx = parseInt(tr.getAttribute('data-idx'), 10);
    wireCampoBusca('bomComp' + idx, opcoesBuscaComponentes, function (novoId) { it.bom[idx].componenteId = novoId; atualizarSimulacao(); });
    tr.querySelector('.in-bom-formula').addEventListener('input', function (e) { it.bom[idx].formula = e.target.value; atualizarSimulacao(); });
    tr.querySelector('.in-bom-obrig').addEventListener('change', function (e) { it.bom[idx].obrigatorio = e.target.checked; atualizarSimulacao(); });
    tr.querySelector('.btn-remover-bom').addEventListener('click', function () { it.bom.splice(idx, 1); renderizarDetalheItem(); });
  });
}

function renderizarSimuladorValores(fam) {
  var el = document.getElementById('simuladorValores');
  var numericos = fam ? fam.atributos.filter(function (a) { return a.tipo === 'numero'; }) : [];
  if (!numericos.length) { el.innerHTML = '<div class="aviso-inline">Sem atributos numéricos nesta família ainda.</div>'; return; }
  var html = '';
  for (var i = 0; i < numericos.length; i++) {
    var a = numericos[i];
    var v = valoresSimulacao[a.chave] !== undefined ? valoresSimulacao[a.chave] : 0;
    html += '<div class="campo campo-sim"><label>' + escaparHTML(a.rotulo || a.chave) + (a.unidade ? ' (' + escaparHTML(a.unidade) + ')' : '') + '</label>' +
      '<input type="number" class="in-sim-valor" data-chave="' + escaparHTML(a.chave) + '" value="' + v + '"></div>';
  }
  el.innerHTML = html;
  el.querySelectorAll('.in-sim-valor').forEach(function (inp) {
    inp.addEventListener('input', function (e) {
      valoresSimulacao[e.target.getAttribute('data-chave')] = parseFloat(e.target.value) || 0;
      atualizarSimulacao();
    });
  });
}

function atualizarSimulacao() {
  var it = null;
  for (var i = 0; i < estado.itens.length; i++) { if (estado.itens[i].id === itemAbertoId) { it = estado.itens[i]; break; } }
  var el = document.getElementById('simuladorResultado');
  if (!it || !el) return;
  if (!it.bom.length) { el.innerHTML = '<div class="lista-vazia-mini">Adicione linhas de BOM para ver o cálculo.</div>'; return; }

  var html = '<div class="tabela-wrap"><table class="tabela-resultado"><thead><tr><th></th><th>Componente</th><th>Fórmula</th><th>Qtd. calculada</th><th class="num">Custo unit.</th><th class="num">Custo total</th></tr></thead><tbody>';
  var totalGeral = 0;
  for (var j = 0; j < it.bom.length; j++) {
    var linha = it.bom[j];
    var comp = null;
    for (var k = 0; k < estado.componentes.length; k++) { if (estado.componentes[k].id === linha.componenteId) { comp = estado.componentes[k]; break; } }
    var incluida = linha.obrigatorio || !opcionaisExcluidos[linha.id];
    var check = linha.obrigatorio
      ? '<span class="tag-obrig">obrig.</span>'
      : '<input type="checkbox" class="in-opcional-sim" data-id="' + linha.id + '"' + (incluida ? ' checked' : '') + '>';

    if (!comp) {
      html += '<tr><td>' + check + '</td><td colspan="4" class="erro-formula">componente não selecionado</td><td></td></tr>';
      continue;
    }
    var escopo = {};
    for (var chave in valoresSimulacao) escopo[chave] = valoresSimulacao[chave];
    escopo.fator = (comp.fator !== null && comp.fator !== undefined) ? comp.fator : 1;

    var r = avaliarFormula(linha.formula, escopo);
    var qtdTxt, custoLinha;
    if (!r.ok) {
      qtdTxt = '<span class="erro-formula">' + escaparHTML(r.erro) + '</span>';
      custoLinha = 0;
    } else {
      qtdTxt = r.valor.toLocaleString('pt-BR', { maximumFractionDigits: 3 }) + ' ' + escaparHTML(comp.unidade);
      custoLinha = incluida ? r.valor * comp.custo : 0;
    }
    if (incluida) totalGeral += custoLinha;

    html += '<tr class="' + (incluida ? '' : 'linha-excluida') + '">' +
      '<td>' + check + '</td>' +
      '<td>' + escaparHTML(comp.nome) + '</td>' +
      '<td><code>' + escaparHTML(linha.formula || '(vazia)') + '</code></td>' +
      '<td>' + qtdTxt + '</td>' +
      '<td class="num">R$ ' + formatarMoeda(comp.custo) + '</td>' +
      '<td class="num">' + (r.ok ? 'R$ ' + formatarMoeda(custoLinha) : '—') + '</td>' +
      '</tr>';
  }
  html += '</tbody></table></div>' +
    '<div class="total-simulador">Custo total estimado&nbsp; <strong>R$ ' + formatarMoeda(totalGeral) + '</strong></div>';
  el.innerHTML = html;

  el.querySelectorAll('.in-opcional-sim').forEach(function (chk) {
    chk.addEventListener('change', function (e) {
      opcionaisExcluidos[e.target.getAttribute('data-id')] = !e.target.checked;
      atualizarSimulacao();
    });
  });
}

function excluirItem(id) {
  var it = null;
  for (var i = 0; i < estado.itens.length; i++) { if (estado.itens[i].id === id) { it = estado.itens[i]; break; } }
  abrirModalBase('Excluir item', '<p class="modal-mensagem">Excluir "' + escaparHTML(it ? it.nome : '') + '"? Essa ação não pode ser desfeita.</p>', [
    { texto: 'Cancelar', classe: 'btn-contorno', aoClicar: function () { return true; } },
    { texto: 'Excluir', classe: 'btn-perigo', aoClicar: function () {
        estado.itens = estado.itens.filter(function (x) { return x.id !== id; });
        voltarListaItens();
        salvar();
        return true;
      } }
  ]);
}

function normalizarCodigo(s) {
  var t = String(s || '').toUpperCase();
  if (t.normalize) t = t.normalize('NFD');
  t = t.replace(/[^A-Z0-9]/g, '');
  return t;
}
function opcoesParaTexto(opcoes) {
  return (opcoes || []).map(function (o) { return (o.rotulo || '') + ':' + (o.codigo || ''); }).join(', ');
}
function textoParaOpcoes(txt) {
  var partes = String(txt || '').split(',');
  var out = [];
  for (var i = 0; i < partes.length; i++) {
    var p = partes[i].trim();
    if (!p) continue;
    var idx = p.indexOf(':');
    var rotulo, codigo;
    if (idx === -1) { rotulo = p; codigo = normalizarCodigo(p); }
    else { rotulo = p.slice(0, idx).trim(); codigo = normalizarCodigo(p.slice(idx + 1)); }
    if (!codigo) codigo = normalizarCodigo(rotulo);
    if (!rotulo) rotulo = codigo;
    out.push({ rotulo: rotulo, codigo: codigo });
  }
  return out;
}
function acharComponentePorId(id) {

function criarOPSimples(it, qtd) {

function criarOPComModelo(it, qtd, codigoModelo) {
  var modelo = null;
  for (var i = 0; i < (it.modelosSalvos || []).length; i++) { if (it.modelosSalvos[i].codigo === codigoModelo) { modelo = it.modelosSalvos[i]; break; } }
  var novaOp = construirOPBase(it, qtd);
  if (modelo) {
    novaOp.valoresAtributos = JSON.parse(JSON.stringify(modelo.valoresAtributos));
    novaOp.respostasLista = JSON.parse(JSON.stringify(modelo.respostasLista));
    novaOp.unidadesGrupo = JSON.parse(JSON.stringify(modelo.unidadesGrupo));
    novaOp.codigoConfiguracao = modelo.codigo;
  }
  estado.ordensProducao.push(novaOp);
  salvar();
  abrirDetalheOP(novaOp.id);
}
function registrarModeloSalvo(it, codigo, valoresAtributos, respostasLista, unidadesGrupo) {
  if (!it.modelosSalvos) it.modelosSalvos = [];
  for (var i = 0; i < it.modelosSalvos.length; i++) {
    if (it.modelosSalvos[i].codigo === codigo) { it.modelosSalvos[i].usadoEm = new Date().toISOString().slice(0, 10); return; }
  }
  it.modelosSalvos.push({
    codigo: codigo,
    valoresAtributos: JSON.parse(JSON.stringify(valoresAtributos)),
    respostasLista: JSON.parse(JSON.stringify(respostasLista)),
    unidadesGrupo: JSON.parse(JSON.stringify(unidadesGrupo)),
    usadoEm: new Date().toISOString().slice(0, 10)
  });
}

/* ===== CÓDIGO DE CONFIGURAÇÃO ===== */
function gerarCodigoConfiguracao(it, fam, valoresAtributos, respostasLista, unidadesGrupo) {
  var base = it.codigoBase ? normalizarCodigo(it.codigoBase) : normalizarCodigo(it.nome);
  var partes = [base || 'ITEM'];
  var medidas = [];
  if (fam) {
    for (var i = 0; i < fam.atributos.length; i++) {
      var a = fam.atributos[i];
      if (a.tipo === 'numero' && a.chave) {
        var v = valoresAtributos[a.chave];
        if (v !== undefined && v !== null && v !== '' && v !== 0) medidas.push(String(v));
      }
    }
  }
  if (medidas.length) partes.push(medidas.join('X'));
  if (fam) {
    for (var j = 0; j < fam.atributos.length; j++) {
      var aj = fam.atributos[j];
      if (aj.tipo === 'lista' && aj.chave) {
        var r = respostasLista[aj.chave];
        if (r) partes.push(r);
      }
    }
  }
  if (it.grupos) {
    for (var g = 0; g < it.grupos.length; g++) {
      var grupo = it.grupos[g];
      var unidades = unidadesGrupo[grupo.id] || [];
      for (var u = 0; u < unidades.length; u++) {
        var comp = acharComponentePorId(unidades[u].componenteId);
        var seg = comp && comp.codigo ? comp.codigo : (comp ? normalizarCodigo(comp.nome) : '');
        var subs = [];
        for (var s = 0; s < grupo.subPerguntas.length; s++) {
          var val = unidades[u].respostas[grupo.subPerguntas[s].chave];
          if (val) subs.push(val);
        }
        partes.push(seg + subs.join(''));
      }
    }
  }
  return partes.join('-');
}

/* ===== VALIDAÇÃO DE ENCAIXE FÍSICO ===== */
function validarEncaixeGrupo(g, unidades, valoresAtributos) {
  if (!g.validaComprimentoContra && !g.validaLarguraContra) return { ok: true };
  var somaComp = 0, maiorLarg = 0;
  for (var i = 0; i < unidades.length; i++) {
    var comp = acharComponentePorId(unidades[i].componenteId);
    if (!comp) continue;
    somaComp += Number(comp.ocupaComprimento) || 0;
    var larg = Number(comp.ocupaLargura) || 0;
    if (larg > maiorLarg) maiorLarg = larg;
  }
  if (g.validaComprimentoContra) {
    var limiteComp = Number(valoresAtributos[g.validaComprimentoContra]) || 0;
    if (limiteComp && somaComp > limiteComp) {
      return { ok: false, erro: 'Comprimento excedido: "' + g.rotulo + '" soma ' + somaComp + 'mm, mas o limite é ' + limiteComp + 'mm (excesso de ' + (somaComp - limiteComp) + 'mm).' };
    }
  }
  if (g.validaLarguraContra) {
    var limiteLarg = Number(valoresAtributos[g.validaLarguraContra]) || 0;
    if (limiteLarg && maiorLarg > limiteLarg) {
      return { ok: false, erro: 'Largura excedida: "' + g.rotulo + '" tem item de ' + maiorLarg + 'mm, mas o limite é ' + limiteLarg + 'mm (excesso de ' + (maiorLarg - limiteLarg) + 'mm).' };
    }
  }
  return { ok: true };
}

/* ===== ASSISTENTE (WIZARD) ===== */
function iniciarWizardOP(it, qtd, destino, containerId) {
  var fam = acharFamiliaDoItem(it);
  var etapas = [{ tipo: 'medidas' }];
  if (fam) { for (var i = 0; i < fam.atributos.length; i++) { if (fam.atributos[i].tipo === 'lista') etapas.push({ tipo: 'lista', chave: fam.atributos[i].chave }); } }
  if (it.grupos) { for (var g = 0; g < it.grupos.length; g++) etapas.push({ tipo: 'grupo', grupoId: it.grupos[g].id }); }
  etapas.push({ tipo: 'revisao' });
  opWizard = { itemId: it.id, quantidade: qtd, etapas: etapas, indice: 0, valoresAtributos: {}, respostasLista: {}, unidadesGrupo: {}, destino: destino || { tipo: 'op' }, containerId: containerId || 'opDetalhe' };
  if (fam) { for (var n = 0; n < fam.atributos.length; n++) { if (fam.atributos[n].tipo === 'numero' && fam.atributos[n].chave) opWizard.valoresAtributos[fam.atributos[n].chave] = 1000; } }
  if (it.grupos) { for (var g2 = 0; g2 < it.grupos.length; g2++) opWizard.unidadesGrupo[it.grupos[g2].id] = []; }
  renderizarWizardOP();
}
function reabrirWizardComOP(op, it) {
  iniciarWizardOP(it, op.quantidade);
  opWizard.valoresAtributos = JSON.parse(JSON.stringify(op.valoresAtributos || {}));
  opWizard.respostasLista = JSON.parse(JSON.stringify(op.respostasLista || {}));
  opWizard.unidadesGrupo = JSON.parse(JSON.stringify(op.unidadesGrupo || {}));
  for (var gid in opWizard.unidadesGrupo) { if (!opWizard.unidadesGrupo[gid]) opWizard.unidadesGrupo[gid] = []; }
  opWizard.reconfigurandoOpId = op.id;
  renderizarWizardOP();
}

function renderizarWizardOP() {
  var it = acharItemPorId(opWizard.itemId);
  var fam = acharFamiliaDoItem(it);
  var etapa = opWizard.etapas[opWizard.indice];
  var html = '<div class="detalhe-topo"><div class="sub">Configurando ' + escaparHTML(it.nome) + ' &middot; etapa ' + (opWizard.indice + 1) + ' de ' + opWizard.etapas.length + '</div>' +
    '<div class="detalhe-acoes"><button type="button" class="btn btn-contorno" id="btnCancelarWizard">Cancelar</button></div></div>';

  if (etapa.tipo === 'medidas') {
    html += '<h4 style="margin:0 0 .6rem;">Medidas</h4><div class="simulador-valores">';
    if (fam) {
      for (var i = 0; i < fam.atributos.length; i++) {
        var a = fam.atributos[i];
        if (a.tipo !== 'numero' || !a.chave) continue;
        var v = opWizard.valoresAtributos[a.chave] !== undefined ? opWizard.valoresAtributos[a.chave] : '';
        html += '<div class="campo campo-sim"><label>' + escaparHTML(a.rotulo || a.chave) + (a.unidade ? ' (' + escaparHTML(a.unidade) + ')' : '') + (a.obrigatorio ? ' *' : '') + '</label>' +
