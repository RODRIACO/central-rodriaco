      }
    }
    html += '</div>';
  } else if (etapa.tipo === 'lista') {
    var atr = null;
    if (fam) { for (var k = 0; k < fam.atributos.length; k++) { if (fam.atributos[k].chave === etapa.chave) { atr = fam.atributos[k]; break; } } }
    html += '<h4 style="margin:0 0 .6rem;">' + escaparHTML(atr ? (atr.rotulo || atr.chave) : etapa.chave) + (atr && atr.obrigatorio ? ' *' : '') + '</h4>';
    html += '<div class="campo" style="max-width:320px;"><select id="wizardListaSelect"><option value="">— selecione —</option>';
    if (atr) {
      for (var o = 0; o < atr.opcoes.length; o++) {
        var op = atr.opcoes[o];
        var sel = opWizard.respostasLista[atr.chave] === op.codigo;
        html += '<option value="' + escaparHTML(op.codigo) + '"' + (sel ? ' selected' : '') + '>' + escaparHTML(op.rotulo) + '</option>';
      }
    }
    html += '</select></div>';
  } else if (etapa.tipo === 'grupo') {
    var grupo = null;
    for (var gi = 0; gi < it.grupos.length; gi++) { if (it.grupos[gi].id === etapa.grupoId) { grupo = it.grupos[gi]; break; } }
    html += renderizarEtapaGrupo(grupo);
  } else if (etapa.tipo === 'revisao') {
    html += renderizarRevisaoWizard(it, fam);
  }

  html += '<div class="detalhe-acoes" style="margin-top:1.4rem; justify-content:flex-end;">' +
    (opWizard.indice > 0 ? '<button type="button" class="btn btn-contorno" id="btnVoltarWizard">&#8249; Voltar</button>' : '') +
    '<button type="button" class="btn btn-primario" id="btnAvancarWizard">' + (etapa.tipo === 'revisao' ? 'Criar ordem de produção' : 'Avançar &#8250;') + '</button>' +
    '</div>';

  var contWizard = document.getElementById(opWizard.containerId);
  contWizard.innerHTML = html;
  contWizard.querySelector('#btnCancelarWizard').addEventListener('click', function () {
    var destino = opWizard.destino;
    opWizard = null;
    if (destino && destino.tipo === 'orcamentoLinha') { voltarWizardOrcamento(destino.orcamentoId); }
    else { voltarListaOPs(); }
  });
  var btnVoltar = contWizard.querySelector('#btnVoltarWizard');
  if (btnVoltar) btnVoltar.addEventListener('click', function () { opWizard.indice--; renderizarWizardOP(); });
  contWizard.querySelector('#btnAvancarWizard').addEventListener('click', function () { avancarWizardOP(it, fam, etapa); });
  if (etapa.tipo === 'grupo') wireEtapaGrupo(it, etapa);
}

function renderizarEtapaGrupo(grupo) {
  var unidades = opWizard.unidadesGrupo[grupo.id] || (opWizard.unidadesGrupo[grupo.id] = []);
  var html = '<h4 style="margin:0 0 .3rem;">' + escaparHTML(grupo.rotulo || '(grupo sem nome)') + '</h4>' +
    '<p class="dica">De ' + (grupo.limiteMin || 0) + ' a ' + (grupo.limiteMax || 0) + ' unidade(s).</p>';
  if (unidades.length) {
    html += '<div class="tabela-wrap"><table><thead><tr><th>Componente</th>';
    for (var s = 0; s < grupo.subPerguntas.length; s++) html += '<th>' + escaparHTML(grupo.subPerguntas[s].rotulo) + '</th>';
    html += '<th></th></tr></thead><tbody>';
    for (var u = 0; u < unidades.length; u++) {
      var comp = acharComponentePorId(unidades[u].componenteId);
      html += '<tr><td>' + escaparHTML(comp ? comp.nome : '?') + '</td>';
      for (var s2 = 0; s2 < grupo.subPerguntas.length; s2++) {
        var pergunta = grupo.subPerguntas[s2];
        var respCod = unidades[u].respostas[pergunta.chave];
        var respRotulo = respCod || '';
        for (var oo = 0; oo < pergunta.opcoes.length; oo++) { if (pergunta.opcoes[oo].codigo === respCod) { respRotulo = pergunta.opcoes[oo].rotulo; break; } }
        html += '<td>' + escaparHTML(respRotulo || '—') + '</td>';
      }
      html += '<td><button type="button" class="icone-btn excluir btn-remover-unidade" data-ui="' + u + '">&#128465;</button></td></tr>';
    }
    html += '</tbody></table></div>';
  } else {
    html += '<div class="lista-vazia-mini">Nenhuma unidade adicionada ainda.</div>';
  }
  if (unidades.length < (grupo.limiteMax || 0)) {
    html += '<div class="subbloco"><div class="campo-linha"><div class="campo"><label>Componente</label>' + campoBuscaHTML('wizardGrupoComponente', '', '', 'Buscar componente...') + '</div>';
    for (var s3 = 0; s3 < grupo.subPerguntas.length; s3++) {
      var pergunta2 = grupo.subPerguntas[s3];
      var opts = '<option value="">— selecione —</option>';
      for (var oo2 = 0; oo2 < pergunta2.opcoes.length; oo2++) opts += '<option value="' + escaparHTML(pergunta2.opcoes[oo2].codigo) + '">' + escaparHTML(pergunta2.opcoes[oo2].rotulo) + '</option>';
      html += '<div class="campo"><label>' + escaparHTML(pergunta2.rotulo) + (pergunta2.obrigatorio ? ' *' : '') + '</label><select class="wizardGrupoSubResposta" data-chave="' + escaparHTML(pergunta2.chave) + '">' + opts + '</select></div>';
    }
    html += '</div><button type="button" class="btn btn-contorno btn-sm" id="btnAddUnidadeGrupo">+ Adicionar</button></div>';
  } else if (grupo.limiteMax) {
    html += '<div class="aviso-inline">Limite de ' + grupo.limiteMax + ' unidade(s) atingido.</div>';
  }
  return html;
}
function wireEtapaGrupo(it, etapa) {
  var grupo = null;
  for (var gi = 0; gi < it.grupos.length; gi++) { if (it.grupos[gi].id === etapa.grupoId) { grupo = it.grupos[gi]; break; } }
  var unidades = opWizard.unidadesGrupo[grupo.id];
  var contGrupo = document.getElementById(opWizard.containerId);
  contGrupo.querySelectorAll('.btn-remover-unidade').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      var ui = parseInt(e.target.getAttribute('data-ui'), 10);
      unidades.splice(ui, 1);
      renderizarWizardOP();
    });
  });
  wireCampoBusca('wizardGrupoComponente', opcoesBuscaComponentesFiltrado(grupo.componentesIds), null);
  var btnAdd = contGrupo.querySelector('#btnAddUnidadeGrupo');
  if (btnAdd) btnAdd.addEventListener('click', function () {
    var componenteId = contGrupo.querySelector('#wizardGrupoComponente').value;
    if (!componenteId) { mostrarAvisoWizard('Escolha um componente.'); return; }
    var respostas = {};
    contGrupo.querySelectorAll('.wizardGrupoSubResposta').forEach(function (sel) { respostas[sel.getAttribute('data-chave')] = sel.value; });
    var faltando = [];
    for (var s = 0; s < grupo.subPerguntas.length; s++) {
      var pergunta = grupo.subPerguntas[s];
      if (pergunta.obrigatorio && !respostas[pergunta.chave]) faltando.push(pergunta.rotulo);
    }
    if (faltando.length) { mostrarAvisoWizard('Preencha: ' + faltando.join(', ')); return; }
    var candidato = { componenteId: componenteId, respostas: respostas };
    var checagem = validarEncaixeGrupo(grupo, unidades.concat([candidato]), opWizard.valoresAtributos);
    if (!checagem.ok) { mostrarAvisoWizard(checagem.erro); return; }
    unidades.push(candidato);
    renderizarWizardOP();
  });
}

function renderizarRevisaoWizard(it, fam) {
  var codigo = gerarCodigoConfiguracao(it, fam, opWizard.valoresAtributos, opWizard.respostasLista, opWizard.unidadesGrupo);
  var html = '<h4 style="margin:0 0 .6rem;">Revisão</h4>' +
    '<div class="campo"><label>Código da configuração</label><input type="text" value="' + escaparHTML(codigo) + '" disabled></div>';
  var partes = [];
  if (fam) {
    for (var i = 0; i < fam.atributos.length; i++) {
      var a = fam.atributos[i];
      if (!a.chave) continue;
      if (a.tipo === 'numero') partes.push((a.rotulo || a.chave) + ' = ' + opWizard.valoresAtributos[a.chave]);
      if (a.tipo === 'lista' && opWizard.respostasLista[a.chave]) {
        var rot = opWizard.respostasLista[a.chave];
        for (var o = 0; o < a.opcoes.length; o++) { if (a.opcoes[o].codigo === opWizard.respostasLista[a.chave]) rot = a.opcoes[o].rotulo; }
        partes.push((a.rotulo || a.chave) + ' = ' + rot);
      }
    }
  }
  if (it.grupos) {
    for (var g = 0; g < it.grupos.length; g++) {
      var grupo = it.grupos[g];
      var unidades = opWizard.unidadesGrupo[grupo.id] || [];
      for (var u = 0; u < unidades.length; u++) {
        var comp = acharComponentePorId(unidades[u].componenteId);
        partes.push(grupo.rotulo + ' = ' + (comp ? comp.nome : '?'));
      }
    }
  }
  html += '<p class="dica">' + escaparHTML(partes.join(' · ')) + '</p>';
  return html;
}

function avancarWizardOP(it, fam, etapa) {
  if (etapa.tipo === 'medidas') {
    var faltando = [];
    document.getElementById(opWizard.containerId).querySelectorAll('.in-wizard-medida').forEach(function (inp) {
      var chave = inp.getAttribute('data-chave');
      var val = inp.value === '' ? null : parseFloat(inp.value);
      opWizard.valoresAtributos[chave] = val === null || isNaN(val) ? 0 : val;
    });
    if (fam) {
      for (var i = 0; i < fam.atributos.length; i++) {
        var a = fam.atributos[i];
        if (a.tipo === 'numero' && a.obrigatorio && !opWizard.valoresAtributos[a.chave]) faltando.push(a.rotulo || a.chave);
      }
    }
    if (faltando.length) { mostrarAvisoWizard('Preencha: ' + faltando.join(', ')); return; }
  } else if (etapa.tipo === 'lista') {
    var sel = document.getElementById(opWizard.containerId).querySelector('#wizardListaSelect');
    var atr = null;
    if (fam) { for (var k = 0; k < fam.atributos.length; k++) { if (fam.atributos[k].chave === etapa.chave) { atr = fam.atributos[k]; break; } } }
    if (atr && atr.obrigatorio && !sel.value) { mostrarAvisoWizard('Selecione uma opção pra "' + (atr.rotulo || atr.chave) + '".'); return; }
    opWizard.respostasLista[etapa.chave] = sel.value;
  } else if (etapa.tipo === 'grupo') {
    var grupo = null;
    for (var gi = 0; gi < it.grupos.length; gi++) { if (it.grupos[gi].id === etapa.grupoId) { grupo = it.grupos[gi]; break; } }
    var unidades = opWizard.unidadesGrupo[grupo.id] || [];
    if (unidades.length < (grupo.limiteMin || 0)) { mostrarAvisoWizard('"' + grupo.rotulo + '" precisa de pelo menos ' + grupo.limiteMin + ' unidade(s).'); return; }
  } else if (etapa.tipo === 'revisao') {
    finalizarWizardOP(it, fam);
    return;
  }
  opWizard.indice++;
  renderizarWizardOP();
}
function finalizarWizardOP(it, fam) {
  var codigo = gerarCodigoConfiguracao(it, fam, opWizard.valoresAtributos, opWizard.respostasLista, opWizard.unidadesGrupo);
  if (opWizard.destino && opWizard.destino.tipo === 'orcamentoLinha') {
    finalizarWizardParaOrcamento(it, codigo);
    return;
  }
  var op;
  if (opWizard.reconfigurandoOpId) { op = acharOP(opWizard.reconfigurandoOpId); }
  else { op = construirOPBase(it, opWizard.quantidade); estado.ordensProducao.push(op); }
  op.valoresAtributos = opWizard.valoresAtributos;
  op.respostasLista = opWizard.respostasLista;
  op.unidadesGrupo = opWizard.unidadesGrupo;
  op.codigoConfiguracao = codigo;
  registrarModeloSalvo(it, codigo, op.valoresAtributos, op.respostasLista, op.unidadesGrupo);
  opWizard = null;
  salvar();
  abrirDetalheOP(op.id);
}
function finalizarWizardParaOrcamento(it, codigo) {
  var orc = acharOrcamento(opWizard.destino.orcamentoId);
  if (!orc) { opWizard = null; return; }
  var custoUnit = calcularCustoUnitario(it, opWizard.valoresAtributos, opWizard.unidadesGrupo);
  var margem = (estado.margemVendaPadrao !== undefined && estado.margemVendaPadrao !== null) ? estado.margemVendaPadrao : 50;
  var precoUnit = custoUnit * (1 + margem / 100);
  var qtd = opWizard.quantidade;
  registrarModeloSalvo(it, codigo, opWizard.valoresAtributos, opWizard.respostasLista, opWizard.unidadesGrupo);
  orc.linhas.push({
    id: gerarId(), itemId: it.id, quantidade: qtd,
    valoresAtributos: opWizard.valoresAtributos, respostasLista: opWizard.respostasLista, unidadesGrupo: opWizard.unidadesGrupo,
    codigoConfiguracao: codigo, custoUnitario: custoUnit, precoUnitario: precoUnit, precoTotal: precoUnit * qtd, opsGeradasIds: []
  });
  opWizard = null;
  document.getElementById('orcLinhaWizard').innerHTML = '';
  salvar();
  abrirDetalheOrcamento(orc.id);
}

/* ===== DETALHE (tela normal, apos criado) ===== */
function abrirDetalheOP(id) {
  opAbertaId = id;
  document.getElementById('opsLista').style.display = 'none';
  document.getElementById('opDetalhe').style.display = 'block';
  renderizarDetalheOP();
}
function voltarListaOPs() {
  document.getElementById('opDetalhe').style.display = 'none';
  renderizarOpsLista();
}
function renderizarDetalheOP() {
  var op = acharOP(opAbertaId);
  if (!op) { voltarListaOPs(); return; }
  var it = acharItemPorId(op.itemId);
  var fam = it ? acharFamiliaDoItem(it) : null;

  var html = '' +
    '<div class="detalhe-topo">' +
      '<button type="button" class="btn btn-contorno" id="btnVoltarOP">&#8249; Ordens de produção</button>' +
      '<div class="detalhe-acoes">' +
        (itemEhConfiguravel(it) ? '<button type="button" class="btn btn-contorno" id="btnReconfigurarOP">Reconfigurar</button>' : '') +
        '<button type="button" class="btn btn-contorno" id="btnImprimirOP">Imprimir</button>' +
        '<button type="button" class="btn btn-perigo" id="btnExcluirOP">Excluir</button>' +
        '<button type="button" class="btn btn-primario" id="btnSalvarOP">&#128190; Salvar alterações</button>' +
      '</div>' +
    '</div>' +
    '<div class="campo-linha">' +
      '<div class="campo"><label>Número</label><input type="text" value="' + escaparHTML(op.codigo || '') + '" disabled></div>' +
      '<div class="campo"><label>Status</label><select id="campoOpStatus">' +
        '<option value="aberta"' + (op.status === 'aberta' ? ' selected' : '') + '>Aberta</option>' +
        '<option value="liberada"' + (op.status === 'liberada' ? ' selected' : '') + '>Liberada</option>' +
        '<option value="em_producao"' + (op.status === 'em_producao' ? ' selected' : '') + '>Em produção</option>' +
        '<option value="concluida"' + (op.status === 'concluida' ? ' selected' : '') + '>Concluída</option>' +
        '<option value="cancelada"' + (op.status === 'cancelada' ? ' selected' : '') + '>Cancelada</option>' +
      '</select></div>' +
    '</div>' +
    (op.codigoConfiguracao ? '<div class="campo"><label>Código da configuração</label><input type="text" value="' + escaparHTML(op.codigoConfiguracao) + '" disabled></div>' : '') +
    (op.pedidoId ? '<div class="campo"><label>Pedido de origem</label><input type="text" value="' + escaparHTML(nomePedido(op.pedidoId) || '') + '" disabled></div>' : '') +
    '<div class="campo-linha">' +
      '<div class="campo"><label>Item</label>' + campoBuscaHTML('campoOpItem', op.itemId, it ? it.nome : '', 'Digite pra buscar um item...') + '</div>' +
      '<div class="campo"><label>Quantidade a produzir</label><input type="number" id="campoOpQtd" value="' + (op.quantidade || 1) + '" min="1" step="1"></div>' +
    '</div>' +
    '<div class="campo-linha">' +
      '<div class="campo"><label>Cliente (opcional)</label>' + campoBuscaHTML('campoOpCliente', op.clienteId || '', op.clienteId ? (nomeCliente(op.clienteId) || '') : '', 'Digite pra buscar um cliente...') + '</div>' +
      '<div class="campo"><label>Previsão de entrega</label><input type="date" id="campoOpPrevisao" value="' + (op.dataPrevisao || '') + '"></div>' +
    '</div>' +
    '<div class="campo"><label>Observações</label><textarea id="campoOpObs">' + escaparHTML(op.observacoes || '') + '</textarea></div>' +
    renderizarHistoricoEtapasOP(op) +
    '<div class="bloco-atributos"><div class="bloco-cab"><h4>Medidas desta ordem</h4></div><div class="simulador-valores" id="opMedidas"></div></div>' +
    '<div class="bloco-simulador"><h4>Necessidade de materiais</h4><p class="dica">Calculada a partir do BOM do item, dos grupos escolhidos, das medidas e da quantidade a produzir.</p><div id="opNecessidade"></div></div>';

  document.getElementById('opDetalhe').innerHTML = html;

  document.getElementById('btnVoltarOP').addEventListener('click', voltarListaOPs);
  document.getElementById('btnExcluirOP').addEventListener('click', function () { excluirOP(op.id); });
  document.getElementById('btnSalvarOP').addEventListener('click', function () { salvar(); });
  var btnReconfig = document.getElementById('btnReconfigurarOP');
  if (btnReconfig) btnReconfig.addEventListener('click', function () { reabrirWizardComOP(op, it); });
  document.getElementById('campoOpStatus').addEventListener('change', function (e) {
    var novo = e.target.value;
    if (novo === 'liberada' && op.status !== 'liberada') op.dataLiberacao = new Date().toISOString().slice(0, 10);
    op.status = novo;
    renderizarDetalheOP();
  });
  var btnImprimir = document.getElementById('btnImprimirOP');
  if (btnImprimir) btnImprimir.addEventListener('click', function () { imprimirOP(op, it); });
  wireCampoBusca('campoOpItem', opcoesBuscaItens, function (novoId) {
    op.itemId = novoId; op.valoresAtributos = {}; op.respostasLista = {}; op.unidadesGrupo = {}; op.codigoConfiguracao = '';
    var novaFam = acharFamiliaDoItem(acharItemPorId(op.itemId));
    if (novaFam) { for (var n = 0; n < novaFam.atributos.length; n++) { if (novaFam.atributos[n].tipo === 'numero') op.valoresAtributos[novaFam.atributos[n].chave] = 1000; } }
    renderizarDetalheOP();
  });
  document.getElementById('campoOpQtd').addEventListener('input', function (e) { op.quantidade = parseFloat(e.target.value) || 0; atualizarNecessidadeOP(); });
  wireCampoBusca('campoOpCliente', opcoesBuscaClientes, function (novoId) { op.clienteId = novoId || null; });

function renderizarMedidasOP(fam, op) {
  var el = document.getElementById('opMedidas');
  var numericos = fam ? fam.atributos.filter(function (a) { return a.tipo === 'numero'; }) : [];
  if (!numericos.length) { el.innerHTML = '<div class="aviso-inline">Sem atributos numéricos nesta família ainda.</div>'; return; }
  var html = '';
  for (var i = 0; i < numericos.length; i++) {
    var a = numericos[i];
    var v = op.valoresAtributos[a.chave] !== undefined ? op.valoresAtributos[a.chave] : 0;
    html += '<div class="campo campo-sim"><label>' + escaparHTML(a.rotulo || a.chave) + (a.unidade ? ' (' + escaparHTML(a.unidade) + ')' : '') + '</label>' +
      '<input type="number" class="in-op-medida" data-chave="' + escaparHTML(a.chave) + '" value="' + v + '"></div>';
  }
  el.innerHTML = html;
  el.querySelectorAll('.in-op-medida').forEach(function (inp) {
    inp.addEventListener('input', function (e) {
      op.valoresAtributos[e.target.getAttribute('data-chave')] = parseFloat(e.target.value) || 0;
      atualizarNecessidadeOP();
    });
  });
}
function atualizarNecessidadeOP() {
  var op = acharOP(opAbertaId);
  var el = document.getElementById('opNecessidade');
  if (!op || !el) return;
  var it = acharItemPorId(op.itemId);
  if (!it) { el.innerHTML = ''; return; }
  var temBom = it.bom && it.bom.length;
  var temGrupos = it.grupos && it.grupos.length && Object.keys(op.unidadesGrupo || {}).some(function (gid) { return (op.unidadesGrupo[gid] || []).length; });
  if (!temBom && !temGrupos) { el.innerHTML = '<div class="lista-vazia-mini">Este item não tem BOM nem grupos com unidades escolhidas.</div>'; return; }

  var html = '<div class="tabela-wrap"><table class="tabela-resultado"><thead><tr><th>Componente</th><th>Fórmula</th><th class="num">Qtd. unitária</th><th class="num">Qtd. total (x' + (op.quantidade || 0) + ')</th><th class="num">Custo total</th></tr></thead><tbody>';
  var totalGeral = 0;

  for (var j = 0; j < (it.bom || []).length; j++) {
    var linha = it.bom[j];
    var comp = acharComponentePorId(linha.componenteId);
    if (!comp) { html += '<tr><td colspan="5" class="erro-formula">componente não selecionado</td></tr>'; continue; }
    var escopo = {};
    if (comp.propriedades) { for (var ip = 0; ip < comp.propriedades.length; ip++) { var prop = comp.propriedades[ip]; if (prop.chave) escopo[prop.chave] = (prop.valor !== null && prop.valor !== undefined) ? prop.valor : 0; } }
    escopo.fator = (comp.fator !== null && comp.fator !== undefined) ? comp.fator : 1;
    for (var chave in op.valoresAtributos) escopo[chave] = op.valoresAtributos[chave];
    var r = avaliarFormula(linha.formula, escopo);
    var qtdUnitTxt, qtdTotalTxt, custoTotalLinha;
    if (!r.ok) { qtdUnitTxt = '<span class="erro-formula">' + escaparHTML(r.erro) + '</span>'; qtdTotalTxt = '—'; custoTotalLinha = 0; }
    else {
      var qtdTotal = r.valor * (op.quantidade || 0);
      qtdUnitTxt = r.valor.toLocaleString('pt-BR', { maximumFractionDigits: 3 }) + ' ' + escaparHTML(comp.unidade);
      qtdTotalTxt = qtdTotal.toLocaleString('pt-BR', { maximumFractionDigits: 3 }) + ' ' + escaparHTML(comp.unidade);
      custoTotalLinha = qtdTotal * comp.custo;
      totalGeral += custoTotalLinha;
    }
    html += '<tr>' +
      '<td>' + escaparHTML(comp.nome) + (linha.obrigatorio ? '' : ' <span class="muted">(opcional)</span>') + '</td>' +
      '<td><code>' + escaparHTML(linha.formula || '(vazia)') + '</code></td>' +
      '<td class="num">' + qtdUnitTxt + '</td>' + '<td class="num">' + qtdTotalTxt + '</td>' +
      '<td class="num">' + (r.ok ? 'R$ ' + formatarMoeda(custoTotalLinha) : '—') + '</td>' + '</tr>';
  }

  if (it.grupos) {
    for (var gg = 0; gg < it.grupos.length; gg++) {
      var grupo = it.grupos[gg];
      var unidades = (op.unidadesGrupo && op.unidadesGrupo[grupo.id]) || [];
      var contagem = {};
      for (var uu = 0; uu < unidades.length; uu++) { var cid = unidades[uu].componenteId; contagem[cid] = (contagem[cid] || 0) + 1; }
      for (var cid2 in contagem) {
        var comp2 = acharComponentePorId(cid2);
        if (!comp2) continue;
        var qtdUnit = contagem[cid2];
        var qtdTotal2 = qtdUnit * (op.quantidade || 0);
        var custoTotal2 = qtdTotal2 * comp2.custo;
        totalGeral += custoTotal2;
        html += '<tr>' +
          '<td>' + escaparHTML(comp2.nome) + ' <span class="muted">(' + escaparHTML(grupo.rotulo) + ')</span></td>' +
          '<td><code>—</code></td>' +
          '<td class="num">' + qtdUnit + ' ' + escaparHTML(comp2.unidade) + '</td>' +
          '<td class="num">' + qtdTotal2 + ' ' + escaparHTML(comp2.unidade) + '</td>' +
          '<td class="num">R$ ' + formatarMoeda(custoTotal2) + '</td>' +
          '</tr>';
      }
    }
  }

  html += '</tbody></table></div>' + '<div class="total-simulador">Custo total de materiais&nbsp; <strong>R$ ' + formatarMoeda(totalGeral) + '</strong></div>';
  el.innerHTML = html;
}

function nomeCliente(id) { for (var i = 0; i < estado.clientes.length; i++) { if (estado.clientes[i].id === id) return nomeClienteCompleto(estado.clientes[i]); } return null; }
function nomeVendedor(id) { for (var i = 0; i < estado.vendedores.length; i++) { if (estado.vendedores[i].id === id) return estado.vendedores[i].nome; } return null; }
function normalizarCNPJ(s) { return String(s || '').replace(/[^0-9]/g, ''); }
function encontrarClientePorCNPJ(cnpj, excluirId) {
  var norm = normalizarCNPJ(cnpj);
  if (!norm) return null;
  for (var i = 0; i < estado.clientes.length; i++) {
    var c = estado.clientes[i];
    if (c.id !== excluirId && normalizarCNPJ(c.cnpj) === norm) return c;
  }
  return null;
}

function linhaClienteHTML(c, indentado, colunas) {

function renderizarClientesLista() {
  var html = '<div class="lista-cab">' + botaoColunasHTML('clientes') + '<button type="button" class="btn btn-primario" id="btnNovoCliente">+ Novo cliente</button></div>';
  if (!estado.clientes.length) {
    html += '<div class="lista-vazia">Nenhum cliente cadastrado ainda.</div>';
  } else {
    var todasColunas = colunasClientes();
    var colunas = colunasVisiveisFiltradas('clientes', todasColunas);
    var stCl = colEstado('clientes');
    var principais = estado.clientes.filter(function (c) { return !c.clientePaiId; });
    var todasLinhas = [];
    var grupos = principais.map(function (p) {
      var lp = colLinha(p, colunas);
      var filhosL = filhosDeCliente(p.id).map(function (f) { return colLinha(f, colunas); });
      todasLinhas.push(lp);
      filhosL.forEach(function (f) { todasLinhas.push(f); });
      return { p: lp, filhos: filhosL };
    });
    TABELAS_CTX.clientes = { colunas: colunas, linhas: todasLinhas };
    if (stCl.ordem && colunas.some(function (c) { return c.chave === stCl.ordem.chave; })) {
      var kOrd = stCl.ordem.chave;
      var tOrd = colTipoDe(todasLinhas.map(function (l) { return l.tx[kOrd]; }));
      var cmp = function (a, b) { return colOrdenarCmp(tOrd, stCl.ordem.dir, a.tx[kOrd], b.tx[kOrd]); };
      grupos.sort(function (a, b) { return cmp(a.p, b.p); });
      grupos.forEach(function (g) { g.filhos.sort(cmp); });
    }
    html += colFiltroTopoHTML('clientes', colunas);
    html += '<div class="tabela-wrap"><table class="tabela-reordenavel" data-tipo="clientes"><thead><tr>';
    html += colCabecalhoHTML('clientes', colunas);
    html += '<th></th></tr></thead><tbody>';
    var algumaLinha = false;
    grupos.forEach(function (g) {
      if (colPassa(stCl, g.p.tx)) { html += linhaClienteHTML(g.p.item, false, colunas); algumaLinha = true; }
      g.filhos.forEach(function (f) {
        if (colPassa(stCl, f.tx)) { html += linhaClienteHTML(f.item, true, colunas); algumaLinha = true; }
      });
    });
    if (!algumaLinha) html += '<tr><td colspan="' + (colunas.length + 1) + '" class="muted" style="text-align:center; padding:18px;">Nenhum registro com esses filtros.</td></tr>';
    html += '</tbody></table></div>';
  }
  document.getElementById('clientesLista').innerHTML = html;
  document.getElementById('btnNovoCliente').addEventListener('click', function () { abrirModalNovoCliente(); });
  document.querySelectorAll('#clientesLista tr[data-id]').forEach(function (tr) {
    tr.addEventListener('click', function () { abrirDetalheCliente(tr.getAttribute('data-id')); });
  });
  wireBotaoColunas('clientes', colunasClientes(), renderizarClientesLista);
}

/* ===== hierarquia cliente / sub-cliente (ex.: concessionária x unidade de entrega) ===== */
function filhosDeCliente(id) {
  return estado.clientes.filter(function (x) { return x.clientePaiId === id; });
}
function coletarDescendentes(id) {
  var out = [];
  var filhos = filhosDeCliente(id);
  for (var i = 0; i < filhos.length; i++) {
    out.push(filhos[i].id);
    out = out.concat(coletarDescendentes(filhos[i].id));
  }
  return out;
}
function nomeClienteCompleto(c) {
  if (!c) return '';
  if (c.clientePaiId) {
    var pai = null;
    for (var i = 0; i < estado.clientes.length; i++) { if (estado.clientes[i].id === c.clientePaiId) { pai = estado.clientes[i]; break; } }
    if (pai) return pai.nome + ' › ' + c.nome;
  }
  return c.nome;
}
function opcoesClientePai(clienteAtualId) {
  var html = '<option value="">— Nenhum (cliente principal) —</option>';
  var bloqueados = clienteAtualId ? coletarDescendentes(clienteAtualId) : [];
  for (var i = 0; i < estado.clientes.length; i++) {
    var x = estado.clientes[i];
    if (x.id === clienteAtualId) continue;
    if (bloqueados.indexOf(x.id) !== -1) continue;
    html += '<option value="' + x.id + '">' + escaparHTML(nomeClienteCompleto(x)) + '</option>';
  }
  return html;
}

function excluirCliente(id) {
  var usados = [];
  for (var i = 0; i < estado.oportunidades.length; i++) { if (estado.oportunidades[i].clienteId === id) usados.push('a oportunidade "' + estado.oportunidades[i].titulo + '"'); }
  for (var j = 0; j < estado.interacoes.length; j++) { if (estado.interacoes[j].clienteId === id) { usados.push('interações registradas'); break; } }
  var filhosCliente = filhosDeCliente(id);
  if (filhosCliente.length) usados.push(filhosCliente.length + ' sub-cliente(s)');
  if (usados.length) {
    abrirModalBase('Não é possível excluir', '<p class="modal-mensagem">Este cliente está vinculado a: <strong>' + escaparHTML(usados.join(', ')) + '</strong>. Remova esses registros antes de excluir o cliente.</p>', [
      { texto: 'Entendi', classe: 'btn-primario', aoClicar: function () { return true; } }
    ]);
    return;
  }
  var c = null;
  for (var k = 0; k < estado.clientes.length; k++) { if (estado.clientes[k].id === id) { c = estado.clientes[k]; break; } }

/* ===== ORÇAMENTOS / PEDIDOS ===== */
var orcamentoAbertoId = null;
var pedidoAbertoId = null;

function calcularCustoUnitario(it, valoresAtributos, unidadesGrupo) {
  var total = 0;
  for (var j = 0; j < (it.bom || []).length; j++) {
    var linha = it.bom[j];
    var comp = acharComponentePorId(linha.componenteId);
    if (!comp) continue;
    var escopo = {};
    if (comp.propriedades) { for (var ip = 0; ip < comp.propriedades.length; ip++) { var prop = comp.propriedades[ip]; if (prop.chave) escopo[prop.chave] = (prop.valor !== null && prop.valor !== undefined) ? prop.valor : 0; } }
    escopo.fator = (comp.fator !== null && comp.fator !== undefined) ? comp.fator : 1;
    for (var chave in valoresAtributos) escopo[chave] = valoresAtributos[chave];
    var r = avaliarFormula(linha.formula, escopo);
    if (r.ok) total += r.valor * comp.custo;
  }
  if (it.grupos) {
    for (var gg = 0; gg < it.grupos.length; gg++) {
      var grupo = it.grupos[gg];
      var unidades = (unidadesGrupo && unidadesGrupo[grupo.id]) || [];
      for (var uu = 0; uu < unidades.length; uu++) {
        var comp2 = acharComponentePorId(unidades[uu].componenteId);
        if (comp2) total += comp2.custo;
      }
    }
  }
  return total;
}

function proximoNumeroOrcamento() {
  estado.contadorOrcamento = (estado.contadorOrcamento || 0) + 1;
  var n = String(estado.contadorOrcamento);
  while (n.length < 4) n = '0' + n;
  return 'ORC-' + n;
}
function proximoNumeroPedido() {
  estado.contadorPedido = (estado.contadorPedido || 0) + 1;
  var n = String(estado.contadorPedido);
  while (n.length < 4) n = '0' + n;
  return 'PED-' + n;
}
function rotuloStatusOrcamento(s) {
  if (s === 'enviado') return 'Enviado';
  if (s === 'aguardando_comercial') return 'Aguardando aprovação (Rodrigo)';
  if (s === 'aguardando_fabrica') return 'Aguardando aprovação (Fábrica)';
  if (s === 'aprovado') return 'Aprovado';
  if (s === 'recusado') return 'Recusado';
  if (s === 'convertido') return 'Em produção';
  return 'Orçamento';
}
function classeStatusOrcamento(s) {
  if (s === 'convertido') return 'status-op-concluida';
  if (s === 'aguardando_comercial' || s === 'aguardando_fabrica' || s === 'aprovado') return 'status-op-producao';
  if (s === 'recusado') return 'status-op-cancelada';
  return 'status-op-aberta';
}
function acharOrcamento(id) {
  for (var i = 0; i < estado.orcamentos.length; i++) { if (estado.orcamentos[i].id === id) return estado.orcamentos[i]; }
  return null;
}

/* ===== KANBAN DE ORÇAMENTOS (Orçamento -> Aprovação Rodrigo -> Aprovação Fábrica -> Em Produção) ===== */
var COLUNAS_KANBAN_ORC = [
  { chave: 'rascunho', titulo: 'Orçamento' },
  { chave: 'aguardando_comercial', titulo: 'Aguardando Aprovação (Rodrigo)' },
  { chave: 'aguardando_fabrica', titulo: 'Aguardando Aprovação (Fábrica)' },
  { chave: 'convertido', titulo: 'Em Produção' }
];
function colunaKanbanOrcamento(orc) {
  if (orc.status === 'aguardando_comercial') return 'aguardando_comercial';
  if (orc.status === 'aguardando_fabrica' || orc.status === 'aprovado') return 'aguardando_fabrica';
  if (orc.status === 'convertido') return 'convertido';
  return 'rascunho';
}
function situacaoProducaoOrcamento(orc) {
  var pedido = null;
  for (var i = 0; i < estado.pedidos.length; i++) { if (estado.pedidos[i].orcamentoOrigemId === orc.id) { pedido = estado.pedidos[i]; break; } }
  if (!pedido) return 'Gerando pedido...';
  var opsIds = [];
  for (var j = 0; j < pedido.linhas.length; j++) opsIds = opsIds.concat(pedido.linhas[j].opsGeradasIds || []);
  if (!opsIds.length) return 'Sem OPs geradas';
  var partes = [];
  for (var k = 0; k < opsIds.length; k++) {
    var op = acharOP(opsIds[k]);
    if (!op) continue;
    if (op.status === 'em_producao') {
      var et = null;
      for (var e = 0; e < (estado.etapasProducao || []).length; e++) { if (estado.etapasProducao[e].id === op.etapaAtualId) { et = estado.etapasProducao[e]; break; } }
      partes.push(op.codigo + ': ' + (et ? et.nome : 'Em produção'));
    } else {
      partes.push(op.codigo + ': ' + rotuloStatusOP(op.status));
    }
  }
  return partes.join(' · ');
}
function cartaoOrcamentoKanban(orc, colunaChave) {
  var total = 0;
  for (var j = 0; j < orc.linhas.length; j++) total += orc.linhas[j].precoTotal || 0;
  var html = '<div class="cartao-op kanban-card" draggable="true" data-id="' + orc.id + '">' +
    '<div class="kanban-card-topo"><strong>' + escaparHTML(orc.numero) + '</strong><span class="kanban-card-total">R$ ' + formatarMoeda(total) + '</span></div>' +
    '<div class="kanban-card-cliente">' + escaparHTML(nomeCliente(orc.clienteId) || '—') + '</div>';
  if (colunaChave === 'rascunho' && orc.motivoRecusa) {
    html += '<div class="kanban-card-recusa">Recusado: ' + escaparHTML(orc.motivoRecusa) + '</div>';
  }
  if (colunaChave === 'aguardando_comercial') {
    html += '<div class="kanban-card-aprovacao">Aguardando aprovação de <strong>Rodrigo</strong></div>' +
      '<div class="kanban-card-acoes">' +
        '<button type="button" class="btn btn-primario btn-sm btn-aprovar-kanban" data-etapa="comercial">Aprovar</button>' +
        '<button type="button" class="btn btn-contorno btn-sm btn-recusar-kanban">Recusar</button>' +
      '</div>';
  } else if (colunaChave === 'aguardando_fabrica') {
    html += '<div class="kanban-card-aprovacao">Aguardando aprovação da <strong>Fábrica (PCP)</strong></div>' +
      '<div class="kanban-card-acoes">' +
        '<button type="button" class="btn btn-primario btn-sm btn-aprovar-kanban" data-etapa="fabrica">Aprovar</button>' +
        '<button type="button" class="btn btn-contorno btn-sm btn-recusar-kanban">Recusar</button>' +
      '</div>';
  } else if (colunaChave === 'convertido') {
    html += '<div class="kanban-card-producao">' + escaparHTML(situacaoProducaoOrcamento(orc)) + '</div>';
  }
  html += '</div>';
  return html;
}
function aprovarOrcamentoFabrica(orc) {
  var pedido = {
    id: gerarId(), numero: proximoNumeroPedido(), clienteId: orc.clienteId, orcamentoOrigemId: orc.id,
    data: new Date().toISOString().slice(0, 10),
    linhas: orc.linhas.map(function (l) {
      return { id: gerarId(), itemId: l.itemId, quantidade: l.quantidade,
        valoresAtributos: JSON.parse(JSON.stringify(l.valoresAtributos)),
        respostasLista: JSON.parse(JSON.stringify(l.respostasLista)),
        unidadesGrupo: JSON.parse(JSON.stringify(l.unidadesGrupo)),
        codigoConfiguracao: l.codigoConfiguracao, custoUnitario: l.custoUnitario, precoUnitario: l.precoUnitario, precoTotal: l.precoTotal,
        opsGeradasIds: [] };
    }),
    status: 'aberto', observacoes: orc.observacoes
  };
  estado.pedidos.push(pedido);
  for (var i = 0; i < pedido.linhas.length; i++) {
    var linha = pedido.linhas[i];
    var it = acharItemPorId(linha.itemId);
    if (!it) continue;
    var novaOp = construirOPBase(it, linha.quantidade);
    novaOp.valoresAtributos = JSON.parse(JSON.stringify(linha.valoresAtributos));
    novaOp.respostasLista = JSON.parse(JSON.stringify(linha.respostasLista));
    novaOp.unidadesGrupo = JSON.parse(JSON.stringify(linha.unidadesGrupo));
    novaOp.codigoConfiguracao = linha.codigoConfiguracao;
    novaOp.clienteId = pedido.clienteId;
    novaOp.pedidoId = pedido.id;
    novaOp.status = 'liberada';
    novaOp.dataLiberacao = new Date().toISOString().slice(0, 10);
    estado.ordensProducao.push(novaOp);
    linha.opsGeradasIds = [novaOp.id];
  }
  orc.status = 'convertido';
  salvar();
  renderizarOrcamentosLista();
}
function recusarOrcamentoKanban(orc) {
  var corpo = '<div class="campo"><label>Motivo (opcional)</label><textarea id="campoMotivoRecusa" placeholder="Por que foi recusado?"></textarea></div>';
  abrirModalBase('Recusar orçamento', corpo, [
    { texto: 'Cancelar', classe: 'btn-contorno', aoClicar: function () { return true; } },
    { texto: 'Recusar', classe: 'btn-perigo', aoClicar: function () {
        orc.motivoRecusa = document.getElementById('campoMotivoRecusa').value.trim();
        orc.status = 'rascunho';
        salvar();
        renderizarOrcamentosLista();
        return true;
      } }
  ]);
}
function moverOrcamentoKanban(orc, destino) {
  var atual = colunaKanbanOrcamento(orc);
  if (atual === destino) return;
  if (destino === 'aguardando_comercial' && atual === 'rascunho') {
    orc.motivoRecusa = null;
    orc.status = 'aguardando_comercial';
    salvar();
    renderizarOrcamentosLista();
    return;
  }
  if (destino === 'rascunho') {
    orc.status = 'rascunho';
    salvar();
    renderizarOrcamentosLista();
    return;
  }
  abrirModalBase('Não dá pra mover assim', '<p class="modal-mensagem">Use os botões Aprovar/Recusar no card pra avançar esse orçamento — arrastar direto pula uma aprovação.</p>', [
    { texto: 'Entendi', classe: 'btn-primario', aoClicar: function () { return true; } }
  ]);
}
function wireKanbanOrcamentos() {
  var arrastando = null;
  document.querySelectorAll('#orcamentosLista .kanban-card').forEach(function (card) {
    card.addEventListener('dragstart', function () { arrastando = card; card.classList.add('arrastando'); });
    card.addEventListener('dragend', function () { card.classList.remove('arrastando'); });
    card.addEventListener('click', function (e) {
      if (e.target.closest('.kanban-card-acoes')) return;
      abrirDetalheOrcamento(card.getAttribute('data-id'));
    });
  });
  document.querySelectorAll('#orcamentosLista .coluna-mapa-corpo').forEach(function (zona) {
    zona.addEventListener('dragover', function (e) { e.preventDefault(); zona.classList.add('drag-sobre'); });
    zona.addEventListener('dragleave', function () { zona.classList.remove('drag-sobre'); });
    zona.addEventListener('drop', function (e) {
      e.preventDefault();
      zona.classList.remove('drag-sobre');
      if (!arrastando) return;
      var orc = acharOrcamento(arrastando.getAttribute('data-id'));
      if (orc) moverOrcamentoKanban(orc, zona.getAttribute('data-dropzone'));
    });
  });
  document.querySelectorAll('#orcamentosLista .btn-aprovar-kanban').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var card = btn.closest('.kanban-card');
      var orc = acharOrcamento(card.getAttribute('data-id'));
      if (!orc) return;
      if (btn.getAttribute('data-etapa') === 'comercial') {
        orc.motivoRecusa = null;
        orc.status = 'aguardando_fabrica';
        salvar();
        renderizarOrcamentosLista();
      } else {
        aprovarOrcamentoFabrica(orc);
      }
    });
  });
  document.querySelectorAll('#orcamentosLista .btn-recusar-kanban').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var card = btn.closest('.kanban-card');
      var orc = acharOrcamento(card.getAttribute('data-id'));
      if (orc) recusarOrcamentoKanban(orc);
    });
  });
}

function adicionarLinhaOrcamentoSimples(orc, it, qtd) {

  var precoUnit = custoUnit * (1 + margem / 100);

function gerarOPDeLinhaPedido(pedido, linha) {
  if (linha.opsGeradasIds && linha.opsGeradasIds.length) return;
  var it = acharItemPorId(linha.itemId);
  if (!it) return;
  var novaOp = construirOPBase(it, linha.quantidade);
  novaOp.valoresAtributos = JSON.parse(JSON.stringify(linha.valoresAtributos));
  novaOp.respostasLista = JSON.parse(JSON.stringify(linha.respostasLista));
  novaOp.unidadesGrupo = JSON.parse(JSON.stringify(linha.unidadesGrupo));
  novaOp.codigoConfiguracao = linha.codigoConfiguracao;
  novaOp.clienteId = pedido.clienteId;
  novaOp.pedidoId = pedido.id;
  estado.ordensProducao.push(novaOp);
  if (!linha.opsGeradasIds) linha.opsGeradasIds = [];
  linha.opsGeradasIds.push(novaOp.id);
  salvar();
  renderizarDetalhePedido();
}

/* ===== Mapa de Produção ===== */
function renderizarMapaProducao() {
  if (!estado.etapasProducao) estado.etapasProducao = [];
  var el = document.getElementById('mapaProducao');
  var etapasOrdenadas = estado.etapasProducao.slice().sort(function (a, b) { return (a.ordem || 0) - (b.ordem || 0); });
  if (!etapasOrdenadas.length) {
    el.innerHTML = '<div class="aviso-inline">Cadastre as etapas de produção em Configurações antes de usar o mapa.</div>';
    return;
  }
  var colunas = [{ id: '__aguardando', nome: 'Aguardando início' }].concat(etapasOrdenadas).concat([{ id: '__concluido', nome: 'Concluído' }]);
  var html = '<div class="mapa-producao">';
  for (var c = 0; c < colunas.length; c++) {
    var col = colunas[c];
    var ops;
    if (col.id === '__aguardando') ops = estado.ordensProducao.filter(function (o) { return o.status === 'liberada'; });
    else if (col.id === '__concluido') ops = estado.ordensProducao.filter(function (o) { return o.status === 'concluida'; });
    else ops = estado.ordensProducao.filter(function (o) { return o.status === 'em_producao' && o.etapaAtualId === col.id; });
    html += '<div class="coluna-mapa"><div class="coluna-mapa-cab">' + escaparHTML(col.nome) + ' <span class="contagem-estagio">' + ops.length + '</span></div><div class="coluna-mapa-corpo">';
    for (var i = 0; i < ops.length; i++) {
      var op = ops[i];
      var it = acharItemPorId(op.itemId);
      html += '<div class="cartao-op" data-id="' + op.id + '"><strong>' + escaparHTML(op.codigo) + '</strong><div class="sub">' + escaparHTML(it ? it.nome : '?') + '</div><div class="sub">Qtd. ' + op.quantidade + '</div></div>';
    }
    if (!ops.length) html += '<div class="lista-vazia-mini">—</div>';
    html += '</div></div>';
  }
  html += '</div>';
  el.innerHTML = html;
  el.querySelectorAll('.cartao-op').forEach(function (card) {
    card.addEventListener('click', function () {
      mudarAbaPcp('ordens');
      abrirDetalheOP(card.getAttribute('data-id'));
    });
  });
}

      th.classList.remove('arrastando');
      tabela.querySelectorAll('th.th-arrastavel').forEach(function (x) { x.classList.remove('drag-sobre'); });
    });
    th.addEventListener('dragover', function (e) { e.preventDefault(); if (th !== arrastando) th.classList.add('drag-sobre'); });
    th.addEventListener('dragleave', function () { th.classList.remove('drag-sobre'); });
    th.addEventListener('drop', function (e) {
      e.preventDefault();
      th.classList.remove('drag-sobre');
      if (!arrastando || arrastando === th) return;
      var chaves = obterColunasVisiveis(tipoTabela, todasColunas).slice();
      var chaveOrigem = arrastando.getAttribute('data-chave');
      var chaveDestino = th.getAttribute('data-chave');
      var origemIdx = chaves.indexOf(chaveOrigem);
      if (origemIdx === -1) return;
      chaves.splice(origemIdx, 1);
      var destinoIdx = chaves.indexOf(chaveDestino);
      if (destinoIdx === -1) destinoIdx = chaves.length;
      chaves.splice(destinoIdx, 0, chaveOrigem);
      salvarColunasVisiveis(tipoTabela, chaves);
      aoAplicar();
    });
  });
}

function colunasVisiveisFiltradas(tipoTabela, todasColunas) {

  var colunas = [];
  for (var i = 0; i < visiveisChaves.length; i++) {
    for (var j = 0; j < todasColunas.length; j++) {
      if (todasColunas[j].chave === visiveisChaves[i]) { colunas.push(todasColunas[j]); break; }
    }
  }

}
function renderizarTabelaGenerica(tipoTabela, todasColunas, itens) {
  var colunas = colunasVisiveisFiltradas(tipoTabela, todasColunas);

  var linhas = itens.map(function (item) { return colLinha(item, colunas); });
  TABELAS_CTX[tipoTabela] = { colunas: colunas, linhas: linhas };
  var exibidas = linhas.filter(function (l) { return colPassa(st, l.tx); });
  if (st.ordem && colunas.some(function (c) { return c.chave === st.ordem.chave; })) {
    var kOrd = st.ordem.chave;
    var tOrd = colTipoDe(linhas.map(function (l) { return l.tx[kOrd]; }));
    exibidas.sort(function (a, b) { return colOrdenarCmp(tOrd, st.ordem.dir, a.tx[kOrd], b.tx[kOrd]); });
  }
  var html = colFiltroTopoHTML(tipoTabela, colunas);
  html += '<div class="tabela-wrap"><table class="tabela-reordenavel" data-tipo="' + tipoTabela + '"><thead><tr>';
  html += colCabecalhoHTML(tipoTabela, colunas);
  html += '<th></th></tr></thead><tbody>';
  exibidas.forEach(function (l) {
    html += '<tr data-id="' + l.item.id + '" class="linha-clicavel">';
    colunas.forEach(function (c) { html += '<td>' + l.html[c.chave] + '</td>'; });
    html += '<td class="col-acao">&#8250;</td></tr>';
  });
  if (!exibidas.length) html += '<tr><td colspan="' + (colunas.length + 1) + '" class="muted" style="text-align:center; padding:18px;">Nenhum registro com esses filtros.</td></tr>';
  html += '</tbody></table></div>';

function wireCampoBusca(idCampo, obterOpcoes, aoSelecionar) {
  var visual = document.querySelector('.in-busca-visual[data-alvo="' + idCampo + '"]');
  var hidden = document.getElementById(idCampo);
  var lista = document.querySelector('.busca-resultados[data-alvo="' + idCampo + '"]');
  if (!visual || !hidden || !lista) return;
  function renderizarResultados(termo) {
    var opcoes = obterOpcoes(termo || '');
    if (!opcoes.length) { lista.innerHTML = '<div class="busca-vazia">Nada encontrado.</div>'; lista.style.display = 'block'; return; }
    var html = '';
    for (var i = 0; i < opcoes.length; i++) html += '<div class="busca-opcao" data-id="' + escaparHTML(opcoes[i].id) + '" data-texto="' + escaparHTML(opcoes[i].texto) + '">' + escaparHTML(opcoes[i].texto) + '</div>';
    lista.innerHTML = html;
    lista.style.display = 'block';
    lista.querySelectorAll('.busca-opcao').forEach(function (op) {
      op.addEventListener('mousedown', function (e) {
        e.preventDefault();
        hidden.value = op.getAttribute('data-id');
        visual.value = op.getAttribute('data-texto');
        lista.style.display = 'none';
        if (aoSelecionar) aoSelecionar(hidden.value);
      });
    });
  }
  visual.addEventListener('focus', function () { renderizarResultados(''); });
  visual.addEventListener('input', function () { hidden.value = ''; renderizarResultados(visual.value); });
  visual.addEventListener('blur', function () { setTimeout(function () { lista.style.display = 'none'; }, 150); });
}

function usarArtifact() {
  if (typeof window.claude === 'undefined' || !window.claude.use) return Promise.resolve(null);
  return window.claude.use('artifact');
}
function salvar() {
  usarArtifact().then(function (art) {
    if (!art) { salvarLocal(); return; }
    status('Salvando...', 'salvando');
    var html = montarHTML(estado);
    art.publish(html).then(function () {
      status('Salvo', '');
    }).catch(function (err) {
      var codigo = err && err.code ? err.code : 'erro';
      if (codigo === 'conflict') { status('Atualizado — recarregando...', 'salvando'); return; }
      if (codigo === 'not_writer' || codigo === 'not_granted') { status('Somente leitura', 'leitura'); return; }
      status('Não foi possível salvar (' + codigo + ')', 'erro');
    });
  }).catch(function () { salvarLocal(); });
}
var CHAVE_LOCAL = 'central_rodriaco_dados_v1';
function salvarLocal() {
  try {
    localStorage.setItem(CHAVE_LOCAL, JSON.stringify({ estado: estado, salvoEm: new Date().toISOString() }));
    status('Salvo neste navegador', '');
  } catch (e) {
    status('Alterações não são salvas nesta visualização', 'leitura');
  }
}
function carregarLocalSeExistir() {
  var salvo = null;
  try {
    var raw = localStorage.getItem(CHAVE_LOCAL);
    salvo = raw ? JSON.parse(raw) : null;
  } catch (e) { salvo = null; }
  if (!salvo || !salvo.estado || !salvo.estado.familias) return false;
  estado = salvo.estado;
  if (!estado.ordensProducao) estado.ordensProducao = [];
  if (!estado.orcamentos) estado.orcamentos = [];
  if (!estado.pedidos) estado.pedidos = [];
  if (!estado.etapasProducao) estado.etapasProducao = [];

/* ===== ACESSO AO ERP (login do Supabase; so conta ATIVA entra) ===== */
var appIniciado = false;
var ACESSO = { admin: false, modulos: {} };
/* chaves: 'modulo' (inteiro; contas antigas e modulos sem subareas) ou 'modulo.sub' */
function podeSub(modulo, sub) {
  if (ACESSO.admin) return true;
  return !!(ACESSO.modulos[modulo] || ACESSO.modulos[modulo + '.' + sub]);
}
function podeModulo(chave) {
  if (chave === 'inicio') return true;
  if (chave === 'contas') return !!ACESSO.admin;
  if (ACESSO.admin || ACESSO.modulos[chave]) return true;
  var subs = SUBMENUS[chave];
  if (!subs) return false;
  for (var i = 0; i < subs.length; i++) { if (ACESSO.modulos[chave + '.' + subs[i][0]]) return true; }
  return false;
}
function primeiraSub(modulo) {
  var subs = SUBMENUS[modulo] || [];
  for (var i = 0; i < subs.length; i++) { if (podeSub(modulo, subs[i][0])) return subs[i][0]; }
  return subs.length ? subs[0][0] : '';
}
function temAlgumModulo() {
  for (var k in ACESSO.modulos) { if (ACESSO.modulos[k]) return true; }
  return false;
}
function contaAcessos() {
  return logFetchAut('/rest/v1/rpc/meus_acessos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).then(function (r) {
    if (!r.ok) { var e = new Error('status'); e.status = r.status; throw e; }
    return r.json();
  });
}
function criarTelaAcesso() {
  var el = document.getElementById('telaAcesso');
  if (!el) { el = document.createElement('div'); el.id = 'telaAcesso'; el.className = 'tela-acesso'; document.body.appendChild(el); }
  return el;
}
function fecharTelaAcesso() {
  var el = document.getElementById('telaAcesso');
  if (el && el.parentNode) el.parentNode.removeChild(el);
}
function acessoCard(interno) {
  return '<div class="acesso-card"><div class="acesso-marca"><div class="selo">R</div><strong>RODRIAÇO</strong></div>' + interno + '</div>';
}
function telaAcessoLogin(mensagem, aoLiberar) {
  var el = criarTelaAcesso();
  el.innerHTML = acessoCard(
    '<h2>Central Rodriaço</h2>' +
    '<p class="dica">Entre com o seu e-mail e a sua senha.</p>' +
    '<div class="campo"><label>E-mail</label><input type="email" id="acessoEmail" autocomplete="username"></div>' +
    '<div class="campo"><label>Senha</label><input type="password" id="acessoSenha" autocomplete="current-password"></div>' +
    '<div class="modal-aviso" id="acessoErro" style="' + (mensagem ? '' : 'display:none;') + '">' + escaparHTML(mensagem || '') + '</div>' +
    '<button type="button" class="btn btn-primario" id="acessoBtnEntrar">Entrar</button>');
  function entrar() {
    var erro = document.getElementById('acessoErro');
    var email = document.getElementById('acessoEmail').value.trim();
    var senha = document.getElementById('acessoSenha').value;
    if (!email || !senha) { erro.textContent = 'Preencha e-mail e senha.'; erro.style.display = 'block'; return; }
    var btn = document.getElementById('acessoBtnEntrar');
    btn.disabled = true;
    logEntrar(email, senha).then(function () { conferirAcesso(aoLiberar); }).catch(function (e) {
      btn.disabled = false;
      erro.textContent = e.message || 'Não foi possível entrar.';
      erro.style.display = 'block';
    });
  }
  document.getElementById('acessoBtnEntrar').addEventListener('click', entrar);
  document.getElementById('acessoSenha').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });
  document.getElementById('acessoEmail').focus();
}
function telaAcessoPendente(aoLiberar) {
  var s = logObterSessao();
  var el = criarTelaAcesso();
  el.innerHTML = acessoCard(
    '<h2>Aguardando liberação</h2>' +
    '<p class="dica">A conta <strong>' + escaparHTML((s && s.email) || '') + '</strong> entrou, mas ainda não foi liberada. Peça ao administrador da Central para ativar o seu acesso e depois toque em "Verificar de novo".</p>' +
    '<button type="button" class="btn btn-primario" id="acessoBtnDeNovo">Verificar de novo</button>' +
    '<button type="button" class="btn btn-contorno" id="acessoBtnSair">Sair</button>');
  document.getElementById('acessoBtnDeNovo').addEventListener('click', function () { exigirAcesso(aoLiberar); });
  document.getElementById('acessoBtnSair').addEventListener('click', sairDoErp);
}
function telaAcessoSemModulo(aoLiberar) {
  var s = logObterSessao();
  var el = criarTelaAcesso();
  el.innerHTML = acessoCard(
    '<h2>Sem módulos liberados</h2>' +
    '<p class="dica">A conta <strong>' + escaparHTML((s && s.email) || '') + '</strong> está ativa, mas ainda não tem nenhum módulo liberado. Peça ao administrador da Central para marcar o que você pode usar e depois toque em "Verificar de novo".</p>' +
    '<button type="button" class="btn btn-primario" id="acessoBtnDeNovo">Verificar de novo</button>' +
    '<button type="button" class="btn btn-contorno" id="acessoBtnSair">Sair</button>');
  document.getElementById('acessoBtnDeNovo').addEventListener('click', function () { exigirAcesso(aoLiberar); });
  document.getElementById('acessoBtnSair').addEventListener('click', sairDoErp);
}
function telaAcessoErro(aoLiberar, e) {
  var el = criarTelaAcesso();
  var detalhe = e && e.status ? 'O Supabase respondeu com erro ' + e.status + '. Se for 404, o banco_acessos.sql ainda não foi rodado neste projeto do Supabase.' : 'Não consegui falar com o Supabase. Confira a internet.';
  el.innerHTML = acessoCard(
    '<h2>Não consegui conferir o acesso</h2><p class="dica">' + escaparHTML(detalhe) + '</p>' +
    '<button type="button" class="btn btn-primario" id="acessoBtnDeNovo">Tentar de novo</button>' +
    '<button type="button" class="btn btn-contorno" id="acessoBtnSair">Sair</button>');
  document.getElementById('acessoBtnDeNovo').addEventListener('click', function () { exigirAcesso(aoLiberar); });
  document.getElementById('acessoBtnSair').addEventListener('click', sairDoErp);
}
function conferirAcesso(aoLiberar) {
  return contaAcessos().then(function (a) {
    if (!a || a.status !== 'ativo') { telaAcessoPendente(aoLiberar); return; }
    ACESSO = { admin: !!a.admin, modulos: a.modulos || {} };
    if (!ACESSO.admin && !temAlgumModulo()) { telaAcessoSemModulo(aoLiberar); return; }
    liberarApp(aoLiberar);
  }).catch(function (e) {
    if (e && e.message === 'sem sessão') telaAcessoLogin('Sua sessão expirou. Entre de novo.', aoLiberar);
    else telaAcessoErro(aoLiberar, e);
  });
}
function liberarApp(aoLiberar) {
  fecharTelaAcesso();
  var s = logObterSessao();
  var email = (s && s.email) || '';
  var el = document.getElementById('usuarioEmail');
  if (el) el.textContent = email || 'Conectado';
  var ini = document.getElementById('usuarioInicial');
  if (ini) ini.textContent = (email || '?').charAt(0).toUpperCase();
  var pill = document.getElementById('pillUsuario');
  if (pill) pill.title = email;
  var btnOp = document.getElementById('btnAbrirOperador');
  if (btnOp) btnOp.style.display = podeModulo('operador') ? '' : 'none';
  var btn = document.getElementById('btnSairErp');
  if (btn && !btn.getAttribute('data-ligado')) { btn.setAttribute('data-ligado', '1'); btn.addEventListener('click', sairDoErp); }
  if (!appIniciado) { appIniciado = true; aoLiberar(); }
}
function sairDoErp() {
  logSair();
  location.reload();
}
function exigirAcesso(aoLiberar) {
  if (!logObterSessao()) { telaAcessoLogin('', aoLiberar); return; }
  criarTelaAcesso().innerHTML = acessoCard('<h2>Central Rodriaço</h2><p class="dica">Verificando acesso...</p>');
  conferirAcesso(aoLiberar);
}

/* ===== CONTAS E ACESSOS (so administrador) ===== */
var CONTAS_PRESETS = [
  { id: 'pcp', nome: 'PCP', modulos: ['cadastros', 'pcp', 'logistica', 'operador'] },
  { id: 'comercial', nome: 'Comercial', modulos: ['cadastros', 'comercial'] },
  { id: 'logistica', nome: 'Logística', modulos: ['logistica'] },
  { id: 'operador', nome: 'Operador', modulos: ['operador'] },
  { id: 'todos', nome: 'Todos os módulos', modulos: '*' },
  { id: 'nenhum', nome: 'Nenhum módulo', modulos: [] }
];
var contasLista = null;
var contasBusca = '';
/* [{chave, nome, subs: [[chave, nome], ...] | null}] — o que da para liberar */
function contasGrade() {
  var l = [];
  MODULOS.forEach(function (m) {
    if (m.disponivel && !m.somenteAdmin) l.push({ chave: m.chave, nome: m.nome, subs: SUBMENUS[m.chave] || null });
  });
  l.push({ chave: 'operador', nome: 'Área do Operador', subs: null });
  return l;
}
/* modulo inteiro ('cadastros') vira todas as subareas ('cadastros.itens', ...) */
function contasConjunto(modulos) {
  var out = {};
  contasGrade().forEach(function (g) {
    if (!g.subs) { if (modulos[g.chave]) out[g.chave] = true; return; }
    g.subs.forEach(function (s) {
      if (modulos[g.chave] || modulos[g.chave + '.' + s[0]]) out[g.chave + '.' + s[0]] = true;
    });
  });
  return out;
}
function contasResumoHTML(modulos) {
  var set = contasConjunto(modulos), partes = [];
  contasGrade().forEach(function (g) {
    if (!g.subs) { if (set[g.chave]) partes.push(escaparHTML(g.nome)); return; }
    var marcadas = g.subs.filter(function (s) { return set[g.chave + '.' + s[0]]; });
    if (!marcadas.length) return;
    partes.push(marcadas.length === g.subs.length ? escaparHTML(g.nome) :
      escaparHTML(g.nome) + ' <span class="muted">(' + marcadas.map(function (s) { return escaparHTML(s[1]); }).join(', ') + ')</span>');
  });
  return partes.length ? partes.join(' &middot; ') : '<span class="muted">Nenhum módulo</span>';
}
function contasExpandir(chaves) {
  var out = {};
  contasGrade().forEach(function (g) {
    if (chaves !== '*' && chaves.indexOf(g.chave) === -1) return;
    if (!g.subs) { out[g.chave] = 'editar'; return; }
    g.subs.forEach(function (s) { out[g.chave + '.' + s[0]] = 'editar'; });
  });
  return out;
}
function contasApi(caminho, opcoes) {
  return logFetchAut(caminho, opcoes).then(function (r) {
    return r.text().then(function (t) {
      if (!r.ok) {
        var msg = '';
        try { msg = JSON.parse(t).message || ''; } catch (e) {}
        var err = new Error(msg || ('Erro ' + r.status));
        err.status = r.status;
        throw err;
      }
      try { return t ? JSON.parse(t) : null; } catch (e2) { return null; }
    });
  });
}
function contasEmailEu() { var s = logObterSessao(); return ((s && s.email) || '').toLowerCase(); }
function contasCarregar() {
  return Promise.all([
    contasApi('/rest/v1/perfis?select=id,email,nome,papel,status&order=email.asc'),
    contasApi('/rest/v1/acessos_erp?select=user_id,modulos')
  ]).then(function (r) {
    var mods = {};
    (r[1] || []).forEach(function (a) { mods[a.user_id] = a.modulos || {}; });
    contasLista = (r[0] || []).map(function (p) {
      return { id: p.id, email: p.email || '', nome: p.nome || '', papel: p.papel, status: p.status, modulos: mods[p.id] || {} };
    });
  });
}
function contasMensagem(texto, erro) {
  var el = document.getElementById('contasMsg');
  if (!el) return;
  el.textContent = texto || '';
  el.className = 'contas-msg' + (erro ? ' erro' : '');
}
function contasAcharConta(id) {
  for (var i = 0; i < contasLista.length; i++) { if (contasLista[i].id === id) return contasLista[i]; }
  return null;
}
function contasTabelaHTML() {
  var termo = contasBusca.toLowerCase();
  var eu = contasEmailEu();
  var linhas = contasLista.filter(function (c) {
    return !termo || (c.email + ' ' + c.nome).toLowerCase().indexOf(termo) !== -1;
  });
  if (!linhas.length) return '<div class="lista-vazia">' + (contasLista.length ? 'Nenhuma conta com essa busca.' : 'Nenhuma conta encontrada.') + '</div>';
  var html = '<div class="tabela-wrap"><table class="contas-tabela"><thead><tr><th>Conta</th><th>Situação</th><th>Acessos liberados</th><th>Perfil rápido</th><th></th></tr></thead><tbody>';
  linhas.forEach(function (c) {
    var admin = c.papel === 'admin';
    var meu = c.email.toLowerCase() === eu;
    var ativa = c.status === 'ativo';
    html += '<tr data-conta="' + escaparHTML(c.id) + '">' +
      '<td><strong>' + escaparHTML(c.nome || c.email) + '</strong>' + (meu ? ' <span class="muted">(você)</span>' : '') + '<div class="sub">' + escaparHTML(c.email) + '</div></td>' +
      '<td>' + (admin ? '<span class="badge-status status-op-aberta">Administrador</span>' :
        (ativa ? '<span class="badge-status status-op-concluida">Ativa</span>' : '<span class="badge-status status-op-cancelada">Desativada</span>')) + '</td>';
    if (admin) html += '<td class="resumo muted">Todos os módulos</td><td class="muted">—</td><td></td>';
    else {
      html += '<td class="resumo">' + contasResumoHTML(c.modulos) + '</td>' +
        '<td><select data-preset><option value="">Aplicar perfil…</option>' +
        CONTAS_PRESETS.map(function (p) { return '<option value="' + p.id + '">' + escaparHTML(p.nome) + '</option>'; }).join('') + '</select></td>' +
        '<td class="acoes"><button type="button" class="btn btn-primario btn-sm" data-acao="permissoes">Permissões</button> ' +
        (meu ? '' : '<button type="button" class="btn btn-contorno btn-sm" data-acao="' + (ativa ? 'desativar' : 'ativar') + '">' + (ativa ? 'Desativar' : 'Ativar') + '</button>') + '</td>';
    }
    html += '</tr>';
  });
  return html + '</tbody></table></div>';
}
function contasRedesenhar() {
  var el = document.getElementById('contasTabela');
  if (el) el.innerHTML = contasTabelaHTML();
}
function renderizarContas() {
  var el = document.getElementById('contasErp');
  if (!el) return;
  if (!contasLista) {
    el.innerHTML = '<div class="lista-vazia">Carregando as contas...</div>';
    contasCarregar().then(renderizarContas).catch(function (e) {
      el.innerHTML = '<div class="lista-vazia">Não consegui ler as contas (' + escaparHTML(e.message || 'erro') + '). Confira se o <code>banco_acessos.sql</code> foi rodado e se você é administrador.</div>' +
        '<div class="detalhe-acoes" style="margin-top:12px;"><button type="button" class="btn btn-primario" id="contasBtnTentar">Tentar de novo</button></div>';
      document.getElementById('contasBtnTentar').addEventListener('click', function () { contasLista = null; renderizarContas(); });
    });
    return;
  }
  el.innerHTML = '' +
    '<div class="dashboard-cab"><h2>Contas e acessos</h2><div class="log-acoes">' +
      '<button type="button" class="btn btn-contorno btn-sm" id="contasBtnAtualizar">&#8635; Atualizar</button></div></div>' +
    '<p class="dica">Para criar uma conta: Supabase &rsaquo; Authentication &rsaquo; Users &rsaquo; Add user (marque <em>Auto Confirm User</em>). Ela aparece aqui sem nenhum módulo. Em <strong>Permissões</strong> você marca o módulo (vem tudo marcado) e tira as subáreas que a pessoa não deve ver. Mudanças valem no próximo login dela. Administrador acessa tudo.</p>' +
    '<div class="contas-topo"><div class="campo"><label>Buscar conta</label><input type="text" id="contasBusca" placeholder="Nome ou e-mail" autocomplete="off" value="' + escaparHTML(contasBusca) + '"></div>' +
    '<div class="contas-msg" id="contasMsg"></div></div>' +
    '<div id="contasTabela">' + contasTabelaHTML() + '</div>';
  document.getElementById('contasBtnAtualizar').addEventListener('click', function () { contasLista = null; renderizarContas(); });
  document.getElementById('contasBusca').addEventListener('input', function (e) { contasBusca = e.target.value.trim(); contasRedesenhar(); });
  var tab = document.getElementById('contasTabela');
  tab.addEventListener('change', contasMudou);
  tab.addEventListener('click', contasClicou);
}
function contasGravarModulos(conta, modulos) {
  contasMensagem('Salvando...', false);
  return contasApi('/rest/v1/acessos_erp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ user_id: conta.id, modulos: modulos, atualizado_em: new Date().toISOString(), atualizado_por: contasEmailEu() })
  }).then(function () {
    conta.modulos = modulos;
    contasMensagem('Salvo: ' + conta.email, false);
  }).catch(function (e) {
    contasMensagem('Não salvou (' + (e.message || 'erro') + ').', true);
  });
}
function contasMudou(e) {
  var t = e.target;
  if (!t.hasAttribute || !t.hasAttribute('data-preset')) return;
  var tr = t.closest ? t.closest('tr[data-conta]') : null;
  var conta = tr ? contasAcharConta(tr.getAttribute('data-conta')) : null;
  var preset = null;
  CONTAS_PRESETS.forEach(function (p) { if (p.id === t.value) preset = p; });
  if (!conta || !preset) return;
  contasGravarModulos(conta, contasExpandir(preset.modulos)).then(contasRedesenhar);
}
/* janela de permissoes: modulo marca/desmarca todas as subareas; cada subarea pode ser tirada */
function contasAbrirPermissoes(conta) {
  var set = contasConjunto(conta.modulos);
  var corpo = '<p class="dica">Marque o módulo para liberar todas as subáreas e desmarque as que <strong>' + escaparHTML(conta.email) + '</strong> não deve ver.</p><div id="permLista">';
  contasGrade().forEach(function (g) {
    corpo += '<div class="perm-grupo" data-pg="' + g.chave + '"><label class="perm-mod"><input type="checkbox" data-pm="' + g.chave + '"' + (!g.subs && set[g.chave] ? ' checked' : '') + '> <strong>' + escaparHTML(g.nome) + '</strong></label>';
    if (g.subs) {
      corpo += '<div class="perm-subs">';
      g.subs.forEach(function (s) {
        corpo += '<label><input type="checkbox" data-ps="' + g.chave + '.' + s[0] + '"' + (set[g.chave + '.' + s[0]] ? ' checked' : '') + '> ' + escaparHTML(s[1]) + '</label>';
      });
      corpo += '</div>';
    }
    corpo += '</div>';
  });
  corpo += '</div>';
  function sincronizar() {
    document.querySelectorAll('#permLista .perm-grupo').forEach(function (grupo) {
      var subs = grupo.querySelectorAll('[data-ps]');
      if (!subs.length) return;
      var marcadas = grupo.querySelectorAll('[data-ps]:checked').length;
      var pm = grupo.querySelector('[data-pm]');
      pm.checked = marcadas === subs.length;
      pm.indeterminate = marcadas > 0 && marcadas < subs.length;
    });
  }
  abrirModalBase('Permissões — ' + (conta.nome || conta.email), corpo, [
    { texto: 'Cancelar', classe: 'btn-contorno', aoClicar: function () { return true; } },
    { texto: 'Salvar', classe: 'btn-primario', aoClicar: function () {
        var modulos = {};
        document.querySelectorAll('#permLista [data-ps]:checked').forEach(function (c) { modulos[c.getAttribute('data-ps')] = 'editar'; });
        document.querySelectorAll('#permLista [data-pm]').forEach(function (c) {
          if (!c.closest('.perm-grupo').querySelector('[data-ps]') && c.checked) modulos[c.getAttribute('data-pm')] = 'editar';
        });
        contasGravarModulos(conta, modulos).then(contasRedesenhar);
        return true;
      } }
  ]);
  document.getElementById('permLista').addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-pm')) {
      var grupo = t.closest('.perm-grupo');
      grupo.querySelectorAll('[data-ps]').forEach(function (c) { c.checked = t.checked; });
    }
    sincronizar();
  });
  sincronizar();
}
function contasClicou(e) {
  var b = e.target.closest ? e.target.closest('[data-acao]') : null;
  if (!b) return;
  var tr = b.closest('tr[data-conta]');
  var conta = tr ? contasAcharConta(tr.getAttribute('data-conta')) : null;
  if (!conta) return;
  var acao = b.getAttribute('data-acao');
  if (acao === 'permissoes') { contasAbrirPermissoes(conta); return; }
  var ativar = acao === 'ativar';
  if (!ativar && !window.confirm('Desativar ' + conta.email + '? A pessoa deixa de entrar na Central (e nos outros apps que usam esta conta).')) return;
  contasMensagem('Salvando...', false);
  contasApi('/rest/v1/perfis?id=eq.' + encodeURIComponent(conta.id), {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ status: ativar ? 'ativo' : 'pendente' })
  }).then(function () {
    conta.status = ativar ? 'ativo' : 'pendente';
    contasMensagem((ativar ? 'Ativada: ' : 'Desativada: ') + conta.email, false);
    contasRedesenhar();
  }).catch(function (er) { contasMensagem('Não salvou (' + (er.message || 'erro') + ').', true); });
}

function inicializarApp() {
  var elDados = document.getElementById('dados-inicial');
  try { estado = elDados ? JSON.parse(elDados.textContent) : JSON.parse(JSON.stringify(ESTADO_PADRAO)); }
  catch (e) { estado = JSON.parse(JSON.stringify(ESTADO_PADRAO)); }
  if (!estado || !estado.familias) estado = JSON.parse(JSON.stringify(ESTADO_PADRAO));
  if (!estado.ordensProducao) estado.ordensProducao = [];
  if (!estado.orcamentos) estado.orcamentos = [];
  if (!estado.pedidos) estado.pedidos = [];
  if (!estado.etapasProducao) estado.etapasProducao = [];
  if (!estado.operadores) estado.operadores = [];

  montarNavbar();
  renderizarDashboard();
  renderizarTabstrip();

  document.getElementById('modalOverlay').addEventListener('click', function (e) { if (e.target.id === 'modalOverlay') fecharModal(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('ativo')) fecharModal();
  });

  var btnOperador = document.getElementById('btnAbrirOperador');
  if (btnOperador) btnOperador.addEventListener('click', function () { if (podeModulo('operador')) entrarModoOperador(null); });
  if (location.hash.indexOf('#operador') === 0 && podeModulo('operador')) {
    var mOp = location.hash.match(/op=([^&]+)/);
    entrarModoOperador(mOp ? decodeURIComponent(mOp[1]) : null);
  }

  usarArtifact().then(function (art) {
    if (art) return;
    var salvoEm = carregarLocalSeExistir();
    if (salvoEm) {
      var quando = (typeof salvoEm === 'string') ? new Date(salvoEm).toLocaleString('pt-BR') : '';
      status('Carregado deste navegador' + (quando ? ' (salvo em ' + quando + ')' : ''), '');
    } else {
      status('Dados salvos neste navegador', '');
    }
  });
}
exigirAcesso(inicializarApp);
